<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Earbrief</title>
<style>
  /* --h is the accent hue: set on :root for the selected front, and per-card /
     per-tab for each front's own color. Hue-derived colors (--accent & co.)
     are declared on :root, .ep AND .ftab below — a custom property is
     substituted where it is DECLARED, so a plain :root declaration would
     ignore a card-level --h override. The theme blocks only set the
     hue-independent knobs (--acc-s/l, --acc-ink-s/l) plus the page palette. */
  :root {
    --h: 28;
    --acc-s: 72%; --acc-l: 38%;
    --acc-ink-s: 0%; --acc-ink-l: 100%;
    --ground: hsl(var(--h) 22% 96%);
    --ground-2: hsl(var(--h) 30% 92%);
    --surface: #ffffff;
    --surface-2: hsl(var(--h) 16% 93%);
    --glass: hsla(0, 0%, 100%, 0.82);
    --ink: hsl(var(--h) 18% 14%);
    --muted: hsl(var(--h) 10% 44%);
    --line: hsl(var(--h) 14% 86%);
    --done: hsl(140 42% 38%);
    --shadow: 0 1px 2px hsl(var(--h) 30% 20% / 0.06), 0 8px 24px -12px hsl(var(--h) 30% 20% / 0.25);
    --shadow-dock: 0 2px 6px hsl(var(--h) 30% 15% / 0.10), 0 16px 40px -12px hsl(var(--h) 30% 15% / 0.35);
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --acc-s: 88%; --acc-l: 64%;
      --acc-ink-s: 60%; --acc-ink-l: 8%;
      --ground: hsl(var(--h) 16% 9%);
      --ground-2: hsl(var(--h) 20% 12%);
      --surface: hsl(var(--h) 14% 13%);
      --surface-2: hsl(var(--h) 12% 18%);
      --glass: hsl(var(--h) 14% 13% / 0.82);
      --ink: hsl(var(--h) 20% 92%);
      --muted: hsl(var(--h) 8% 62%);
      --line: hsl(var(--h) 10% 24%);
      --done: hsl(140 45% 60%);
      --shadow: 0 1px 2px hsl(0 0% 0% / 0.3), 0 8px 24px -12px hsl(0 0% 0% / 0.5);
      --shadow-dock: 0 2px 6px hsl(0 0% 0% / 0.35), 0 16px 40px -12px hsl(0 0% 0% / 0.6);
    }
  }
  :root[data-theme="light"] {
    --acc-s: 72%; --acc-l: 38%; --acc-ink-s: 0%; --acc-ink-l: 100%;
    --ground: hsl(var(--h) 22% 96%); --ground-2: hsl(var(--h) 30% 92%);
    --surface: #ffffff; --surface-2: hsl(var(--h) 16% 93%);
    --glass: hsla(0, 0%, 100%, 0.82);
    --ink: hsl(var(--h) 18% 14%); --muted: hsl(var(--h) 10% 44%); --line: hsl(var(--h) 14% 86%);
    --done: hsl(140 42% 38%);
    --shadow: 0 1px 2px hsl(var(--h) 30% 20% / 0.06), 0 8px 24px -12px hsl(var(--h) 30% 20% / 0.25);
    --shadow-dock: 0 2px 6px hsl(var(--h) 30% 15% / 0.10), 0 16px 40px -12px hsl(var(--h) 30% 15% / 0.35);
  }
  :root[data-theme="dark"] {
    --acc-s: 88%; --acc-l: 64%; --acc-ink-s: 60%; --acc-ink-l: 8%;
    --ground: hsl(var(--h) 16% 9%); --ground-2: hsl(var(--h) 20% 12%);
    --surface: hsl(var(--h) 14% 13%); --surface-2: hsl(var(--h) 12% 18%);
    --glass: hsl(var(--h) 14% 13% / 0.82);
    --ink: hsl(var(--h) 20% 92%); --muted: hsl(var(--h) 8% 62%); --line: hsl(var(--h) 10% 24%);
    --done: hsl(140 45% 60%);
    --shadow: 0 1px 2px hsl(0 0% 0% / 0.3), 0 8px 24px -12px hsl(0 0% 0% / 0.5);
    --shadow-dock: 0 2px 6px hsl(0 0% 0% / 0.35), 0 16px 40px -12px hsl(0 0% 0% / 0.6);
  }
  :root, .ep, .ftab {
    --accent: hsl(var(--h) var(--acc-s) var(--acc-l));
    --accent-soft: hsl(var(--h) var(--acc-s) var(--acc-l) / 0.13);
    --accent-ink: hsl(var(--h) var(--acc-ink-s) var(--acc-ink-l));
  }
  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    font-family: var(--sans);
    font-size: 16px; /* explicit base for better mobile rendering */
    color: var(--ink);
    background: linear-gradient(180deg, var(--ground-2), var(--ground) 18rem);
    margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; /* prevent iOS from auto-scaling */
  }
  .wrap {
    max-width: 42rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 11rem; /* room for the dock */
  }
  header.top { margin-bottom: 1.25rem; }
  .brand {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  h1 {
    font-size: 1.55rem;
    font-weight: 750;
    margin: 0.35rem 0 0.75rem;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  /* ---- front switcher ---- */
  .fronts {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding: 0.15rem 0.15rem 0.5rem;
    margin: 0 -0.15rem 0.35rem;
    scrollbar-width: none;
  }
  .fronts::-webkit-scrollbar { display: none; }
  .ftab {
    --h: var(--fh, 28);
    font: 600 0.8rem/1 var(--sans);
    letter-spacing: 0.01em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    padding: 0.5rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s;
  }
  .ftab:active { transform: scale(0.97); }
  .ftab .fdot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .ftab .n {
    font-family: var(--mono);
    font-size: 0.62rem;
    padding: 0.1rem 0.38rem;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
  }
  .ftab[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .ftab[aria-pressed="true"] .fdot { background: var(--accent-ink); }
  .ftab[aria-pressed="true"] .n { background: hsl(0 0% 100% / 0.22); color: var(--accent-ink); }
  .ftab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* ---- stats ---- */
  .stats {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .stats .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.22rem 0.65rem;
    background: var(--surface);
  }
  .stats .pill b { color: var(--ink); font-weight: 600; }
  .stats .syncbtn {
    font: inherit;
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    cursor: pointer;
  }
  .stats .syncbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .syncbox { margin-top: 0.6rem; }
  .syncbox textarea {
    width: 100%;
    font: 0.75rem/1.4 var(--mono);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 0.5rem 0.6rem;
    resize: none;
  }
  .syncbox .hint {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }
  .settings { margin-top: 0.7rem; font-size: 0.8rem; }
  .settings summary {
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .settings .vrow { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  .settings .vrow label {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    min-width: 2rem;
  }
  .settings select {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 0.8rem;
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
  }
  section h2 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 1.6rem 0 0.7rem;
  }
  .list { display: flex; flex-direction: column; gap: 0.75rem; }
  /* ---- episode card ---- */
  .ep {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 0.95rem 1rem 0.85rem;
    box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .ep.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .ep .meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.16rem 0.5rem;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .chip.deepdive { background: var(--accent); color: var(--accent-ink); }
  .chip.frontname { background: none; border-color: var(--line); color: var(--muted); }
  .langchip {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.16rem 0.45rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .langchip.pinned { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .langchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ep h3 {
    font-size: 1.02rem;
    font-weight: 650;
    margin: 0.45rem 0 0.6rem;
    line-height: 1.35;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .bar {
    height: 4px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.7rem;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, hsl(var(--h) 80% 55%), var(--accent));
    border-radius: 3px;
  }
  .ep.done .bar i { background: var(--done); }
  .row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .btn {
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    text-decoration: none;
    transition: transform 0.1s, background 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn svg { width: 0.75rem; height: 0.75rem; flex: none; }
  .btn:focus-visible, summary:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .spacer { flex: 1; }
  .donechk {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
  }
  .donechk input { accent-color: var(--accent); }
  .raterow { display: flex; align-items: center; gap: 0.1rem; margin-top: 0.5rem; }
  .raterow .star {
    font-size: 1.05rem;
    line-height: 1;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0.15rem 0.2rem;
    transition: transform 0.1s;
  }
  .raterow .star:active { transform: scale(1.25); }
  .raterow .star.on { color: var(--accent); }
  .raterow .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .raterow .ratehint {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--muted);
    margin-left: 0.3rem;
  }
  .ep details.txt { margin-top: 0.65rem; }
  .ep details.txt summary {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    cursor: pointer;
  }
  .ep .transcript { font-size: 0.9rem; max-width: 65ch; color: var(--ink); }
  .transcript p { margin: 0.7em 0; }
  .transcript p.now {
    border-left: 2px solid var(--accent);
    padding-left: 0.6rem;
    margin-left: -0.66rem;
  }
  .ep details.srcs { margin-top: 0.35rem; }
  .sourcelist { margin: 0.4rem 0 0.2rem; padding-left: 1.1rem; font-size: 0.8rem; }
  .sourcelist li { margin: 0.25em 0; }
  .sourcelist a { color: var(--accent); text-decoration: none; word-break: break-word; }
  .sourcelist a:hover, .sourcelist a:focus-visible { text-decoration: underline; }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    border: 1px dashed var(--line);
    border-radius: 18px;
    padding: 1.2rem;
    text-align: center;
  }
  /* ---- transport dock ---- */
  .transport {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(0.75rem + env(safe-area-inset-bottom));
    padding: 0 0.75rem;
    pointer-events: none;
  }
  .transport .inner {
    pointer-events: auto;
    max-width: 42rem;
    margin: 0 auto;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow-dock);
    padding: 0.7rem 0.9rem 0.75rem;
  }
  .transport .title {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.5rem;
  }
  .transport .title b { color: var(--ink); font-weight: 600; }
  .transport .controls { display: flex; align-items: center; gap: 0.5rem; }
  .tbtn {
    font-family: var(--mono);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    width: 2.6rem; height: 2.6rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    cursor: pointer;
    flex: none;
    transition: transform 0.1s, background 0.15s;
  }
  .tbtn:active { transform: scale(0.94); }
  .tbtn svg { width: 1rem; height: 1rem; }
  .tbtn.play {
    background: linear-gradient(145deg, hsl(var(--h) 80% 52%), var(--accent));
    border-color: var(--accent);
    color: var(--accent-ink);
    width: 3.4rem; height: 3.4rem;
    box-shadow: 0 6px 16px -6px var(--accent);
  }
  .tbtn.play svg { width: 1.3rem; height: 1.3rem; }
  .tbtn.txt { width: auto; padding: 0 0.75rem; }
  .tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tbar {
    height: 4px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 0.6rem;
  }
  .tbar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, hsl(var(--h) 80% 55%), var(--accent));
    border-radius: 3px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar i, .tbar i { transition: width 0.3s ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ftab, .btn, .tbtn, .raterow .star { transition: none; }
  }
  
  /* ---- mobile optimization ---- */
  @media (max-width: 640px) {
    h1 { font-size: 1.75rem; }
    .brand { font-size: 0.75rem; }
    .ftab { font-size: 0.875rem; padding: 0.6rem 0.95rem; }
    .ftab .n { font-size: 0.7rem; }
    .stats { font-size: 0.8rem; }
    .stats .pill { padding: 0.3rem 0.75rem; }
    section h2 { font-size: 0.8rem; }
    .ep { padding: 1.1rem 1.15rem 1rem; }
    .ep .meta { font-size: 0.72rem; }
    .ep .flabel { font-size: 0.7rem; padding: 0.25rem 0.6rem; }
    .ep h3 { font-size: 1.15rem; }
    .ep .ex { font-size: 0.95rem; line-height: 1.55; }
    .ep .dur { font-size: 0.72rem; }
    .btn { font-size: 0.875rem; padding: 0.65rem 1.1rem; }
    .raterow .star { width: 2rem; height: 2rem; }
    .syncbox textarea { font-size: 0.8rem; }
    .syncbox .hint { font-size: 0.7rem; }
    .settings summary { font-size: 0.78rem; }
    .settings .vrow label { font-size: 0.75rem; }
    .settings select { font-size: 0.85rem; }
    .dock { padding: 0.85rem 1rem; }
    .playbtn { width: 3.2rem; height: 3.2rem; }
    .playbtn svg { width: 1.4rem; height: 1.4rem; }
    .tinfo h4 { font-size: 0.95rem; }
    .tinfo .tsub { font-size: 0.75rem; }
    .tbtn { width: 2.2rem; height: 2.2rem; }
    .tbtn svg { width: 1rem; height: 1rem; }
    .tbar { font-size: 0.7rem; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span>earbrief · <span id="brand-front">on air</span></div>
    <h1 id="headline">Your briefing queue</h1>
    <nav class="fronts" id="fronts" aria-label="Fronts" hidden></nav>
    <div class="stats">
      <span class="pill"><b id="st-pending">0</b> pending</span>
      <span class="pill"><b id="st-min">0</b> min in queue</span>
      <span class="pill"><b id="st-done">0</b> listened</span>
      <button class="pill syncbtn" id="st-sync" hidden></button>
    </div>
    <div class="syncbox" id="syncbox" hidden>
      <textarea id="synctext" rows="2" readonly aria-label="Sync message to copy"></textarea>
      <div class="hint">clipboard is blocked here — long-press the text above to copy it, then paste it to your AI assistant</div>
    </div>
    <details class="settings">
      <summary>voices</summary>
      <div class="vrow"><label for="voice-en">EN</label><select id="voice-en" aria-label="English TTS voice"></select></div>
      <div class="vrow"><label for="voice-es">ES</label><select id="voice-es" aria-label="Spanish TTS voice"></select></div>
    </details>
  </header>

  <section>
    <h2>Up next</h2>
    <div class="list" id="pending"></div>
  </section>

  <section>
    <details id="donewrap">
      <summary style="cursor:pointer"><h2 style="display:inline-block;margin:1rem 0 0.6rem">Listened</h2></summary>
      <div class="list" id="donelist"></div>
    </details>
  </section>
</div>

<div class="transport">
  <div class="inner">
    <div class="title" id="t-title">Nothing playing — pick an episode</div>
    <div class="controls">
      <button class="tbtn" id="t-prev" aria-label="Previous paragraph"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2h2v12H3zM13 2 6 8l7 6z"/></svg></button>
      <button class="tbtn play" id="t-play" aria-label="Play or pause"><svg id="t-play-ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg></button>
      <button class="tbtn" id="t-next" aria-label="Next paragraph"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 2h2v12h-2zM3 2l7 6-7 6z"/></svg></button>
      <span class="spacer"></span>
      <button class="tbtn txt" id="t-lang" aria-label="Listening language (auto: news in Spanish, deep-dives in English)">AUTO</button>
      <button class="tbtn txt" id="t-rate" aria-label="Playback speed">1×</button>
    </div>
    <div class="tbar"><i id="t-bar"></i></div>
  </div>
</div>

const FRONTS = [{"id": "ai", "label": "AI Engineering", "hue": 28}, {"id": "fp", "label": "Functional Programming", "hue": 200}, {"id": "navegacion", "label": "Sailing Navigation", "hue": 170}]; // [{id, label, hue}] display order; >1 → switcher shows
const EPISODES = [{"id": "fp/2026-09-25-deepdive-a1", "front": "fp", "date": "2026-09-25", "type": "deepdive", "title": "The function: signatures, composition, and the type as a specification", "words": 3087, "text": "I want to start with a question that sounds trivial but contains a hidden revolution. When you write a function, what is it actually for? Most engineers will say it's for computing something — given some inputs, produce an output. That's true, but it's incomplete. The deeper truth is that a function is a contract. And the signature of that function — the type information about what goes in and what comes out — is the written form of that contract. And once you learn to read contracts, everything changes about how you design systems.\n\nHere's why this matters, especially for someone building or reasoning about complex systems like machine learning pipelines or agent orchestration. The difference between a function whose type tells you what it does and a function whose type tells you almost nothing is the difference between code you can confidently combine and code that will surprise you at runtime. This is not academic. It's the difference between a codebase that breaks when you refactor and one where the compiler tells you the safe moves before you even test.\n\nLet me ground this with a concrete example, because the idea becomes real only when you see it applied.\n\nImagine you're building a feature engineering pipeline for a machine learning model. You have some raw data, and you need to transform it. In most imperative code, you might write a function that looks like this: takes in some data, mutates it in place, returns nothing explicitly — or worse, returns the mutated data and also has side effects you have to remember. But there's a cleaner path. You write a function with a signature that says: I take a data frame of type A, and I return a data frame of type B. That's not just documentation. That's a constraint. If the types A and B are different — maybe A has raw features and B has normalized features — then you now have a promise that gets checked at compile time. Any code that feeds the output of this function somewhere expecting raw features will fail before you run it. You've turned a class of runtime bugs into a refactoring error that the compiler catches.\n\nThis is the first level of what types are really doing: they're making your assumptions explicit and mechanically verifiable. But there's a deeper layer.\n\nThe second insight is about composition. Functions with clear signatures are composable. Let me illustrate that with the same pipeline. Once you have a function that takes raw data and produces normalized data, and another function that takes normalized data and produces feature vectors, and a third that takes feature vectors and produces predictions, you can chain them together. The signature of each function describes exactly how it fits to the next. The output type of the normalizer is the input type of the feature extractor. The compiler can verify that they fit together before you ever run the code. This is function composition at the type level, and it's profound because it means you can build complex systems out of small, verified pieces.\n\nBut here's the thing that really changes your thinking: composition is not just about piping data through functions. It's about building larger functions from smaller ones. If you have a function that normalizes data and a function that extracts features, you can build a single function that does both, and its signature is just the composition of the two: raw data in, features out. That composed function has the same property of clarity and composability as the originals. You can keep composing, building larger and larger functions, and at every level the types keep you honest.\n\nNow I need to address the question every engineer asks at this point: isn't this restrictive? Don't you lose flexibility when everything has to match types?\n\nThe answer is counterintuitive. The constraint is not restrictive, it's clarifying. When you sit down to design a piece of code and you have to decide on the types — what goes in, what comes out — you're forced to think clearly about what that code is supposed to do. You can't be vague. You can't have a function that might take a string or an integer or a list and might return any of those or none. You have to commit to a contract. And that commitment forces you to think in a way that most engineers only do for their most critical code. It's like writing a formal specification, except the specification is the code itself. They're the same thing.\n\nAnd here's the payoff I want you to carry out of this: once your code is typed, refactoring becomes safe. In dynamic languages, refactoring is scary. You change something and you hope you caught all the places it's used. In a typed system, you change the type of a function and the compiler tells you every place that breaks. Not at runtime — at compile time. You get a checklist of everything that needs to change. And you can be confident that once the compiler is happy, you haven't missed anything. You can refactor aggressively because you have guarantees.\n\nLet's go deeper into composition because it's where the real power emerges.\n\nFunction composition is just the mathematical idea that if you have a function from A to B, and a function from B to C, you can build a function from A to C by running them in sequence. The intermediate type B vanishes — it becomes an implementation detail. All that matters at the interface is that you started with A and ended with C. This is trivial mathematics. It's also the key to building systems that scale in complexity without scaling in incomprehensibility.\n\nIn practice, this looks like having small functions that each do one clear thing, each with a simple type signature. And then building larger functions by composing them. A function that loads data. A function that validates it. A function that transforms it. A function that stores it. Each one has a signature that says exactly what it accepts and what it produces. And you can combine them in any order that makes sense type-wise — if the output of one doesn't match the input of the next, the compiler says no before you deploy.\n\nBut there's a psychological shift that happens when you really internalize this. You start thinking about functions not as subroutines that do stuff, but as transformations. A function is a thing that turns one type into another type. That perspective changes how you decompose a problem. Instead of thinking about a series of steps you're going to execute, you think about a series of type transformations. And once you're thinking in type transformations, composition becomes the obvious way to structure code. You're not gluing pieces together. You're building a pipeline where the output type of each stage matches the input type of the next.\n\nI want to point out something subtle here that matters a lot for people building machine learning systems. In the modern ML world, data shape is almost as important as the data itself. A feature vector that's supposed to be five hundred dimensions is useless if it's actually three thousand. A label tensor that should be batch size times ten is broken if it's batch size times a hundred. These are exactly the kinds of errors that types catch. And they're errors that can be devastating in production because they can silently propagate through your pipeline, corrupting downstream outputs in ways that are hard to debug.\n\nWhen you commit to clear types in your ML pipeline — the shape of raw data, the shape of normalized features, the shape of the labels — you turn shape mismatches into compile-time errors. Or, in languages that aren't compiled in the traditional sense, you turn them into errors that happen at the entry point of your code, not buried deep in matrix multiplication.\n\nNow let me address the relationship between types and testing, because this is where the idea really becomes economically interesting.\n\nIn dynamically typed systems, testing is the primary tool for catching bugs. You have to write tests for all the paths through your code because the language can't verify that your types are compatible. You test the happy path, the sad path, the edge cases. It's a lot of work, and it's fundamentally incomplete — you can never test every possibility.\n\nIn typed systems, types catch whole categories of bugs automatically. You don't need to test that a function that's supposed to take an integer doesn't accidentally get a string, because the type system prevents it. You don't need to test that the output of function A can be passed to function B, because the compiler verifies it. This means your tests can focus on the actual logic, on the semantic behavior, not on type mismatches. Your test suite becomes smaller and more focused. And that's not just efficiency — it's a sign that the code is actually clearer.\n\nLet me summarize the shape of the idea so you can carry it forward.\n\nA function is not just a computation. It's a contract, and the type signature is the contract in written form. That signature says: I will accept this type and produce this type, and no other. The clarity of that contract matters because it lets you reason about larger systems. When you combine functions through composition, the types of the functions have to match — output of one equals input of the next. That matching is not a limitation. It's a guarantee. The type system becomes a mechanical proof that your larger system is correctly connected.\n\nAnd here's the insight that changes how you design: you can design a large system by specifying nothing but the types. What are the inputs? What are the outputs? What are the intermediate representations? Once you've written down those types, the actual implementation often becomes obvious, sometimes trivial. The hard part is getting the types right, because the types are the specification. Get the types right and the code almost writes itself.\n\nThis is especially powerful in machine learning contexts where the shape and interpretation of data matter intensely. Commit to types for your data shapes, your transformations, your models. And then build your system by composing functions that respect those types. The result is a system where shape mismatches and architectural errors are caught early, and refactoring is safe.\n\nThe practical path forward is to start small. Pick a part of your system where the logic is clear and the types are easy to specify. Write functions with explicit types. Compose them. Feel the difference when the compiler tells you that you've made a mistake in how you connected things, before you run anything. Most of you are probably not going to immediately switch to a purely typed language. But you can apply this thinking to the parts of your code that matter most. And the ones you'll apply it to first are the ones where bugs are most expensive — data pipelines, model interfaces, the boundaries between systems.\n\nIn the next part of this track we move on to what happens when you want to work with data that persists across function calls — how you keep state without sacrificing the clarity that pure functions give you. Immutability and persistent data structures. You've earned the foundation to understand it.", "sources": [{"name": "Category Theory for Programmers: Types and Functions", "url": "https://bartoszmilewski.com/2014/11/24/types-and-functions/"}, {"name": "Just Enough FP: Composition", "url": "https://kyleshevlin.com/just-enough-fp-composition/"}, {"name": "The Haskell Report: Type System", "url": "https://www.haskell.org/onlinereport/"}, {"name": "Simply Typed Lambda Calculus", "url": "https://en.wikipedia.org/wiki/Simply_typed_lambda_calculus"}, {"name": "Bartosz Milewski — Category: The Essence of Composition", "url": "https://bartoszmilewski.com/2014/11/04/category-the-essence-of-composition/"}], "title_es": "La función: firmas, composición, y el tipo como especificación", "text_es": "Quiero comenzar con una pregunta que suena trivial pero contiene una revolución escondida. Cuando escribes una función, ¿para qué sirve realmente? La mayoría de los ingenieros dirían que es para computar algo — dados algunos inputs, producir un output. Es verdad, pero está incompleto. La verdad más profunda es que una función es un contrato. Y la firma de esa función — la información de tipos sobre qué entra y qué sale — es la forma escrita de ese contrato. Y una vez que aprendes a leer contratos, todo cambia sobre cómo diseñas sistemas.\n\nAquí es donde importa, especialmente para alguien construyendo o razonando sobre sistemas complejos como pipelines de machine learning u orquestación de agents. La diferencia entre una función cuyo tipo te dice qué hace y una función cuyo tipo te dice casi nada es la diferencia entre código que puedes combinar con confianza y código que te sorprenderá en runtime. No es académico. Es la diferencia entre una base de código que se rompe cuando refactorizas y una donde el compilador te dice los movimientos seguros antes de que ni siquiera pruebes.\n\nDéjame anclar esto con un ejemplo concreto, porque la idea se hace real solo cuando la ves aplicada.\n\nImagina que estás construyendo un pipeline de ingeniería de features para un modelo de machine learning. Tienes algunos datos crudos y necesitas transformarlos. En la mayoría del código imperativo, podrías escribir una función que se vea así: toma algunos datos, los muta en lugar, no devuelve nada explícitamente — o peor, devuelve los datos mutados y también tiene efectos secundarios que tienes que recordar. Pero hay un camino más limpio. Escribes una función con una firma que dice: tomo un dataframe de tipo A y devuelvo un dataframe de tipo B. Eso no es solo documentación. Es una restricción. Si los tipos A y B son diferentes — quizás A tiene features crudos y B tiene features normalizados — entonces ahora tienes una promesa que se verifica en tiempo de compilación. Cualquier código que alimente el output de esta función a algún lugar esperando features crudos fallará antes de que la ejecutes. Has convertido una clase de bugs en runtime en un error de refactorización que el compilador atrapa.\n\nEste es el primer nivel de lo que los tipos realmente hacen: hacen tus suposiciones explícitas y mecánicamente verificables. Pero hay una capa más profunda.\n\nLa segunda intuición es sobre composición. Las funciones con firmas claras son componibles. Déjame ilustrar eso con el mismo pipeline. Una vez que tienes una función que toma datos crudos y produce datos normalizados, y otra función que toma datos normalizados y produce vectores de features, y una tercera que toma vectores de features y produce predicciones, puedes encadenarlos juntos. La firma de cada función describe exactamente cómo se ajusta a la siguiente. El tipo de output del normalizador es el tipo de input del extractor de features. El compilador puede verificar que se ajusten juntos antes de que ejecutes el código. Esta es composición de funciones en el nivel de tipos, y es profunda porque significa que puedes construir sistemas complejos a partir de piezas pequeñas y verificadas.\n\nPero aquí está la cosa que realmente cambia tu pensamiento: la composición no es solo sobre canalizar datos a través de funciones. Es sobre construir funciones más grandes a partir de más pequeñas. Si tienes una función que normaliza datos y una función que extrae features, puedes construir una sola función que haga ambas, y su firma es solo la composición de las dos: datos crudos adentro, features afuera. Esa función compuesta tiene la misma propiedad de claridad y componibilidad que los originales. Puedes seguir componiendo, construyendo funciones cada vez más grandes, y en cada nivel los tipos te mantienen honesto.\n\nAhora necesito abordar la pregunta que cada ingeniero hace en este punto: ¿no es esto restrictivo? ¿No pierdes flexibilidad cuando todo tiene que coincidir en tipos?\n\nLa respuesta es contraintuitiva. La restricción no es restrictiva, es clarificadora. Cuando te sientas a diseñar un pedazo de código y tienes que decidir sobre los tipos — qué entra, qué sale — te ves forzado a pensar claramente sobre qué se supone que debe hacer ese código. No puedes ser vago. No puedes tener una función que podría tomar un string o un entero o una lista y podría devolver cualquiera de esos o nada. Tienes que comprometerte a un contrato. Y ese compromiso te fuerza a pensar de una manera que la mayoría de los ingenieros solo hacen en su código más crítico. Es como escribir una especificación formal, excepto que la especificación es el código mismo. Son lo mismo.\n\nY aquí está el payoff que quiero que lleves: una vez que tu código es tipado, la refactorización se vuelve segura. En lenguajes dinámicos, refactorizar es aterrador. Cambias algo y esperas haber atrapado todos los lugares donde se usa. En un sistema tipado, cambias el tipo de una función y el compilador te dice todos los lugares que se rompen. No en runtime — en tiempo de compilación. Obtienes una lista de control de todo lo que necesita cambiar. Y puedes estar seguro de que una vez que el compilador está feliz, no te has perdido nada. Puedes refactorizar agresivamente porque tienes garantías.\n\nVamos más profundo en composición porque es donde emerges el poder real.\n\nLa composición de funciones es solo la idea matemática de que si tienes una función de A a B, y una función de B a C, puedes construir una función de A a C ejecutándolas en secuencia. El tipo intermedio B desaparece — se convierte en un detalle de implementación. Todo lo que importa en la interfaz es que comenzaste con A y terminaste con C. Esta es matemática trivial. Es también la clave para construir sistemas que escalen en complejidad sin escalar en incomprehensibilidad.\n\nEn la práctica, esto se ve como tener funciones pequeñas que cada una haga una cosa clara, cada una con una firma de tipo simple. Y luego construir funciones más grandes componiendo las pequeñas. Una función que carga datos. Una función que los valida. Una función que los transforma. Una función que los almacena. Cada una tiene una firma que dice exactamente qué acepta y qué produce. Y puedes combinarlas en cualquier orden que tenga sentido en tipos — si el output de una no coincide con el input de la siguiente, el compilador dice no antes de que despliegues.\n\nPero hay un cambio psicológico que sucede cuando realmente interiorizas esto. Empiezas a pensar sobre funciones no como subrutinas que hacen cosas, sino como transformaciones. Una función es una cosa que convierte un tipo en otro tipo. Esa perspectiva cambia cómo descompones un problema. En lugar de pensar en una serie de pasos que vas a ejecutar, piensas en una serie de transformaciones de tipos. Y una vez que estás pensando en transformaciones de tipos, la composición se vuelve la forma obvia de estructurar el código. No estás pegando piezas. Estás construyendo un pipeline donde el tipo de output de cada etapa coincide con el tipo de input de la siguiente.\n\nQuiero señalar algo sutil aquí que importa mucho para las personas construyendo sistemas de machine learning. En el mundo moderno de ML, la forma de los datos es casi tan importante como los datos mismos. Un vector de features que debería ser de quinientos dimensiones es inútil si en realidad es de tres mil. Un tensor de labels que debería ser tamaño de lote por diez está roto si es tamaño de lote por cien. Estos son exactamente los tipos de errores que los tipos atrapan. Y son errores que pueden ser devastadores en producción porque pueden propagarse silenciosamente a través de tu pipeline, corrompiendo outputs corriente abajo de formas que son difíciles de depurar.\n\nCuando te comprometes a tipos claros en tu pipeline de ML — la forma de datos crudos, la forma de features normalizados, la forma de los labels — conviertes desajustes de forma en errores en tiempo de compilación. O, en lenguajes que no se compilan de la forma tradicional, los conviertes en errores que suceden en el punto de entrada de tu código, no enterrados profundamente en multiplicación de matrices.\n\nAhora déjame abordar la relación entre tipos y testing, porque aquí es donde la idea realmente se vuelve económicamente interesante.\n\nEn sistemas dinámicamente tipados, el testing es la herramienta primaria para atrapar bugs. Tienes que escribir tests para todos los caminos a través de tu código porque el lenguaje no puede verificar que tus tipos sean compatibles. Pruebas el camino feliz, el camino triste, los casos límite. Es mucho trabajo, y es fundamentalmente incompleto — nunca puedes probar todas las posibilidades.\n\nEn sistemas tipados, los tipos atrapan categorías enteras de bugs automáticamente. No necesitas probar que una función que debería tomar un entero no accidentalmente reciba un string, porque el sistema de tipos lo previene. No necesitas probar que el output de la función A pueda pasarse a la función B, porque el compilador lo verifica. Esto significa que tus tests pueden enfocarse en la lógica actual, en el comportamiento semántico, no en desajustes de tipos. Tu suite de tests se vuelve más pequeña y más enfocada. Y eso no es solo eficiencia — es una señal de que el código es realmente más claro.\n\nDéjame resumir la forma de la idea para que puedas llevarla adelante.\n\nUna función no es solo una computación. Es un contrato, y la firma del tipo es el contrato en forma escrita. Esa firma dice: aceptaré este tipo y produciré este tipo, y ningún otro. La claridad de ese contrato importa porque te permite razonar sobre sistemas más grandes. Cuando combinas funciones a través de composición, los tipos de las funciones tienen que coincidir — output de una equivale a input de la siguiente. Ese emparejamiento no es una limitación. Es una garantía. El sistema de tipos se convierte en una prueba mecánica de que tu sistema más grande está correctamente conectado.\n\nY aquí está el insight que cambia cómo diseñas: puedes diseñar un sistema grande especificando nada más que los tipos. ¿Cuáles son los inputs? ¿Cuáles son los outputs? ¿Cuáles son las representaciones intermedias? Una vez que hayas anotado esos tipos, la implementación actual a menudo se vuelve obvia, a veces trivial. La parte difícil es acertar los tipos, porque los tipos son la especificación. Acierta los tipos y el código casi se escribe a sí mismo.\n\nEsto es especialmente poderoso en contextos de machine learning donde la forma e interpretación de los datos importa intensamente. Comprométete a tipos para tus formas de datos, tus transformaciones, tus modelos. Y luego construye tu sistema componiendo funciones que respeten esos tipos. El resultado es un sistema donde los desajustes de forma y los errores arquitectónicos se atrapan temprano, y refactorizar es seguro.\n\nEl camino práctico hacia adelante es comenzar pequeño. Elige una parte de tu sistema donde la lógica es clara y los tipos son fáciles de especificar. Escribe funciones con tipos explícitos. Compónelas. Siente la diferencia cuando el compilador te dice que has cometido un error en cómo conectaste las cosas, antes de que ejecutes nada. La mayoría de ustedes probablemente no van a cambiar inmediatamente a un lenguaje completamente tipado. Pero puedes aplicar este pensamiento a las partes de tu código que importan más. Y los que lo aplicarás primero son los donde los bugs son más caros — pipelines de datos, interfaces de modelos, las fronteras entre sistemas.\n\nEn la siguiente parte de esta pista avanzamos hacia lo que sucede cuando quieres trabajar con datos que persisten a través de llamadas de función — cómo mantienes estado sin sacrificar la claridad que las funciones puras te dan. Inmutabilidad y estructuras de datos persistentes. Has ganado la fundación para entenderlo."}, {"id": "ai/2026-09-23-article-3", "front": "ai", "date": "2026-09-23", "type": "article", "title": "Brian Houck on Code Review: The Visible Output is Better Code, The Invisible is a Better Organization", "words": 1498, "text": "Brian Houck from DX asks the question that precedes all others: what was code review actually solving before AI arrived?\n\nThe numbers are sobering. At Meta, lines of code per human diff jumped one hundred six percent year over year. Diffs per developer per month rose fifty-one percent. Eighty percent of that came from agentic AI. Meanwhile, diffs reviewed within twenty-four hours are declining. In some large groups, reviewers face thousands of pending reviews.\n\nThe math is broken. Developers want to spend about seven percent of their time on review. AI is generating enough code that it would require ten times that. You can't ask humans to move faster. So the question becomes: what do we lose if we automate review away?\n\nHere's what Brian found: developers identified defect detection as the primary reason for code review. But defect-related comments made up only fourteen percent of actual review comments. In practice, code review serves many other purposes. More than half of developers use reviews to explore alternative solutions. Many pointed to knowledge transfer and gaining awareness of what teammates are building.\n\nThe visible output of code review is better code. The invisible output is a better engineering organization.\n\nThis is the distinction Brian is pushing against the tech world to understand. Code review is how teams build shared understanding of a system. It's how junior developers learn from experienced ones. It's how architectural intent gets surfaced, questioned, and refined. It's how one engineer's mental model becomes the team's mental model.\n\nOrganizations don't become resilient because one person understands a subsystem. They become resilient because many people do.\n\nSo when Meta's RADAR system lands three hundred thirty thousand diffs with a third of the revert rate and one-fiftieth the production incidents, that's operationally stunning. But what does it mean for the engineers who didn't see those diffs? What did they not learn? What mental models didn't get shared? What questions never got asked because the code auto-merged while people were in meetings?\n\nBrian isn't anti-automation. He's pro-deliberation. The solution isn't to ask humans to review faster. It's to ask: which changes actually deserve human attention? Which ones need human judgment, not just verification? Which ones need to be seen because they teach something?\n\nHe calls this the difference between code review as a gate and code review as a forum. Gating is about safety. Forum is about learning. AI can gate effectively. But it can't replace the forum.\n\nThe uncomfortable truth is that many organizations have been ignoring good code review practices for years. Keep changes small. Write meaningful descriptions. Run automated checks before asking humans. Review frequently, in bounded sessions. Select reviewers who know the code.\n\nResearch from two thousand sixteen showed that timely feedback, review size, and understanding the motivation for change were the top three challenges. That research was a decade old before AI arrived. The problems weren't new. They were just ignored at scale.\n\nAI didn't create this crisis. It inherited it and amplified it.\n\nSo Brian's argument is surgical: before asking AI to fix code review, ask whether your team built the habits that make code review effective in the first place. Small changes. Protected reviewer time. Automated routine checks so humans focus on judgment.\n\nOnce those fundamentals are in place, AI has a role. The developers DX interviewed don't want review to disappear. They want AI to remove the parts that don't require human judgment so human attention can go where it matters. Catch security issues. Flag high-risk changes. Surface impact. Handle routine. Let humans do judgment.\n\nThe RADAR model walks that line. Low-risk changes auto-merge. High-risk changes go to humans. A stratified system instead of a binary gate.\n\nBut the question remains: as automation expands, what gets lost? The RADAR team acknowledges this explicitly. Automated review improves efficiency. But it could suffer knowledge transfer. That's a tradeoff worth monitoring.\n\nBrian's final move is the most important. Don't ask \"does it work?\" Ask \"how does it maximize the time and value of human judgment?\" That's the metric that matters when AI enters the review process.", "sources": [], "title_es": "Brian Houck on Code Review: The Visible Output is Better Code, The Invisible is a Better Organization", "text_es": "Brian Houck de DX pregunta la pregunta que precede a todas las otras: qué estaba resolviendo code review antes de que IA llegara?\n\nLos números son sobering. En Meta, líneas de código por human diff saltaron ciento seis por ciento year over year. Diffs por developer por mes subieron cincuenta y uno por ciento. Ochenta por ciento vino de IA agentic. Mientras tanto, diffs revieweadas dentro de veinticuatro horas están declining. En algunos grandes grupos, reviewers enfrentan thousands de pending reviews.\n\nLas matemáticas están rotas. Developers quieren gastar acerca de siete por ciento de su tiempo en review. IA está generando suficiente código que requeriría diez veces eso. No puedes pedir a humanos que se muevan más rápido. Así que la pregunta se vuelve: qué perdemos si automatizamos review away?\n\nAquí está lo que Brian encontró: developers identificaron defect detection como la razón primaria para code review. Pero defect-related comments compusieron solo catorce por ciento de actual review comments. En práctica, code review sirve muchos otros propósitos. Más que la mitad de developers usan reviews para explorar soluciones alternativas. Muchos señalaron a knowledge transfer y gaining awareness de qué teammates están construyendo.\n\nEl visible output de code review es mejor código. El invisible output es una mejor organización de ingeniería.\n\nEsta es la distinción que Brian está pusheando contra el mundo tech para entender. Code review es cómo equipos construyen shared understanding de un sistema. Es cómo developers junior aprenden de experienced ones. Es cómo architectural intent obtiene surfaced, cuestionado, y refinado. Es cómo mental model de un ingeniero se vuelve el mental model del equipo.\n\nOrganizaciones no se vuelven resilientes porque una persona entiende un subsystem. Se vuelven resilientes porque muchas lo hacen.\n\nAsí que cuando sistema RADAR de Meta landa trescientos treinta mil diffs con un tercio del revert rate y uno-fiftieth del production incident rate, eso es operationally stunning. Pero qué significa para ingenieros que no vieron esos diffs? Qué no aprendieron? Qué mental models no fueron shared? Qué preguntas nunca fueron hechas porque el código auto-mergeó mientras la gente estaba en meetings?\n\nBrian no es anti-automation. Es pro-deliberation. La solución no es pedir a humanos que revisen más rápido. Es pedir: qué cambios realmente merecen atención humana? Cuáles necesitan human judgment, no solo verification? Cuáles necesitan ser vistos porque enseñan algo?\n\nÉl llama esto la diferencia entre code review como gate y code review como forum. Gating es about safety. Forum es about learning. IA puede gatekeep efectivamente. Pero no puede reemplazar el forum.\n\nLa verdad incómoda es que muchas organizaciones han estado ignorando buenas prácticas de code review por años. Keep changes pequeños. Escribe meaningful descriptions. Corre automated checks antes de pedir humanos. Review frecuentemente, en bounded sessions. Selecciona reviewers que conocen el código.\n\nResearch de dos mil dieciséis mostró que timely feedback, review size, y understanding del motivation para change eran los top tres challenges. Esa research fue una década vieja antes de que IA llegara. Los problemas no eran nuevos. Fueron simplemente ignorados a escala.\n\nIA no creó esta crisis. La heredó y la amplificó.\n\nAsí que el argumento de Brian es surgical: antes de pedir IA que arregle code review, pregunta si tu equipo construyó los habits que hacen code review efectivo en primer lugar. Small changes. Protected reviewer time. Automated routine checks así humanos focusan en judgment.\n\nUna vez que esos fundamentales están en lugar, IA tiene un rol. Los developers que DX entrevistó no quieren que review desaparezca. Quieren que IA remueva las partes que no requieren human judgment así human attention puede ir donde importa. Catch security issues. Flag high-risk changes. Surface impact. Handle routine. Deja humanos hacer judgment.\n\nEl modelo RADAR camina esa línea. Low-risk changes auto-merge. High-risk changes van a humanos. Un sistema stratified en lugar de un binary gate.\n\nPero la pregunta permanece: conforme automation se expande, qué se pierde? El equipo RADAR lo reconoce explícitamente. Automated review mejora efficiency. Pero podría sufrir knowledge transfer. Eso es un tradeoff worth monitoring.\n\nEl final move de Brian es el más importante. No preguntes \"¿funciona?\" Pregunta \"¿cómo maximiza el tiempo y valor del human judgment?\" Esa es la métrica que importa cuando IA entra al review process."}];
const LISTENED = []; // ids checked in log.md at build time (repo = source of truth)
const RATINGS = {}; // id -> 1..5 star rating from log.md at build time
const WPM = 150;
const LS = "aib-v1";
const ICO_PLAY = '<path d="M4 2.5v11l9-5.5z"/>';
const ICO_PAUSE = '<path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>';

// ---------- state ----------
let store = {};
try { store = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { store = {}; }
store.eps = store.eps || {};   // id -> {i: chunkIdx, l: lang the idx refers to, done: bool, r: 1..5 rating}
store.rate = store.rate || 1;
store.lang = store.lang || "auto"; // auto | en | es
store.front = store.front || "all"; // selected front id, or "all"
if (store.front !== "all" && !FRONTS.some(f => f.id === store.front)) store.front = "all";
if (typeof store.voice !== "object" || !store.voice) store.voice = { en: store.voice || "", es: "" };
store.synced = store.synced || []; // repo-listened ids already applied on this device
function save() { localStorage.setItem(LS, JSON.stringify(store)); }
function epState(id) { return store.eps[id] || (store.eps[id] = { i: 0, l: "en", done: false }); }

// seed listened-state from the repo, once per id per device — after that the
// local checkbox is free to disagree (e.g. unchecked for a replay)
LISTENED.forEach(id => {
  if (store.synced.indexOf(id) !== -1) return;
  epState(id).done = true;
  store.synced.push(id);
});
// same seeding contract for ratings: apply each repo rating once, then the
// local stars are free to disagree until the next sync round-trip
store.syncedr = store.syncedr || {}; // id -> repo rating already applied on this device
Object.keys(RATINGS).forEach(id => {
  if (store.syncedr[id] === RATINGS[id]) return;
  epState(id).r = RATINGS[id];
  store.syncedr[id] = RATINGS[id];
});
save();
// local plays the repo doesn't know about yet → offered by the sync button
function unsynced() {
  return EPISODES.filter(e => epState(e.id).done && LISTENED.indexOf(e.id) === -1).map(e => e.id);
}
// local ratings the repo doesn't know about yet, as "id=n" pairs
function unsyncedRatings() {
  return EPISODES.filter(e => epState(e.id).r && epState(e.id).r !== RATINGS[e.id])
    .map(e => e.id + "=" + epState(e.id).r);
}

// ---------- fronts ----------
function frontOf(ep) { return FRONTS.find(f => f.id === ep.front) || { id: ep.front, label: ep.front, hue: 28 }; }
function inView(ep) { return store.front === "all" || ep.front === store.front; }
function viewEpisodes() { return EPISODES.filter(inView); }
function applyFrontTheme() {
  const f = FRONTS.find(x => x.id === store.front);
  document.documentElement.style.setProperty("--h", f ? f.hue : 28);
}

// ---------- chunking (sentence groups <=190 chars, tagged with paragraph idx) ----------
function chunk(text) {
  // defensive sanitization: never speak URLs or markdown links
  text = text.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1'); // [title](url) -> title
  text = text.replace(/\bhttps?:\/\/\S+/g, ''); // remove http/https URLs
  text = text.replace(/\bwww\.\S+/g, ''); // remove www URLs
  text = text.replace(/  +/g, ' '); // collapse double spaces
  const out = [];
  text.split(/\n\s*\n/).forEach((para, p) => {
    const clean = para.replace(/\s+/g, " ").trim();
    if (!clean) return;
    const sentences = clean.match(/[^.!?]+[.!?]+["')\]]*\s*|.+$/g) || [clean];
    let buf = "";
    sentences.forEach(s => {
      if (buf && (buf + s).length > 190) { out.push({ t: buf.trim(), p }); buf = ""; }
      buf += s;
    });
    if (buf.trim()) out.push({ t: buf.trim(), p });
  });
  return out;
}
const CHUNKS = {};
EPISODES.forEach(e => {
  CHUNKS[e.id] = { en: chunk(e.text), es: e.text_es ? chunk(e.text_es) : null };
});

// ---------- language ----------
// precedence: per-episode pin (st.o) > global mode > auto (news→es, deepdive→en)
function langFor(ep) {
  if (!ep.text_es) return "en";
  const o = epState(ep.id).o;
  if (o) return o;
  if (store.lang === "auto") return ep.type === "news" ? "es" : "en";
  return store.lang;
}
function chunksFor(ep) { return CHUNKS[ep.id][langFor(ep)] || CHUNKS[ep.id].en; }
function titleFor(ep) { return langFor(ep) === "es" && ep.title_es ? ep.title_es : ep.title; }
function textFor(ep) { return langFor(ep) === "es" && ep.text_es ? ep.text_es : ep.text; }
// keep listening position when the language changes: map by paragraph index
function syncLang(ep) {
  const st = epState(ep.id);
  const lang = langFor(ep);
  if (st.l === lang) return st;
  const from = CHUNKS[ep.id][st.l] || CHUNKS[ep.id].en;
  const to = chunksFor(ep);
  if (st.done || st.i >= from.length) { st.i = st.done ? to.length : Math.min(st.i, to.length); st.l = lang; return st; }
  const para = (from[st.i] || { p: 0 }).p;
  const idx = to.findIndex(c => c.p === para);
  st.i = idx < 0 ? Math.min(st.i, to.length - 1) : idx;
  st.l = lang;
  return st;
}

// ---------- speech ----------
const synth = window.speechSynthesis;
let cur = null;        // current episode id
let playing = false;
let gen = 0;           // generation guard: cancel() fires onend in some engines
let wakeLock = null;

function epById(id) { return EPISODES.find(e => e.id === id); }
function voices(lang) {
  return synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
}
function pickVoice(lang) {
  const vs = voices(lang);
  return vs.find(v => v.name === store.voice[lang]) || vs.find(v => v.default) || vs[0] || null;
}
function speakChunk() {
  const ep = epById(cur);
  const st = syncLang(ep);
  const chunks = chunksFor(ep);
  if (st.i >= chunks.length) { finishEpisode(); return; }
  const lang = langFor(ep);
  const u = new SpeechSynthesisUtterance(chunks[st.i].t);
  const v = pickVoice(lang);
  if (v) u.voice = v;
  u.lang = lang === "es" ? "es-419" : "en-US";
  u.rate = store.rate;
  const myGen = gen;
  u.onend = () => {
    if (myGen !== gen || !playing) return;
    st.i++; save(); render();
    speakChunk();
  };
  u.onerror = u.onend;
  synth.speak(u);
}
async function play(id) {
  if (cur !== id) { stopSpeech(); cur = id; }
  const st = epState(id);
  if (st.done) { st.done = false; st.i = 0; } // replay
  playing = true;
  gen++;
  synth.cancel();
  speakChunk();
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  render();
}
function stopSpeech() {
  gen++;
  playing = false;
  synth.cancel();
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
function pause() { stopSpeech(); render(); }
function finishEpisode() {
  const ep = epById(cur);
  const st = epState(cur);
  st.done = true; st.i = chunksFor(ep).length;
  stopSpeech(); save(); render();
}
function seekPara(dir) {
  if (!cur) return;
  const ep = epById(cur);
  const st = syncLang(ep);
  const chunks = chunksFor(ep);
  const p = (chunks[Math.min(st.i, chunks.length - 1)] || { p: 0 }).p + dir;
  const idx = chunks.findIndex(c => c.p === Math.max(0, p));
  st.i = idx < 0 ? (dir > 0 ? chunks.length : 0) : idx;
  save();
  if (playing) { gen++; synth.cancel(); speakChunk(); }
  render();
}

// ---------- spark hook (UC5): fire an external AI chat session ----------
function sparkURL(ep) {
  const firstPara = ep.text.split(/\n\s*\n/)[0].slice(0, 400);
  const q = `While listening to my earbrief episode "${ep.title}" (${ep.date}, ${ep.type}, front: ${frontOf(ep).label}), an idea sparked. The episode opens with: "${firstPara}". Ask me what the idea is, then help me deep-dive it. This session is independent of the briefing pipeline.`;
  // Default to Claude, but users can customize to their preferred AI assistant
  return "https://claude.ai/new?q=" + encodeURIComponent(q);
}

// ---------- render ----------
const $ = id => document.getElementById(id);
function mins(ep) {
  const w = langFor(ep) === "es" && ep.text_es ? Math.round(ep.words * 1.05) : ep.words;
  return Math.max(1, Math.round(w / WPM));
}
function pct(ep) {
  const st = syncLang(ep);
  if (st.done) return 100;
  const n = chunksFor(ep).length || 1;
  return Math.round(100 * Math.min(st.i, n) / n);
}
function card(ep) {
  const st = syncLang(ep);
  const el = document.createElement("article");
  el.className = "ep" + (st.done ? " done" : "") + (cur === ep.id ? " current" : "");
  el.style.setProperty("--h", frontOf(ep).hue); // card wears its front's color
  const chipCls = ep.type === "deepdive" ? "chip deepdive" : "chip";
  const chipTxt = ep.type === "deepdive" ? "deep dive" : "news";
  el.innerHTML =
    '<div class="meta"><span class="' + chipCls + '">' + chipTxt + "</span>" +
    (store.front === "all" && FRONTS.length > 1 ? '<span class="chip frontname"></span>' : "") +
    '<button class="langchip' + (st.o ? " pinned" : "") + '" data-act="lang" title="Tap to pin the language for this episode">' + langFor(ep) + (st.o ? " ✱" : "") + "</button>" +
    "<span>" + ep.date + "</span><span>~" + mins(ep) + " min</span>" +
    (st.done ? '<span style="color:var(--done)">✓ listened</span>' : "") + "</div>" +
    "<h3></h3>" +
    '<div class="bar"><i style="width:' + pct(ep) + '%"></i></div>' +
    '<div class="row">' +
    '<button class="btn primary" data-act="play"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    (playing && cur === ep.id ? ICO_PAUSE : ICO_PLAY) + "</svg>" +
    (playing && cur === ep.id ? "Pause" : (st.i > 0 && !st.done ? "Resume" : (st.done ? "Replay" : "Play"))) + "</button>" +
    '<a class="btn" href="' + sparkURL(ep) + '" target="_blank" rel="noopener">✦ Spark</a>' +
    '<span class="spacer"></span>' +
    '<label class="donechk"><input type="checkbox" data-act="done"' + (st.done ? " checked" : "") + "> done</label>" +
    "</div>" +
    (st.done || st.r
      ? '<div class="raterow" role="group" aria-label="Rate this episode">' +
        [1, 2, 3, 4, 5].map(n =>
          '<button class="star' + ((st.r || 0) >= n ? " on" : "") + '" data-star="' + n +
          '" aria-label="' + n + ' of 5 stars">' + ((st.r || 0) >= n ? "★" : "☆") + "</button>").join("") +
        (st.r ? "" : '<span class="ratehint">rate it → steers future episodes</span>') +
        "</div>"
      : "") +
    '<details class="txt"><summary>transcript</summary><div class="transcript"></div></details>' +
    ((ep.sources || []).length ? '<details class="txt srcs"><summary>sources (' + ep.sources.length + ")</summary><ul class=\"sourcelist\"></ul></details>" : "");
  el.querySelector("h3").textContent = titleFor(ep);
  const fn = el.querySelector(".frontname");
  if (fn) fn.textContent = frontOf(ep).label;
  const sl = el.querySelector(".sourcelist");
  if (sl) ep.sources.forEach(s => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = s.name;
    li.appendChild(a);
    sl.appendChild(li);
  });
  const tr = el.querySelector(".transcript");
  const chunks = chunksFor(ep);
  const curPara = (chunks[Math.min(st.i, chunks.length - 1)] || {}).p;
  textFor(ep).split(/\n\s*\n/).forEach((para, p) => {
    if (!para.trim()) return;
    const pe = document.createElement("p");
    pe.textContent = para.trim();
    if (cur === ep.id && p === curPara && !st.done) pe.className = "now";
    tr.appendChild(pe);
  });
  el.querySelector('[data-act="lang"]').onclick = () => {
    if (!ep.text_es) return; // English-only episode, nothing to pin
    const s = epState(ep.id);
    // tap: pin the other language; tap again: back to following the default
    s.o = s.o ? undefined : (langFor(ep) === "en" ? "es" : "en");
    save();
    if (playing && cur === ep.id) { syncLang(ep); gen++; synth.cancel(); speakChunk(); }
    render();
  };
  el.querySelector('[data-act="play"]').onclick = () =>
    (playing && cur === ep.id) ? pause() : play(ep.id);
  el.querySelectorAll("[data-star]").forEach(b => b.onclick = () => {
    const s = epState(ep.id);
    const n = +b.dataset.star;
    s.r = s.r === n ? undefined : n; // tap the current rating again to clear it
    save(); render();
  });
  el.querySelector('[data-act="done"]').onchange = ev => {
    const s = epState(ep.id);
    s.done = ev.target.checked;
    s.i = s.done ? chunksFor(ep).length : 0;
    if (s.done && cur === ep.id) stopSpeech();
    save(); render();
  };
  return el;
}
function renderFronts() {
  const nav = $("fronts");
  nav.hidden = FRONTS.length < 2;
  if (nav.hidden) return;
  nav.innerHTML = "";
  const pendIn = fid => EPISODES.filter(e => (fid === "all" || e.front === fid) && !epState(e.id).done).length;
  [{ id: "all", label: "All", hue: 28 }].concat(FRONTS).forEach(f => {
    const b = document.createElement("button");
    b.className = "ftab";
    b.style.setProperty("--fh", f.hue);
    b.setAttribute("aria-pressed", store.front === f.id);
    const n = pendIn(f.id);
    b.innerHTML = '<span class="fdot"></span><span class="lbl"></span>' + (n ? '<span class="n">' + n + "</span>" : "");
    b.querySelector(".lbl").textContent = f.label;
    b.onclick = () => {
      store.front = f.id;
      save();
      applyFrontTheme();
      render();
    };
    nav.appendChild(b);
  });
}
function render() {
  renderFronts();
  const curFront = FRONTS.find(f => f.id === store.front);
  $("brand-front").textContent = curFront ? curFront.label.toLowerCase() : "all fronts";
  $("headline").textContent = curFront ? curFront.label : "Your briefing queue";
  const pend = $("pending"), done = $("donelist");
  pend.innerHTML = ""; done.innerHTML = "";
  let nPend = 0, nDone = 0, minPend = 0;
  viewEpisodes().forEach(ep => {
    const c = card(ep);
    if (epState(ep.id).done) { done.appendChild(c); nDone++; }
    else { pend.appendChild(c); nPend++; minPend += mins(ep); }
  });
  if (!nPend) pend.innerHTML = '<div class="empty">Queue clear' + (curFront ? " on this front" : "") + ". Next episode lands with the morning routine.</div>";
  $("st-pending").textContent = nPend;
  $("st-done").textContent = nDone;
  $("st-min").textContent = minPend;
  const nSync = unsynced().length + unsyncedRatings().length;
  $("st-sync").hidden = !nSync;
  if (nSync) $("st-sync").textContent = "sync " + nSync + " to log ⇪";
  // transport
  const ep = epById(cur);
  $("t-play-ico").innerHTML = playing ? ICO_PAUSE : ICO_PLAY;
  $("t-rate").textContent = store.rate + "×";
  $("t-lang").textContent = store.lang === "auto" ? "AUTO" : store.lang.toUpperCase();
  if (ep) {
    $("t-title").innerHTML = "<b></b>";
    $("t-title").querySelector("b").textContent = titleFor(ep);
    $("t-bar").style.width = pct(ep) + "%";
  } else {
    $("t-title").textContent = "Nothing playing — pick an episode";
    $("t-bar").style.width = "0";
  }
}

// ---------- wire up ----------
$("t-play").onclick = () => {
  if (!cur) { const first = viewEpisodes().find(e => !epState(e.id).done); if (first) play(first.id); return; }
  playing ? pause() : play(cur);
};
// sandboxed hosts (the artifact viewer iframe) reject the async clipboard API
// and swallow window.prompt without showing anything, so fall back in layers:
// clipboard → execCommand copy → inline selectable text.
function execCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}
$("st-sync").onclick = async () => {
  const us = unsynced(), ur = unsyncedRatings();
  const parts = [];
  if (us.length) parts.push("mark listened: " + us.join(", "));
  if (ur.length) parts.push("rate: " + ur.join(", "));
  if (!parts.length) return;
  const msg = parts.join("; ");
  let ok = false;
  try { await navigator.clipboard.writeText(msg); ok = true; } catch (e) {}
  if (!ok) ok = execCopy(msg);
  if (ok) {
    $("syncbox").hidden = true;
    $("st-sync").textContent = "copied ✓ — paste to your AI assistant";
  } else {
    const ta = $("synctext");
    ta.value = msg;
    $("syncbox").hidden = false;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, msg.length);
    $("st-sync").textContent = "copy it below ↓";
  }
};
$("t-prev").onclick = () => seekPara(-1);
$("t-next").onclick = () => seekPara(1);
$("t-lang").onclick = () => {
  const modes = ["auto", "en", "es"];
  store.lang = modes[(modes.indexOf(store.lang) + 1) % modes.length];
  save();
  if (playing && cur) { gen++; synth.cancel(); speakChunk(); }
  render();
};
$("t-rate").onclick = () => {
  const rates = [1, 1.25, 1.5, 1.75];
  store.rate = rates[(rates.indexOf(store.rate) + 1) % rates.length];
  save();
  if (playing) { gen++; synth.cancel(); speakChunk(); }
  render();
};
function fillVoices() {
  ["en", "es"].forEach(lang => {
    const sel = $("voice-" + lang);
    sel.innerHTML = "";
    const vs = voices(lang);
    if (!vs.length) {
      const o = document.createElement("option");
      o.textContent = "no " + lang.toUpperCase() + " voices installed";
      o.disabled = true;
      sel.appendChild(o);
      return;
    }
    vs.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name + " (" + v.lang + ")";
      if (v.name === store.voice[lang]) o.selected = true;
      sel.appendChild(o);
    });
  });
}
["en", "es"].forEach(lang => {
  $("voice-" + lang).onchange = ev => {
    store.voice[lang] = ev.target.value; save();
    if (playing && cur && langFor(epById(cur)) === lang) { gen++; synth.cancel(); speakChunk(); }
  };
});
if (synth) {
  fillVoices();
  synth.onvoiceschanged = fillVoices;
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && playing && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
applyFrontTheme();
render();
</script>
