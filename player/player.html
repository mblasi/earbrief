 discount on cached input tokens, you're looking directly at this mechanism. The KV cache gets its own full episode, because it is quietly the central resource constraint of the entire serving industry.\n\nPart seven. What a token costs — putting the whole picture together.\n\nLet's do the back-of-envelope, because it's the kind you can now do from first principles. A rule of thumb: generating one token requires roughly two floating point operations per model parameter. A seventy-billion-parameter model: about a hundred and forty billion operations per token. A modern data center GPU does on the order of a quadrillion operations per second, so the arithmetic for one token takes on the order of a tenth of a millisecond. Yet real systems produce maybe fifty to a hundred tokens per second per request — thousands of times slower than pure arithmetic suggests. The gap is exactly what part five predicted: decode isn't waiting on arithmetic, it's waiting on memory. A seventy-billion-parameter model at sixteen-bit precision is a hundred and forty gigabytes of weights that must move from memory to compute for every token. Divide memory bandwidth by model size and you get the real ceiling on tokens per second — a number you can compute from a spec sheet.\n\nThat single calculation explains half the engineering you'll hear about in the coming episodes. Why quantization matters: smaller weights means fewer bytes to move means faster decode, directly proportional. Why batching matters: if you must move all the weights anyway, amortize the trip across fifty concurrent requests. Why speculative decoding exists: use a small model to draft several tokens, and let the big model verify them in one parallel pass — converting serial decode into parallel-ish verification. None of these are tricks anymore; they're the obvious moves once you know where the bottleneck is.\n\nLet's land this.\n\nThe full trace, in one breath: text becomes integers through a frozen tokenizer; integers become vectors through a lookup table; vectors flow through a stack of identical blocks where attention mixes context between tokens and feed-forward layers apply stored knowledge; a final projection produces a probability distribution over the vocabulary; a sampler — plain code, not model — picks one token; and the whole thing loops, one full forward pass per generated token, with the KV cache saving you from recomputing the past at the price of gigabytes of memory.\n\nAnd the three load-bearing takeaways. One: the model is a deterministic function from token sequence to probability distribution; everything that feels like personality or randomness lives in the sampler and the prompt. Two: prefill is parallel and compute-bound, decode is serial and memory-bound — this one asymmetry explains pricing, time to first token, throughput numbers, and most of inference engineering. Three: the KV cache is the hidden protagonist — it's why long context is a memory problem rather than a speed problem, and why prompt caching is one of the few genuine free lunches available to you as an application engineer.\n\nNext episode in this track, we open up attention properly: queries, keys, values, multi-head, causal masking — the actual matrices, small enough numbers that you can hold them in your head. Once you have that, the KV cache episode will feel less like trivia and more like an inevitability.\n\nYou now know what happens when you press enter. Most people building on these models don't. That gap is the point of this whole track.", "sources": [{"name": "Attention Is All You Need (Vaswani et al., 2017)", "url": "https://arxiv.org/abs/1706.03762"}, {"name": "The Illustrated Transformer (Jay Alammar)", "url": "https://jalammar.github.io/illustrated-transformer/"}, {"name": "Andrej Karpathy, Let's build GPT from scratch", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY"}, {"name": "LLM Inference Arithmetic (kipply)", "url": "https://kipp.ly/transformer-inference-arithmetic/"}, {"name": "Efficiently Scaling Transformer Inference (Pope et al., 2022)", "url": "https://arxiv.org/abs/2211.05102"}], "title_es": "Inferencia por dentro: qué pasa realmente cuando llamas a un modelo", "text_es": "Has construido sistemas sobre modelos de lenguaje. Has manejado sus fallas, armado retry loops, diseñado checkpoints con humanos en el circuito. Pero aquí hay una pregunta que vale la pena pensar un rato: cuando mandas un request a la API de un modelo, ¿qué pasa físicamente entre tu llamada HTTP y el primer token que vuelve? Si tu respuesta honesta es \"una multiplicación de matrices gigante, de alguna forma\", este episodio es para ti. Al final vas a poder trazar un request de punta a punta y — más útil todavía — vas a entender por qué la página de precios, el comportamiento de la latencia y los límites del context window son como son.\n\nEmpecemos donde empieza todo request: con texto convirtiéndose en números.\n\nParte uno. Tokenización.\n\nEl modelo nunca ve tu texto. Ve una secuencia de enteros. El tokenizer es un sistema de lookup, construido antes de que el modelo siquiera se entrenara, que corta el texto en piezas de un vocabulario fijo — típicamente entre cincuenta mil y doscientas cincuenta mil entradas. El algoritmo dominante es byte pair encoding, o codificación por pares de bytes. La idea es casi vergonzosamente simple: empiezas con bytes crudos como alfabeto, escaneas un corpus enorme, y una y otra vez fusionas el par adyacente más frecuente en una nueva entrada del vocabulario. Haz eso cien mil veces y obtienes un vocabulario donde palabras comunes como \"the\" son un token, fragmentos comunes como \"ization\" son un token, y las cadenas raras caen a piezas más chicas, hasta llegar a bytes individuales si hace falta.\n\nDe ahí se siguen directamente tres consecuencias prácticas, y te has topado con las tres sin saber necesariamente por qué. Primera: contar tokens no es contar palabras. El inglés promedia más o menos tres cuartos de palabra por token, pero el código, los idiomas distintos del inglés y los formatos inusuales pueden ser dramáticamente menos eficientes. Por eso el mismo contenido semántico en español cuesta más tokens que en inglés — el vocabulario se optimizó para la distribución de entrenamiento, que se inclina hacia el inglés. Segunda: las fallas clásicas — modelos que no logran contar las letras de una palabra, o invertir un string — no son exactamente fallas de razonamiento. El modelo literalmente no puede ver los caracteres; \"strawberry\" puede ser uno o dos tokens, y las letras que tiene adentro no forman parte de su input. Tercera: el tokenizer está congelado. Es un artefacto separado de los pesos del modelo, entrenado una sola vez, y cada una de sus rarezas queda horneada en todo lo que viene después.\n\nAsí que ahora tu prompt es una lista de enteros. Digamos, mil. ¿Qué pasa después?\n\nParte dos. Embeddings — de enteros a geometría.\n\nCada entero indexa una tabla de lookup gigante llamada la embedding matrix. Cada fila de esa tabla es un vector — para un modelo mediano, quizá cuatro mil noventa y seis números. Entonces el token número doce mil se convierte en la fila doce mil: un punto en un espacio de cuatro mil dimensiones. Tu prompt de mil tokens es ahora una matriz de mil por cuatro mil números de punto flotante.\n\nEste es el modelo mental que importa: todo lo que el modelo hace de aquí en adelante es mover esos puntos dentro de ese espacio. La tabla de embeddings se aprende durante el entrenamiento, y termina organizada de modo que la geometría codifica significado — las direcciones en ese espacio corresponden a relaciones semánticas. Pero el embedding crudo de un token es solo su significado de diccionario, sin contexto. La palabra \"bank\" en inglés arranca en el mismo punto ya sea que la oración hable de ríos o de dinero. Todo el trabajo de las capas que siguen es mover el vector de cada token hacia donde le corresponde dado su contexto.\n\nParte tres. El forward pass — una pila de bloques idénticos.\n\nUn transformer es una pila de bloques idénticos — unos treinta para un modelo chico, ochenta o más para uno grande — y cada bloque hace exactamente dos cosas, en secuencia.\n\nCosa uno: attention. Es el único lugar en toda la arquitectura donde los tokens interactúan entre sí. El vector de cada token puede mirar a todos los tokens anteriores y traerse información. El vector de \"bank\" mira hacia atrás, nota que \"river\" apareció tres tokens antes, y se desplaza hacia la región del espacio que corresponde a la orilla del río. Vamos a dedicar un episodio completo a la mecánica — queries, keys, values, múltiples heads — así que por hoy quédate solo con esto: attention es donde ocurre el contexto, y su costo crece con cuántos tokens están mirando a cuántos otros tokens. Ese crecimiento es la razón profunda de que el contexto largo sea caro, y en un momento vamos a ver exactamente dónde aterriza ese costo.\n\nCosa dos: la red feed-forward, a veces llamada el bloque MLP. Después de que attention junta el contexto, el vector de cada token — ahora de forma independiente, sin interacción — pasa por una red neuronal de dos capas que lo expande a quizá cuatro veces su ancho y lo vuelve a comprimir. Aquí es donde vive la mayoría de los parámetros del modelo, más o menos dos tercios, y el mejor entendimiento actual es que funciona como el almacén de conocimiento del modelo: una enorme memoria key-value aprendida donde se aplican los hechos y patrones absorbidos durante el entrenamiento. Attention decide qué es relevante; el bloque feed-forward hace algo con eso.\n\nDespués el bloque le entrega su salida al siguiente bloque idéntico, y el proceso se repite. Las capas tempranas tienden a resolver sintaxis y estructura local; las capas del medio hacen el trabajo semántico pesado; las capas finales convergen en la predicción concreta. Para la última capa, el vector que está en la última posición de tu secuencia ha absorbido, vía attention, información de todo el prompt. Ese único vector está a punto de convertirse en tu próximo token.\n\nParte cuatro. Los logits, y dónde vive realmente la \"aleatoriedad\".\n\nEse vector final se multiplica por una última matriz — muchas veces la misma tabla de embeddings reutilizada al revés — y produce un puntaje por cada entrada del vocabulario. Más de cincuenta mil números crudos llamados logits. Un softmax los convierte en una distribución de probabilidad: el output real y completo del modelo. No un token — una distribución sobre cada posible próximo token.\n\nTodo lo que viene después de este punto no es el modelo. Es un sampler: unas pocas decenas de líneas de código común y corriente que elige un token de esa distribución. La temperature escala los logits antes del softmax — temperatura baja afila la distribución hacia la opción de arriba, temperatura alta la aplana. Top-p recorta la cola larga. El greedy decoding simplemente toma el argmax. Cuando la gente dice que el modelo es \"creativo\" o \"aleatorio\", está describiendo la configuración del sampler, no la red — el forward pass en sí es aritmética de matrices determinista. Viene un episodio completo sobre sampling, incluyendo la pregunta genuinamente interesante de por qué ni siquiera temperature cero te da siempre outputs idénticos bit a bit en producción.\n\nEntonces un forward pass produjo un token. ¿Y ahora qué? Ahora viene la parte brutal.\n\nParte cinco. Autorregresión — el loop que explica tu latencia.\n\nPara obtener el segundo token, el modelo agrega el primer token generado a la secuencia y corre de nuevo. Y de nuevo. Una respuesta de quinientos tokens son quinientos forward passes secuenciales por toda la pila de capas. Secuencial es la palabra clave — el token doscientos no puede computarse antes de que exista el token ciento noventa y nueve. Ninguna cantidad de hardware paralelo elimina esa dependencia.\n\nEste es el hecho estructural más importante de la inferencia de LLMs, y divide cada request en dos fases con caracteres completamente distintos.\n\nLa fase uno es el prefill: procesar tu prompt. Los mil tokens del prompt pueden procesarse en paralelo — ya existen todos, así que el hardware los mastica en una sola pasada grande, eficiente y densa en cómputo. El prefill es rápido por token y es lo que determina el time to first token.\n\nLa fase dos es el decode: generar la respuesta, un token por forward pass, en serie. Cada una de esas pasadas hace poca aritmética, pero tiene que traer decenas de gigabytes de pesos del modelo desde la memoria de la GPU hasta las unidades de cómputo — por cada token individual. Las unidades aritméticas pasan la mayor parte del tiempo esperando a la memoria. El decode está limitado por ancho de banda de memoria, no por cómputo, y esa asimetría vale la pena tatuársela en algún lado: prefill es compute-bound y paralelo, decode es bandwidth-bound y serial.\n\nMira la página de precios de cualquier proveedor con esto en mente y todo encaja. Los tokens de output cuestan varias veces más que los de input — no es marketing, es pura física: los tokens de input se procesan en una pasada paralela, cada token de output requiere un viaje serial completo por toda la máquina. El time to first token escala con el largo del prompt, porque eso es el prefill. Los tokens por segundo después del primero son más o menos constantes, porque esa es la caminadora del decode.\n\nUna pieza más y el cuadro queda completo.\n\nParte seis. El KV cache — la memoria que hace posible el decode.\n\nDe forma ingenua, generar el token quinientos uno significaría volver a correr attention sobre los quinientos tokens anteriores desde cero — rehacer trabajo que ya hiciste. Todo stack de inferencia serio evita esto cacheando los estados intermedios de attention — las keys y los values — de cada token ya procesado. Eso es el KV cache. Con él, cada paso de decode solo computa el estado de attention del token nuevo y lee el resto desde el cache.\n\nEl detalle: ese cache es   $("t-rate").textContent = store.rate + "×";
  $("t-lang").textContent = store.lang === "auto" ? "AUTO" : store.lang.toUpperCase();
  if (ep) {
    $("t-title").innerHTML = "<b></b>";
    $("t-title").querySelector("b").textContent = titleFor(ep);
    $("t-bar").style.width = pct(ep) + "%";
  } else {
    $("t-title").textContent = "Nothing playing — pick an episode";
    $("t-bar").style.width = "0";
  }
}

// ---------- wire up ----------
$("t-play").onclick = () => {
  if (!cur) { const first = viewEpisodes().find(e => !epState(e.id).done); if (first) play(first.id); return; }
  playing ? pause() : play(cur);
};
// sandboxed hosts (the artifact viewer iframe) reject the async clipboard API
// and swallow window.prompt without showing anything, so fall back in layers:
// clipboard → execCommand copy → inline selectable text.
function execCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}
$("st-sync").onclick = async () => {
  const us = unsynced(), ur = unsyncedRatings();
  const parts = [];
  if (us.length) parts.push("mark listened: " + us.join(", "));
  if (ur.length) parts.push("rate: " + ur.join(", "));
  if (!parts.length) return;
  const msg = parts.join("; ");
  let ok = false;
  try { await navigator.clipboard.writeText(msg); ok = true; } catch (e) {}
  if (!ok) ok = execCopy(msg);
  if (ok) {
    $("syncbox").hidden = true;
    $("st-sync").textContent = "copied ✓ — paste to your AI assistant";
  } else {
    const ta = $("synctext");
    ta.value = msg;
    $("syncbox").hidden = false;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, msg.length);
    $("st-sync").textContent = "copy it below ↓";
  }
};
$("t-prev").onclick = () => seekPara(-1);
$("t-next").onclick = () => seekPara(1);
$("t-lang").onclick = () => {
  const modes = ["auto", "en", "es"];
  store.lang = modes[(modes.indexOf(store.lang) + 1) % modes.length];
  save();
  if (playing && cur) { gen++; synth.cancel(); speakChunk(); }
  render();
};
$("t-rate").onclick = () => {
  const rates = [1, 1.25, 1.5, 1.75];
  store.rate = rates[(rates.indexOf(store.rate) + 1) % rates.length];
  save();
  if (playing) { gen++; synth.cancel(); speakChunk(); }
  render();
};
function fillVoices() {
  ["en", "es"].forEach(lang => {
    const sel = $("voice-" + lang);
    sel.innerHTML = "";
    const vs = voices(lang);
    if (!vs.length) {
      const o = document.createElement("option");
      o.textContent = "no " + lang.toUpperCase() + " voices installed";
      o.disabled = true;
      sel.appendChild(o);
      return;
    }
    vs.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name + " (" + v.lang + ")";
      if (v.name === store.voice[lang]) o.selected = true;
      sel.appendChild(o);
    });
  });
}
["en", "es"].forEach(lang => {
  $("voice-" + lang).onchange = ev => {
    store.voice[lang] = ev.target.value; save();
    if (playing && cur && langFor(epById(cur)) === lang) { gen++; synth.cancel(); speakChunk(); }
  };
});
if (synth) {
  fillVoices();
  synth.onvoiceschanged = fillVoices;
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && playing && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
applyFrontTheme();
render();
</script>
