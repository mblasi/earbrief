very en un caso así podría exponer el roadmap de hardware de OpenAI y sus prácticas internas, porque va a enfriar el libre movimiento de talento de AI del que ha vivido toda la industria, y porque señala que los laboratorios ahora consideran que el hardware de consumo, no solo los modelos, es el próximo campo de batalla.\n\nConclusión filosa: la era del poaching amistoso de talento entre laboratorios de AI se terminó, y el historial de empleo ahora es superficie de litigio.\n\nHistoria seis. Mesh LLM, inferencia distribuida sobre una red peer-to-peer.\n\nEl ítem técnicamente más divertido de la ventana: Mesh LLM, del equipo detrás de la librería de redes peer-to-peer iroh, pasó el fin de semana cerca de lo más alto de Hacker News. Permite que un equipo junte GPUs y memoria de varias máquinas y exponga toda la malla a través de un único endpoint compatible con OpenAI en localhost.\n\nLa arquitectura merece dos minutos de tu atención. Cada máquina corre un nodo conectado por las conexiones de transporte QUIC autenticadas de iroh, multiplexando gossip, ruteo y streams de inferencia sobre una sola conexión. Una petición se puede servir de tres maneras: localmente si tu máquina tiene el modelo cargado, ruteada a un peer que ya lo tiene caliente, o, para modelos demasiado grandes para una sola caja, dividida entre máquinas con un enfoque de pipeline que particiona el modelo por rangos de capas. El catálogo cubre más de cuarenta modelos, desde modelos de quinientos millones de parámetros que corren en una laptop hasta un mixture-of-experts de doscientos treinta y cinco mil millones de parámetros. Las salvedades honestas: todavía no hay números de rendimiento publicados, y dividir un modelo en pipeline sobre la red de una oficina va a vivir o morir según la latencia entre etapas.\n\nPor qué importa: hay equipos sentados sobre GPUs de workstation ociosas mientras pagan precios minoristas por token por acceso vía API a modelos de gama media, y esto hace que juntar ese hardware sea casi tan fácil como apuntar tu cliente de OpenAI existente a otra base URL. También es otro dato de que el wire format de OpenAI se convirtió en el puerto USB universal de la inferencia.\n\nConclusión filosa: para cargas internas sensibles a la privacidad y al costo, la inferencia self-hosted acaba de bajar otro escalón en dificultad operativa, y vale la pena un experimento de viernes por la tarde.\n\nEsas son las seis. Menciones honrosas rápidas antes de cerrar. OpenAI también lanzó GPT-Live, un modelo de voz mejorado para ChatGPT, el ocho de julio. Anthropic sumó al expresidente de la Reserva Federal Ben Bernanke a su Long-Term Benefit Trust, y la Reserva Federal de verdad creó su primer grupo de trabajo sobre el impacto económico de la AI, codirigido, notablemente, por el capitalista de riesgo Marc Andreessen. Y el matemático Terry Tao publicó una pieza muy compartida sobre mantener aplicaciones viejas y construir nuevas con agentes de código modernos, que vale tu tiempo como el relato sobrio de un practicante desde fuera de la burbuja de la industria del software.\n\nAhora, qué mirar. Planes filtrados ubican la disponibilidad general de Gemini tres punto cinco Pro el diecisiete de julio con una ventana de contexto de dos millones de tokens, lo que reiniciaría exactamente la misma pelea de precios y benchmarks que acabamos de ver, en cinco días. Presta atención a si el programmatic tool calling de OpenAI y el contexto administrado por el modelo de Meta realmente aguantan las pruebas de terceros, porque ambos prometen absorber capas del agent harness que hoy mantienes a mano. Y sigue el expediente de Apple contra OpenAI, porque el discovery ahí puede contarnos más sobre las operaciones de los laboratorios de frontera que cualquier blog de lanzamiento."}, {"id": "ai/2026-07-12-deepdive-a1", "front": "ai", "date": "2026-07-12", "type": "deepdive", "title": "Inference from the inside: what actually happens when you call a model", "words": 2850, "text": "You've shipped systems on top of language models. You've handled their failures, built retry loops, designed human-in-the-loop checkpoints. But here's a question worth sitting with: when you send a request to a model API, what physically happens between your HTTP call and the first token coming back? If your honest answer is \"a big matrix multiply, somehow,\" this episode is for you. By the end you'll be able to trace a request end to end, and — more usefully — you'll understand why the pricing page, the latency behavior, and the context window limits look the way they do.\n\nLet's start where every request starts: with text becoming numbers.\n\nPart one. Tokenization.\n\nThe model never sees your text. It sees a sequence of integers. The tokenizer is a lookup system, built before the model was ever trained, that chops text into pieces from a fixed vocabulary — typically somewhere between fifty thousand and two hundred and fifty thousand entries. The dominant algorithm is byte pair encoding. The idea is almost embarrassingly simple: start with raw bytes as your alphabet, scan a huge corpus, and repeatedly merge the most frequent adjacent pair into a new vocabulary entry. Do that a hundred thousand times and you get a vocabulary where common words like \"the\" are one token, common fragments like \"ization\" are one token, and rare strings fall back to smaller pieces, all the way down to single bytes if needed.\n\nThree practical consequences follow directly, and you've hit all three without necessarily knowing why. First, token counts are not word counts. English averages roughly three quarters of a word per token, but code, non-English languages, and unusual formatting can be dramatically less efficient. That's why the same semantic payload in Spanish costs more tokens than in English — the vocabulary was optimized for the training distribution, which skews English. Second, the classic failures — models struggling to count letters in a word, or to reverse a string — aren't reasoning failures exactly. The model literally cannot see characters; \"strawberry\" might be one or two tokens, and the letters inside are not part of its input. Third, the tokenizer is frozen. It's a separate artifact from the model weights, trained once, and every quirk of it is baked into everything downstream.\n\nSo now your prompt is a list of integers. Say, one thousand of them. What happens next?\n\nPart two. Embeddings — from integers to geometry.\n\nEach integer indexes into a giant lookup table called the embedding matrix. Each row of that table is a vector — for a mid-sized model, maybe four thousand ninety-six numbers. So token number twelve thousand becomes row twelve thousand: a point in a four-thousand-dimensional space. Your thousand-token prompt is now a thousand-by-four-thousand matrix of floating point numbers.\n\nHere's the mental model that matters: everything the model does from now on is moving those points around in that space. The embedding table is learned during training, and it ends up organized so that geometry encodes meaning — directions in that space correspond to semantic relationships. But the raw embedding of a token is just its dictionary meaning, context-free. The word \"bank\" starts at the same point whether the sentence is about rivers or money. The entire job of the layers that follow is to move each token's vector to where it belongs given its context.\n\nPart three. The forward pass — a stack of identical blocks.\n\nA transformer is a stack of identical blocks — thirty-ish for a small model, eighty or more for a large one — and each block does exactly two things, in sequence.\n\nThing one: attention. This is the only place in the entire architecture where tokens interact with each other. Each token's vector gets to look at every token before it and pull in information. The \"bank\" vector looks back, notices \"river\" three tokens ago, and shifts itself toward the riverbank region of the space. We're doing a full episode on the mechanics — queries, keys, values, multiple heads — so for today, hold just this: attention is where context happens, and its cost grows with how many tokens are looking at how many other tokens. That growth is the deep reason long context is expensive, and we'll get to exactly how the cost lands in a moment.\n\nThing two: the feed-forward network, sometimes called the MLP block. After attention gathers context, each token's vector — independently now, no interaction — gets pushed through a two-layer neural network that expands it to maybe four times its width and squeezes it back. This is where most of the model's parameters live, roughly two thirds of them, and the best current understanding is that it acts as the model's knowledge store: a massive learned key-value memory where facts and patterns absorbed during training get applied. Attention decides what's relevant; the feed-forward block does something with it.\n\nThen the block hands its output to the next identical block, and the process repeats. Early layers tend to resolve syntax and local structure; middle layers do the heavy semantic lifting; late layers converge on the actual prediction. By the final layer, the vector sitting at the last position of your sequence has absorbed, through attention, information from the entire prompt. That one vector is about to become your next token.\n\nPart four. The logits, and where \"randomness\" actually lives.\n\nThat final vector gets multiplied by one last matrix — often just the embedding table reused in reverse — producing one score per vocabulary entry. Fifty thousand-plus raw numbers called logits. A softmax turns them into a probability distribution: the model's actual, complete output. Not a token — a distribution over every possible next token.\n\nEverything after this point is not the model. It's a sampler: a few dozen lines of ordinary code that picks one token from that distribution. Temperature scales the logits before the softmax — low temperature sharpens the distribution toward the top choice, high temperature flattens it. Top-p truncates the long tail. Greedy decoding just takes the argmax. When people say the model is \"creative\" or \"random,\" they're describing sampler settings, not the network — the forward pass itself is deterministic matrix arithmetic. There's a full episode coming on sampling, including the genuinely interesting question of why even temperature zero doesn't always give you bit-identical outputs in production.\n\nSo one forward pass produced one token. Now what? Now the brutal part.\n\nPart five. Autoregression — the loop that explains your latency.\n\nTo get the second token, the model appends the first generated token to the sequence and runs again. And again. A five-hundred-token response is five hundred sequential forward passes through the entire stack of layers. Sequential is the key word — token two hundred cannot be computed before token one hundred ninety-nine exists. No amount of parallel hardware removes that dependency.\n\nThis is the single most important structural fact about LLM inference, and it splits every request into two phases with completely different characters.\n\nPhase one is prefill: processing your prompt. All thousand prompt tokens can be processed in parallel — they all exist already, so the hardware chews through them in one big, efficient, compute-dense pass. Prefill is fast per token and it's what determines time to first token.\n\nPhase two is decode: generating the response, one token per forward pass, serially. Each of those passes does a small amount of arithmetic but must stream tens of gigabytes of model weights from GPU memory to the compute units — for every single token. The arithmetic units spend most of their time waiting for memory. Decode is memory-bandwidth-bound, not compute-bound, and that asymmetry is worth tattooing somewhere: prefill is compute-bound and parallel, decode is bandwidth-bound and serial.\n\nLook at any provider's pricing page with this in mind and it snaps into focus. Output tokens cost several times more than input tokens — not marketing, just physics: input tokens are processed in one parallel pass, output tokens each require a full serial trip through the machine. Time to first token scales with prompt length, because that's prefill. Tokens per second after the first is roughly constant, because that's the decode treadmill.\n\nOne more piece and the picture is complete.\n\nPart six. The KV cache — the memory that makes decode possible at all.\n\nNaively, generating token five hundred and one means re-running attention over all five hundred previous tokens from scratch — redoing work you already did. Every serious inference stack avoids this by caching the intermediate attention states — the keys and values — for every token already processed. That's the KV cache. With it, each decode step only computes attention state for the one new token and reads the rest from cache.\n\nThe catch: that cache is enormous. It grows linearly with sequence length, and for long contexts it can rival the size of the model weights themselves — gigabytes of GPU memory per single request. This is why context windows have hard limits, why long conversations cost more, and why providers offer prompt caching discounts: if your system prompt's KV states are already sitting in memory from a previous request, prefill for that portion is nearly free, and they pass some of that saving to you. When you see a ninety percent discount on cached input tokens, you're looking directly at this mechanism. The KV cache gets its own full episode, because it is quietly the central resource constraint of the entire serving industry.\n\nPart seven. What a token costs — putting the whole picture together.\n\nLet's do the back-of-envelope, because it's the kind you can now do from first principles. A rule of thumb: generating one token requires roughly two floating point operations per model parameter. A seventy-billion-parameter model: about a hundred and forty billion operations per token. A modern data center GPU does on the order of a quadrillion operations per second, so the arithmetic for one token takes on the order of a tenth of a millisecond. Yet real systems produce maybe fifty to a hundred tokens per second per request — thousands of times slower than pure arithmetic suggests. The gap is exactly what part five predicted: decode isn't waiting on arithmetic, it's waiting on memory. A seventy-billion-parameter model at sixteen-bit precision is a hundred and forty gigabytes of weights that must move from memory to compute for every token. Divide memory bandwidth by model size and you get the real ceiling on tokens per second — a number you can compute from a spec sheet.\n\nThat single calculation explains half the engineering you'll hear about in the coming episodes. Why quantization matters: smaller weights means fewer bytes to move means faster decode, directly proportional. Why batching matters: if you must move all the weights anyway, amortize the trip across fifty concurrent requests. Why speculative decoding exists: use a small model to draft several tokens, and let the big model verify them in one parallel pass — converting serial decode into parallel-ish verification. None of these are tricks anymore; they're the obvious moves once you know where the bottleneck is.\n\nLet's land this.\n\nThe full trace, in one breath: text becomes integers through a frozen tokenizer; integers become vectors through a lookup table; vectors flow through a stack of identical blocks where attention mixes context between tokens and feed-forward layers apply stored knowledge; a final projection produces a probability distribution over the vocabulary; a sampler — plain code, not model — picks one token; and the whole thing loops, one full forward pass per generated token, with the KV cache saving you from recomputing the past at the price of gigabytes of memory.\n\nAnd the three load-bearing takeaways. One: the model is a deterministic function from token sequence to probability distribution; everything that feels like personality or randomness lives in the sampler and the prompt. Two: prefill is parallel and compute-bound, decode is serial and memory-bound — this one asymmetry explains pricing, time to first token, throughput numbers, and most of inference engineering. Three: the KV cache is the hidden protagonist — it's why long context is a memory problem rather than a speed problem, and why prompt caching is one of the few genuine free lunches available to you as an application engineer.\n\nNext episode in this track, we open up attention properly: queries, keys, values, multi-head, causal masking — the actual matrices, small enough numbers that you can hold them in your head. Once you have that, the KV cache episode will feel less like trivia and more like an inevitability.\n\nYou now know what happens when you press enter. Most people building on these models don't. That gap is the point of this whole track.", "sources": [{"name": "Attention Is All You Need (Vaswani et al., 2017)", "url": "https://arxiv.org/abs/1706.03762"}, {"name": "The Illustrated Transformer (Jay Alammar)", "url": "https://jalammar.github.io/illustrated-transformer/"}, {"name": "Andrej Karpathy, Let's build GPT from scratch", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY"}, {"name": "LLM Inference Arithmetic (kipply)", "url": "https://kipp.ly/transformer-inference-arithmetic/"}, {"name": "Efficiently Scaling Transformer Inference (Pope et al., 2022)", "url": "https://arxiv.org/abs/2211.05102"}], "title_es": "Inferencia por dentro: qué pasa realmente cuando llamas a un modelo", "text_es": "Has construido sistemas sobre modelos de lenguaje. Has manejado sus fallas, armado retry loops, diseñado checkpoints con humanos en el circuito. Pero aquí hay una pregunta que vale la pena pensar un rato: cuando mandas un request a la API de un modelo, ¿qué pasa físicamente entre tu llamada HTTP y el primer token que vuelve? Si tu respuesta honesta es \"una multiplicación de matrices gigante, de alguna forma\", este episodio es para ti. Al final vas a poder trazar un request de punta a punta y — más útil todavía — vas a entender por qué la página de precios, el comportamiento de la latencia y los límites del context window son como son.\n\nEmpecemos donde empieza todo request: con texto convirtiéndose en números.\n\nParte uno. Tokenización.\n\nEl modelo nunca ve tu texto. Ve una secuencia de enteros. El tokenizer es un sistema de lookup, construido antes de que el modelo siquiera se entrenara, que corta el texto en piezas de un vocabulario fijo — típicamente entre cincuenta mil y doscientas cincuenta mil entradas. El algoritmo dominante es byte pair encoding, o codificación por pares de bytes. La idea es casi vergonzosamente simple: empiezas con bytes crudos como alfabeto, escaneas un corpus enorme, y una y otra vez fusionas el par adyacente más frecuente en una nueva entrada del vocabulario. Haz eso cien mil veces y obtienes un vocabulario donde palabras comunes como \"the\" son un token, fragmentos comunes como \"ization\" son un token, y las cadenas raras caen a piezas más chicas, hasta llegar a bytes individuales si hace falta.\n\nDe ahí se siguen directamente tres consecuencias prácticas, y te has topado con las tres sin saber necesariamente por qué. Primera: contar tokens no es contar palabras. El inglés promedia más o menos tres cuartos de palabra por token, pero el código, los idiomas distintos del inglés y los formatos inusuales pueden ser dramáticamente menos eficientes. Por eso el mismo contenido semántico en español cuesta más tokens que en inglés — el vocabulario se optimizó para la distribución de entrenamiento, que se inclina hacia el inglés. Segunda: las fallas clásicas — modelos que no logran contar las letras de una palabra, o invertir un string — no son exactamente fallas de razonamiento. El modelo literalmente no puede ver los caracteres; \"strawberry\" puede ser uno o dos tokens, y las letras que tiene adentro no forman parte de su input. Tercera: el tokenizer está congelado. Es un artefacto separado de los pesos del modelo, entrenado una sola vez, y cada una de sus rarezas queda horneada en todo lo que viene después.\n\nAsí que ahora tu prompt es una lista de enteros. Digamos, mil. ¿Qué pasa después?\n\nParte dos. Embeddings — de enteros a geometría.\n\nCada entero indexa una tabla de lookup gigante llamada la embedding matrix. Cada fila de esa tabla es un vector — para un modelo mediano, quizá cuatro mil noventa y seis números. Entonces el token número doce mil se convierte en la fila doce mil: un punto en un espacio de cuatro mil dimensiones. Tu prompt de mil tokens es ahora una matriz de mil por cuatro mil números de punto flotante.\n\nEste es el modelo mental que importa: todo lo que el modelo hace de aquí en adelante es mover esos puntos dentro de ese espacio. La tabla de embeddings se aprende durante el entrenamiento, y termina organizada de modo que la geometría codifica significado — las direcciones en ese espacio corresponden a relaciones semánticas. Pero el embedding crudo de un token es solo su significado de diccionario, sin contexto. La palabra \"bank\" en inglés arranca en el mismo punto ya sea que la oración hable de ríos o de dinero. Todo el trabajo de las capas que siguen es mover el vector de cada token hacia donde le corresponde dado su contexto.\n\nParte tres. El forward pass — una pila de bloques idénticos.\n\nUn transformer es una pila de bloques idénticos — unos treinta para un modelo chico, ochenta o más para uno grande — y cada bloque hace exactamente dos cosas, en secuencia.\n\nCosa uno: attention. Es el único lugar en toda la arquitectura donde los tokens interactúan entre sí. El vector de cada token puede mirar a todos los tokens anteriores y traerse información. El vector de \"bank\" mira hacia atrás, nota que \"river\" apareció tres tokens antes, y se desplaza hacia la región del espacio que corresponde a la orilla del río. Vamos a dedicar un episodio completo a la mecánica — queries, keys, values, múltiples heads — así que por hoy quédate solo con esto: attention es donde ocurre el contexto, y su costo crece con cuántos tokens están mirando a cuántos otros tokens. Ese crecimiento es la razón profunda de que el contexto largo sea caro, y en un momento vamos a ver exactamente dónde aterriza ese costo.\n\nCosa dos: la red feed-forward, a veces llamada el bloque MLP. Después de que attention junta el contexto, el vector de cada token — ahora de forma independiente, sin interacción — pasa por una red neuronal de dos capas que lo expande a quizá cuatro veces su ancho y lo vuelve a comprimir. Aquí es donde vive la mayoría de los parámetros del modelo, más o menos dos tercios, y el mejor entendimiento actual es que funciona como el almacén de conocimiento del modelo: una enorme memoria key-value aprendida donde se aplican los hechos y patrones absorbidos durante el entrenamiento. Attention decide qué es relevante; el bloque feed-forward hace algo con eso.\n\nDespués el bloque le entrega su salida al siguiente bloque idéntico, y el proceso se repite. Las capas tempranas tienden a resolver sintaxis y estructura local; las capas del medio hacen el trabajo semántico pesado; las capas finales convergen en la predicción concreta. Para la última capa, el vector que está en la última posición de tu secuencia ha absorbido, vía attention, información de todo el prompt. Ese único vector está a punto de convertirse en tu próximo token.\n\nParte cuatro. Los logits, y dónde vive realmente la \"aleatoriedad\".\n\nEse vector final se multiplica por una última matriz — muchas veces la misma tabla de embeddings reutilizada al revés — y produce un puntaje por cada entrada del vocabulario. Más de cincuenta mil números crudos llamados logits. Un softmax los convierte en una distribución de probabilidad: el output real y completo del modelo. No un token — una distribución sobre cada posible próximo token.\n\nTodo lo que viene después de este punto no es el modelo. Es un sampler: unas pocas decenas de líneas de código común y corriente que elige un token de esa distribución. La temperature escala los logits antes del softmax — temperatura baja afila la distribución hacia la opción de arriba, temperatura alta la aplana. Top-p recorta la cola larga. El greedy decoding simplemente toma el argmax. Cuando la gente dice que el modelo es \"creativo\" o \"aleatorio\", está describiendo la configuración del sampler, no la red — el forward pass en sí es aritmética de matrices determinista. Viene un episodio completo sobre sampling, incluyendo la pregunta genuinamente interesante de por qué ni siquiera temperature cero te da siempre outputs idénticos bit a bit en producción.\n\nEntonces un forward pass produjo un token. ¿Y ahora qué? Ahora viene la parte brutal.\n\nParte cinco. Autorregresión — el loop que explica tu latencia.\n\nPara obtener el segundo token, el modelo agrega el primer token generado a la secuencia y corre de nuevo. Y de nuevo. Una respuesta de quinientos tokens son quinientos forward passes secuenciales por toda la pila de capas. Secuencial es la palabra clave — el token doscientos no puede computarse antes de que exista el token ciento noventa y nueve. Ninguna cantidad de hardware paralelo elimina esa dependencia.\n\nEste es el hecho estructural más importante de la inferencia de LLMs, y divide cada request en dos fases con caracteres completamente distintos.\n\nLa fase uno es el prefill: procesar tu prompt. Los mil tokens del prompt pueden procesarse en paralelo — ya existen todos, así que el hardware los mastica en una sola pasada grande, eficiente y densa en cómputo. El prefill es rápido por token y es lo que determina el time to first token.\n\nLa fase dos es el decode: generar la respuesta, un token por forward pass, en serie. Cada una de esas pasadas hace poca aritmética, pero tiene que traer decenas de gigabytes de pesos del modelo desde la memoria de la GPU hasta las unidades de cómputo — por cada token individual. Las unidades aritméticas pasan la mayor parte del tiempo esperando a la memoria. El decode está limitado por ancho de banda de memoria, no por cómputo, y esa asimetría vale la pena tatuársela en algún lado: prefill es compute-bound y paralelo, decode es bandwidth-bound y serial.\n\nMira la página de precios de cualquier proveedor con esto en mente y todo encaja. Los tokens de output cuestan varias veces más que los de input — no es marketing, es pura física: los tokens de input se procesan en una pasada paralela, cada token de output requiere un viaje serial completo por toda la máquina. El time to first token escala con el largo del prompt, porque eso es el prefill. Los tokens por segundo después del primero son más o menos constantes, porque esa es la caminadora del decode.\n\nUna pieza más y el cuadro queda completo.\n\nParte seis. El KV cache — la memoria que hace posible el decode.\n\nDe forma ingenua, generar el token quinientos uno significaría volver a correr attention sobre los quinientos tokens anteriores desde cero — rehacer trabajo que ya hiciste. Todo stack de inferencia serio evita esto cacheando los estados intermedios de attention — las keys y los values — de cada token ya procesado. Eso es el KV cache. Con él, cada paso de decode solo computa el estado de attention del token nuevo y lee el resto desde el cache.\n\nEl detalle: ese cache es enorme. Crece linealmente con el largo de la secuencia, y para contextos largos puede rivalizar con el tamaño de los pesos del modelo — gigabytes de memoria de GPU por un solo request. Por eso los context windows tienen límites duros, por eso las conversaciones largas cuestan más, y por eso los proveedores ofrecen descuentos de prompt caching: si los estados KV de tu system prompt ya están en memoria por un request anterior, el prefill de esa porción sale casi gratis, y te trasladan parte de ese ahorro. Cuando ves un descuento del noventa por ciento en tokens de input cacheados, estás mirando directamente este mecanismo. El KV cache tiene su propio episodio completo, porque es, calladamente, la restricción de recursos central de toda la industria del serving.\n\nParte siete. Cuánto cuesta un token — armando el cuadro completo.\n\nHagamos la cuenta rápida en una servilleta, porque es del tipo que ahora puedes hacer desde primeros principios. Una regla general: generar un token requiere más o menos dos operaciones de punto flotante por parámetro del modelo. Un modelo de setenta mil millones de parámetros: unas ciento cuarenta mil millones de operaciones por token. Una GPU moderna de data center hace del orden de mil billones de operaciones por segundo, así que la aritmética de un token toma del orden de una décima de milisegundo. Y sin embargo los sistemas reales producen quizá entre cincuenta y cien tokens por segundo por request — miles de veces más lento de lo que sugiere la aritmética pura. La brecha es exactamente lo que la parte cinco predijo: el decode no está esperando a la aritmética, está esperando a la memoria. Un modelo de setenta mil millones de parámetros en precisión de dieciséis bits son ciento cuarenta gigabytes de pesos que deben moverse de la memoria al cómputo por cada token. Divide el ancho de banda de memoria entre el tamaño del modelo y obtienes el techo real de tokens por segundo — un número que puedes calcular desde una hoja de especificaciones.\n\nEse único cálculo explica la mitad de la ingeniería de la que vas a oír hablar en los próximos episodios. Por qué importa la quantization: pesos más chicos significa menos bytes que mover, significa decode más rápido, en proporción directa. Por qué importa el batching: si igual tienes que mover todos los pesos, amortiza el viaje entre cincuenta requests concurrentes. Por qué existe el speculative decoding: usa un modelo chico para hacer un borrador de varios tokens, y deja que el modelo grande los verifique en una sola pasada paralela — convirtiendo el decode serial en una verificación más o menos paralela. A estas alturas ninguna de estas cosas es un truco; son las jugadas obvias una vez que sabes dónde está el cuello de botella.\n\nAterricemos esto.\n\nEl recorrido completo, de un solo aliento: el texto se vuelve enteros a través de un tokenizer congelado; los enteros se vuelven vectores a través de una tabla de lookup; los vectores fluyen por una pila de bloques idénticos donde attention mezcla contexto entre tokens y las capas feed-forward aplican conocimiento almacenado; una proyección final produce una distribución de probabilidad sobre el vocabulario; un sampler — código común, no modelo — elige un token; y todo el asunto se repite en loop, un forward pass completo por cada token generado, con el KV cache ahorrándote recomputar el pasado al precio de gigabytes de memoria.\n\nY las tres conclusiones que cargan el peso. Uno: el modelo es una función determinista que va de una secuencia de tokens a una distribución de probabilidad; todo lo que se siente como personalidad o aleatoriedad vive en el sampler y en el prompt. Dos: el prefill es paralelo y compute-bound, el decode es serial y memory-bound — esa única asimetría explica los precios, el time to first token, los números de throughput y la mayor parte de la ingeniería de inferencia. Tres: el KV cache es el protagonista oculto — es la razón de que el contexto largo sea un problema de memoria y no de velocidad, y de que el prompt caching sea uno de los pocos almuerzos gratis genuinos disponibles para ti como ingeniero de aplicaciones.\n\nEn el próximo episodio de este track abrimos attention en serio: queries, keys, values, multi-head, causal masking — las matrices reales, con números lo bastante chicos como para tenerlos en la cabeza. Una vez que tengas eso, el episodio del KV cache se va a sentir menos como trivia y más como una inevitabilidad.\n\nAhora sabes qué pasa cuando aprietas enter. La mayoría de la gente que construye sobre estos modelos no lo sabe. Esa brecha es el punto de todo este track."}];

// local ratings the repo doesn't know about yet, as "id=n" pairs
function unsyncedRatings() {
  return EPISODES.filter(e => epState(e.id).r && epState(e.id).r !== RATINGS[e.id])
    .map(e => e.id + "=" + epState(e.id).r);
}

// ---------- fronts ----------
function frontOf(ep) { return FRONTS.find(f => f.id === ep.front) || { id: ep.front, label: ep.front, hue: 28 }; }
function inView(ep) { return store.front === "all" || ep.front === store.front; }
function viewEpisodes() { return EPISODES.filter(inView); }
function applyFrontTheme() {
  const f = FRONTS.find(x => x.id === store.front);
  document.documentElement.style.setProperty("--h", f ? f.hue : 28);
}

// ---------- chunking (sentence groups <=190 chars, tagged with paragraph idx) ----------
function chunk(text) {
  const out = [];
  text.split(/\n\s*\n/).forEach((para, p) => {
    const clean = para.replace(/\s+/g, " ").trim();
    if (!clean) return;
    const sentences = clean.match(/[^.!?]+[.!?]+["')\]]*\s*|.+$/g) || [clean];
    let buf = "";
    sentences.forEach(s => {
      if (buf && (buf + s).length > 190) { out.push({ t: buf.trim(), p }); buf = ""; }
      buf += s;
    });
    if (buf.trim()) out.push({ t: buf.trim(), p });
  });
  return out;
}
const CHUNKS = {};
EPISODES.forEach(e => {
  CHUNKS[e.id] = { en: chunk(e.text), es: e.text_es ? chunk(e.text_es) : null };
});

// ---------- language ----------
// precedence: per-episode pin (st.o) > global mode > auto (news→es, deepdive→en)
function langFor(ep) {
  if (!ep.text_es) return "en";
  const o = epState(ep.id).o;
  if (o) return o;
  if (store.lang === "auto") return ep.type === "news" ? "es" : "en";
  return store.lang;
}
function chunksFor(ep) { return CHUNKS[ep.id][langFor(ep)] || CHUNKS[ep.id].en; }
function titleFor(ep) { return langFor(ep) === "es" && ep.title_es ? ep.title_es : ep.title; }
function textFor(ep) { return langFor(ep) === "es" && ep.text_es ? ep.text_es : ep.text; }
// keep listening position when the language changes: map by paragraph index
function syncLang(ep) {
  const st = epState(ep.id);
  const lang = langFor(ep);
  if (st.l === lang) return st;
  const from = CHUNKS[ep.id][st.l] || CHUNKS[ep.id].en;
  const to = chunksFor(ep);
  if (st.done || st.i >= from.length) { st.i = st.done ? to.length : Math.min(st.i, to.length); st.l = lang; return st; }
  const para = (from[st.i] || { p: 0 }).p;
  const idx = to.findIndex(c => c.p === para);
  st.i = idx < 0 ? Math.min(st.i, to.length - 1) : idx;
  st.l = lang;
  return st;
}

// ---------- speech ----------
const synth = window.speechSynthesis;
let cur = null;        // current episode id
let playing = false;
let gen = 0;           // generation guard: cancel() fires onend in some engines
let wakeLock = null;

function epById(id) { return EPISODES.find(e => e.id === id); }
function voices(lang) {
  return synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
}
function pickVoice(lang) {
  const vs = voices(lang);
  return vs.find(v => v.name === store.voice[lang]) || vs.find(v => v.default) || vs[0] || null;
}
function speakChunk() {
  const ep = epById(cur);
  const st = syncLang(ep);
  const chunks = chunksFor(ep);
  if (st.i >= chunks.length) { finishEpisode(); return; }
  const lang = langFor(ep);
  const u = new SpeechSynthesisUtterance(chunks[st.i].t);
  const v = pickVoice(lang);
  if (v) u.voice = v;
  u.lang = lang === "es" ? "es-419" : "en-US";
  u.rate = store.rate;
  const myGen = gen;
  u.onend = () => {
    if (myGen !== gen || !playing) return;
    st.i++; save(); render();
    speakChunk();
  };
  u.onerror = u.onend;
  synth.speak(u);
}
async function play(id) {
  if (cur !== id) { stopSpeech(); cur = id; }
  const st = epState(id);
  if (st.done) { st.done = false; st.i = 0; } // replay
  playing = true;
  gen++;
  synth.cancel();
  speakChunk();
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  render();
}
function stopSpeech() {
  gen++;
  playing = false;
  synth.cancel();
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
function pause() { stopSpeech(); render(); }
function finishEpisode() {
  const ep = epById(cur);
  const st = epState(cur);
  st.done = true; st.i = chunksFor(ep).length;
  stopSpeech(); save(); render();
}
function seekPara(dir) {
  if (!cur) return;
  const ep = epById(cur);
  const st = syncLang(ep);
  const chunks = chunksFor(ep);
  const p = (chunks[Math.min(st.i, chunks.length - 1)] || { p: 0 }).p + dir;
  const idx = chunks.findIndex(c => c.p === Math.max(0, p));
  st.i = idx < 0 ? (dir > 0 ? chunks.length : 0) : idx;
  save();
  if (playing) { gen++; synth.cancel(); speakChunk(); }
  render();
}

// ---------- spark hook (UC5): fire an external AI chat session ----------
function sparkURL(ep) {
  const firstPara = ep.text.split(/\n\s*\n/)[0].slice(0, 400);
  const q = `While listening to my earbrief episode "${ep.title}" (${ep.date}, ${ep.type}, front: ${frontOf(ep).label}), an idea sparked. The episode opens with: "${firstPara}". Ask me what the idea is, then help me deep-dive it. This session is independent of the briefing pipeline.`;
  // Default to Claude, but users can customize to their preferred AI assistant
  return "https://claude.ai/new?q=" + encodeURIComponent(q);
}

// ---------- render ----------
const $ = id => document.getElementById(id);
function mins(ep) {
  const w = langFor(ep) === "es" && ep.text_es ? Math.round(ep.words * 1.05) : ep.words;
  return Math.max(1, Math.round(w / WPM));
}
function pct(ep) {
  const st = syncLang(ep);
  if (st.done) return 100;
  const n = chunksFor(ep).length || 1;
  return Math.round(100 * Math.min(st.i, n) / n);
}
function card(ep) {
  const st = syncLang(ep);
  const el = document.createElement("article");
  el.className = "ep" + (st.done ? " done" : "") + (cur === ep.id ? " current" : "");
  el.style.setProperty("--h", frontOf(ep).hue); // card wears its front's color
  const chipCls = ep.type === "deepdive" ? "chip deepdive" : "chip";
  const chipTxt = ep.type === "deepdive" ? "deep dive" : "news";
  el.innerHTML =
    '<div class="meta"><span class="' + chipCls + '">' + chipTxt + "</span>" +
    (store.front === "all" && FRONTS.length > 1 ? '<span class="chip frontname"></span>' : "") +
    '<button class="langchip' + (st.o ? " pinned" : "") + '" data-act="lang" title="Tap to pin the language for this episode">' + langFor(ep) + (st.o ? " ✱" : "") + "</button>" +
    "<span>" + ep.date + "</span><span>~" + mins(ep) + " min</span>" +
    (st.done ? '<span style="color:var(--done)">✓ listened</span>' : "") + "</div>" +
    "<h3></h3>" +
    '<div class="bar"><i style="width:' + pct(ep) + '%"></i></div>' +
    '<div class="row">' +
    '<button class="btn primary" data-act="play"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    (playing && cur === ep.id ? ICO_PAUSE : ICO_PLAY) + "</svg>" +
    (playing && cur === ep.id ? "Pause" : (st.i > 0 && !st.done ? "Resume" : (st.done ? "Replay" : "Play"))) + "</button>" +
    '<a class="btn" href="' + sparkURL(ep) + '" target="_blank" rel="noopener">✦ Spark</a>' +
    '<span class="spacer"></span>' +
    '<label class="donechk"><input type="checkbox" data-act="done"' + (st.done ? " checked" : "") + "> done</label>" +
    "</div>" +
    (st.done || st.r
      ? '<div class="raterow" role="group" aria-label="Rate this episode">' +
        [1, 2, 3, 4, 5].map(n =>
          '<button class="star' + ((st.r || 0) >= n ? " on" : "") + '" data-star="' + n +
          '" aria-label="' + n + ' of 5 stars">' + ((st.r || 0) >= n ? "★" : "☆") + "</button>").join("") +
        (st.r ? "" : '<span class="ratehint">rate it → steers future episodes</span>') +
        "</div>"
      : "") +
    '<details class="txt"><summary>transcript</summary><div class="transcript"></div></details>' +
    ((ep.sources || []).length ? '<details class="txt srcs"><summary>sources (' + ep.sources.length + ")</summary><ul class=\"sourcelist\"></ul></details>" : "");
  el.querySelector("h3").textContent = titleFor(ep);
  const fn = el.querySelector(".frontname");
  if (fn) fn.textContent = frontOf(ep).label;
  const sl = el.querySelector(".sourcelist");
  if (sl) ep.sources.forEach(s => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = s.name;
    li.appendChild(a);
    sl.appendChild(li);
  });
  const tr = el.querySelector(".transcript");
  const chunks = chunksFor(ep);
  const curPara = (chunks[Math.min(st.i, chunks.length - 1)] || {}).p;
  textFor(ep).split(/\n\s*\n/).forEach((para, p) => {
    if (!para.trim()) return;
    const pe = document.createElement("p");
    pe.textContent = para.trim();
    if (cur === ep.id && p === curPara && !st.done) pe.className = "now";
    tr.appendChild(pe);
  });
  el.querySelector('[data-act="lang"]').onclick = () => {
    if (!ep.text_es) return; // English-only episode, nothing to pin
    const s = epState(ep.id);
    // tap: pin the other language; tap again: back to following the default
    s.o = s.o ? undefined : (langFor(ep) === "en" ? "es" : "en");
    save();
    if (playing && cur === ep.id) { syncLang(ep); gen++; synth.cancel(); speakChunk(); }
    render();
  };
  el.querySelector('[data-act="play"]').onclick = () =>
    (playing && cur === ep.id) ? pause() : play(ep.id);
  el.querySelectorAll("[data-star]").forEach(b => b.onclick = () => {
    const s = epState(ep.id);
    const n = +b.dataset.star;
    s.r = s.r === n ? undefined : n; // tap the current rating again to clear it
    save(); render();
  });
  el.querySelector('[data-act="done"]').onchange = ev => {
    const s = epState(ep.id);
    s.done = ev.target.checked;
    s.i = s.done ? chunksFor(ep).length : 0;
    if (s.done && cur === ep.id) stopSpeech();
    save(); render();
  };
  return el;
}
function renderFronts() {
  const nav = $("fronts");
  nav.hidden = FRONTS.length < 2;
  if (nav.hidden) return;
  nav.innerHTML = "";
  const pendIn = fid => EPISODES.filter(e => (fid === "all" || e.front === fid) && !epState(e.id).done).length;
  [{ id: "all", label: "All", hue: 28 }].concat(FRONTS).forEach(f => {
    const b = document.createElement("button");
    b.className = "ftab";
    b.style.setProperty("--fh", f.hue);
    b.setAttribute("aria-pressed", store.front === f.id);
    const n = pendIn(f.id);
    b.innerHTML = '<span class="fdot"></span><span class="lbl"></span>' + (n ? '<span class="n">' + n + "</span>" : "");
    b.querySelector(".lbl").textContent = f.label;
    b.onclick = () => {
      store.front = f.id;
      save();
      applyFrontTheme();
      render();
    };
    nav.appendChild(b);
  });
}
function render() {
  renderFronts();
  const curFront = FRONTS.find(f => f.id === store.front);
  $("brand-front").textContent = curFront ? curFront.label.toLowerCase() : "all fronts";
  $("headline").textContent = curFront ? curFront.label : "Your briefing queue";
  const pend = $("pending"), done = $("donelist");
  pend.innerHTML = ""; done.innerHTML = "";
  let nPend = 0, nDone = 0, minPend = 0;
  viewEpisodes().forEach(ep => {
    const c = card(ep);
    if (epState(ep.id).done) { done.appendChild(c); nDone++; }
    else { pend.appendChild(c); nPend++; minPend += mins(ep); }
  });
  if (!nPend) pend.innerHTML = '<div class="empty">Queue clear' + (curFront ? " on this front" : "") + ". Next episode lands with the morning routine.</div>";
  $("st-pending").textContent = nPend;
  $("st-done").textContent = nDone;
  $("st-min").textContent = minPend;
  const nSync = unsynced().length + unsyncedRatings().length;
  $("st-sync").hidden = !nSync;
  if (nSync) $("st-sync").textContent = "sync " + nSync + " to log ⇪";
  // transport
  const ep = epById(cur);
  $("t-play-ico").innerHTML = playing ? ICO_PAUSE : ICO_PLAY;
  $("t-rate").textContent = store.rate + "×";
  $("t-lang").textContent = store.lang === "auto" ? "AUTO" : store.lang.toUpperCase();
  if (ep) {
    $("t-title").innerHTML = "<b></b>";
    $("t-title").querySelector("b").textContent = titleFor(ep);
    $("t-bar").style.width = pct(ep) + "%";
  } else {
    $("t-title").textContent = "Nothing playing — pick an episode";
    $("t-bar").style.width = "0";
  }
}

// ---------- wire up ----------
$("t-play").onclick = () => {
  if (!cur) { const first = viewEpisodes().find(e => !epState(e.id).done); if (first) play(first.id); return; }
  playing ? pause() : play(cur);
};
// sandboxed hosts (the artifact viewer iframe) reject the async clipboard API
// and swallow window.prompt without showing anything, so fall back in layers:
// clipboard → execCommand copy → inline selectable text.
function execCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}
$("st-sync").onclick = async () => {
  const us = unsynced(), ur = unsyncedRatings();
  const parts = [];
  if (us.length) parts.push("mark listened: " + us.join(", "));
  if (ur.length) parts.push("rate: " + ur.join(", "));
  if (!parts.length) return;
  const msg = parts.join("; ");
  let ok = false;
  try { await navigator.clipboard.writeText(msg); ok = true; } catch (e) {}
  if (!ok) ok = execCopy(msg);
  if (ok) {
    $("syncbox").hidden = true;
    $("st-sync").textContent = "copied ✓ — paste to your AI assistant";
  } else {
    const ta = $("synctext");
    ta.value = msg;
    $("syncbox").hidden = false;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, msg.length);
    $("st-sync").textContent = "copy it below ↓";
  }
};
$("t-prev").onclick = () => seekPara(-1);
$("t-next").onclick = () => seekPara(1);
$("t-lang").onclick = () => {
  const modes = ["auto", "en", "es"];
  store.lang = modes[(modes.indexOf(store.lang) + 1) % modes.length];
  save();
  if (playing && cur) { gen++; synth.cancel(); speakChunk(); }
  render();
};
$("t-rate").onclick = () => {
  const rates = [1, 1.25, 1.5, 1.75];
  store.rate = rates[(rates.indexOf(store.rate) + 1) % rates.length];
  save();
  if (playing) { gen++; synth.cancel(); speakChunk(); }
  render();
};
function fillVoices() {
  ["en", "es"].forEach(lang => {
    const sel = $("voice-" + lang);
    sel.innerHTML = "";
    const vs = voices(lang);
    if (!vs.length) {
      const o = document.createElement("option");
      o.textContent = "no " + lang.toUpperCase() + " voices installed";
      o.disabled = true;
      sel.appendChild(o);
      return;
    }
    vs.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name + " (" + v.lang + ")";
      if (v.name === store.voice[lang]) o.selected = true;
      sel.appendChild(o);
    });
  });
}
["en", "es"].forEach(lang => {
  $("voice-" + lang).onchange = ev => {
    store.voice[lang] = ev.target.value; save();
    if (playing && cur && langFor(epById(cur)) === lang) { gen++; synth.cancel(); speakChunk(); }
  };
});
if (synth) {
  fillVoices();
  synth.onvoiceschanged = fillVoices;
}
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && playing && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});
applyFrontTheme();
render();
</script>
