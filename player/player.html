 rounded to about one trillion, with a one-million-token context window. It's trained from scratch on forty-five trillion tokens of text, images, audio, and video, and it's natively multimodal, meaning image and audio understanding are built into the architecture rather than bolted on through a separate encoder pipeline the way earlier multimodal models often worked. The architecture itself is the more interesting part for anyone who reads model cards closely: relative attention, short convolutions layered in alongside the usual attention blocks, and mixture-of-experts layers with what the team calls expert sinks, extra always-active experts that appear to stabilize routing and keep a few dedicated pathways available regardless of what the router decides token to token. Thinking Machines shipped full B F sixteen weights alongside a calibrated N V F P four variant, a four-bit floating-point format tuned for NVIDIA's newest Blackwell-generation hardware, and vLLM had day-zero serving support ready the same day it launched. It's already available through hosted inference providers including Together, Fireworks, Modal, Databricks, and Baseten, and the team previewed a smaller Inkling-Small, at twelve billion active parameters, for cheaper and faster deployment.\n\nSharp takeaway: the trillion-parameter headline number is the least useful thing here for your own planning; the fact that vLLM had day-zero support and an N V F P four checkpoint shipped alongside the full-precision weights is what actually matters, because quantized-format lag is normally the real bottleneck between an open-weight model landing and anyone being able to self-host it affordably. A model this size with same-day low-precision support and multi-provider hosting is a meaningfully different proposition than a weights dump you'll be waiting months to actually run. Coverage of the release has also leaned on Thinking Machines' framing of Inkling as resistant to the kind of centralized content filtering a closed API can quietly impose after the fact; that's a real property of owning the weights yourself, but it's a policy argument, not a technical one, and it's worth keeping the two separate when you're deciding whether this model actually fits your own stack.\n\nStory three, and a direct sequel to yesterday's speculative decoding story. NVIDIA shipped a language model that can act as its own draft model.\n\nYou'll remember from yesterday that speculative decoding works by having a small, cheap model propose several tokens ahead while the large model verifies them in one parallel pass, and that the whole approach lives or dies on how well the small draft model's guesses match the big model's actual outputs. NVIDIA's new Nemotron-Labs-Diffusion family, released in three billion, eight billion, and fourteen billion parameter sizes, does away with the second model entirely: a single set of weights can run in three distinct modes, ordinary autoregressive decoding, diffusion-style parallel decoding, or self-speculation, where the model drafts and verifies its own tokens without any separate model to train, align, or keep synchronized. The eight-billion instruct variant decodes six times more tokens per forward pass than a comparable Qwen3 model in its linear self-speculation mode, and up to six point four times in a more aggressive quadratic configuration; the plain diffusion mode alone reaches two point six times. Served through SGLang on NVIDIA's G B two-hundred hardware, that translates into roughly four times the throughput on a benchmark called SPEED-Bench, and the whole family ships under a license that permits commercial use.\n\nSharp takeaway: this is the same underlying constraint yesterday's episode named, that memory bandwidth rather than raw compute is what actually limits decode speed, attacked from a different angle: instead of AMD and vLLM's approach of quantizing and training a dedicated smaller draft model to match a specific target model, NVIDIA is removing the draft-target alignment problem completely by having one model do both jobs. If you're choosing between the two approaches for your own serving stack, the AMD path buys you a purpose-built draft model tuned tightly to one target, while self-speculation buys you simplicity, one model to deploy, monitor, and update, at what still looks like a real throughput cost relative to a well-matched dedicated draft model; which one wins depends on whether your operational overhead or your raw latency budget is the tighter constraint. It's also worth noting the two techniques aren't mutually exclusive at the ecosystem level: nothing stops a serving stack from offering self-speculation as a zero-setup default and a dedicated draft model as an opt-in upgrade once a team has the budget to tune one, which is likely how this actually shakes out in production over the next year rather than one approach fully displacing the other.\n\nStory four. Google DeepMind's chief executive wants a Wall-Street-style watchdog to test every frontier model before it ships, anywhere in the world, regardless of who built it.\n\nDemis Hassabis published a manifesto this week titled \"A Framework for Frontier AI and the Dawning of a New Age,\" proposing an AI standards body modeled on the Financial Industry Regulatory Authority, or FINRA, the private, industry-funded organization that polices Wall Street brokers under the Securities and Exchange Commission's oversight in the United States. His proposed body would work the same way: backed by the US government, funded by the AI industry, but operated independently of any single lab. The plan starts voluntary, with frontier labs sharing models up to thirty days before release so the body can test for dangerous cyber, biological, and deception capabilities, before eventually becoming a mandatory gate for deployment into the US market. Critically, the rules are written to apply to every frontier-class model regardless of the country that built it or whether its weights are open or closed, with the qualifying benchmarks updated regularly as capabilities move. Hassabis says he wants it operational before the end of the year, and the proposal has already drawn public support from Sam Altman, Satya Nadella, and Sundar Pichai.\n\nSharp takeaway: read this next to yesterday's Safety Index story, where an independent panel found that several labs, Hassabis's own included, had quietly weakened or voided prior public pause commitments; this proposal is, in effect, an admission that voluntary self-policing already failed that panel's test, and an attempt to replace it with an external body that has actual testing authority instead of a press release. The detail worth tracking over the next few months is whether the mandatory-gate part survives contact with the labs that would be gated, because a standards body that stays permanently voluntary is just the same self-policing arrangement with better branding.\n\nStory five. A DeepMind researcher's resignation essay is a real-world case study in exactly the kind of institutional promise-breaking story four is trying to build a regulator to prevent.\n\nAlex Turner, known online as TurnTrout, an alignment researcher, published an essay explaining why he resigned from Google DeepMind. When Google acquired DeepMind back in twenty fourteen, the explicit condition attached to the deal was that its AI would never be used for military or weapons purposes. In twenty eighteen, DeepMind's co-founders, including Hassabis and Shane Legg, along with senior Google figures such as Jeff Dean, personally signed a Future of Life Institute pledge against lethal autonomous weapons, and DeepMind signed on as an organization too. Turner's argument is that this pledge stopped applying in practice once Google agreed to a broader deal supplying AI for what he describes as any lawful government use, with no carve-out for autonomous weapons or mass surveillance. He organized an internal petition asking Jeff Dean to hold the line on the original pledge, gathered signatures from more than two hundred fifty Google DeepMind employees, and watched leadership stay silent regardless. His resignation is the conclusion he drew from that silence: that the mechanism meant to keep an institutional promise simply doesn't survive contact with enough profit and government pressure.\n\nSharp takeaway: the direct link to story four is unavoidable, any external standards body that leans on labs' voluntary commitments is building on exactly the foundation this essay says already cracked once, under real pressure, at one of the most safety-conscious labs in the field. Worth carrying forward from both of today's governance stories together: a signed pledge from a lab, even one its own founders signed personally and meant sincerely at the time, is a norm and not a contract, and norms are precisely what get quietly renegotiated once the client and the money involved get big enough. None of this means individual researchers signing these pledges were acting in bad faith at the time; the more useful reading is structural, that no mechanism currently exists to make a lab's public safety commitment binding once it collides with a large enough contract, and that gap is exactly the space Hassabis's proposed standards body is trying to fill with something enforceable instead of another pledge.\n\nNow, what to watch. Expect other security researchers to comb through Grok Build's newly public source now that it's Apache-licensed, and watch whether that turns up anything else that didn't make this week's disclosures. Watch whether Inkling gets benchmarked head to head against Fable five and GPT-5.6 on real coding and reasoning tasks rather than just multimodal demos, since an open-weight model's headline size means little until independent evaluators run it through the same evals everyone else uses. Keep an eye on whether other inference stacks beyond SGLang pick up self-speculation support for Nemotron-Labs-Diffusion, because that's the signal that the technique is heading toward general availability rather than staying a single-vendor showcase. And watch whether Hassabis's standards body attracts a public commitment from OpenAI or Anthropic specifically to the mandatory-gate portion of the plan, not just supportive quotes, since that's the difference between a real regulatory shift and a well-received essay.\n\nToday's clearest deep-dive candidate is Nemotron-Labs-Diffusion's self-speculation mode, not because tri-mode decoding is exotic on its own, but because a single model drafting and verifying its own tokens is a genuinely new answer to a problem this curriculum has already spent time on, and understanding exactly how it avoids the draft-target alignment failure mode that ordinary speculative decoding has to manage by hand is the kind of thing that changes how you'd architect a serving stack. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "The Register (Grok Build data exfiltration)", "url": "https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123"}, {"name": "Simon Willison's Weblog (xai-org/grok-build, now open source)", "url": "https://simonwillison.net/2026/Jul/15/grok-build/"}, {"name": "Tech Times (Grok Build open-sourced after covert upload)", "url": "https://www.techtimes.com/articles/320671/20260716/grok-build-open-sourced-after-covert-upload-code-exfiltrate-repos-stays.htm"}, {"name": "Hugging Face blog (Welcome Inkling by Thinking Machines)", "url": "https://huggingface.co/blog/thinkingmachines-inkling"}, {"name": "vLLM blog (TML Inkling on vLLM: Day-0 Support)", "url": "https://vllm.ai/blog/2026-07-15-inkling"}, {"name": "VentureBeat (Thinking Machines open-sources Inkling)", "url": "https://venturebeat.com/technology/thinking-machines-open-sources-first-multimodal-language-model-inkling-focused-on-low-cost-and-resistance-to-censorship"}, {"name": "Hugging Face blog (Nemotron-Labs-Diffusion)", "url": "https://huggingface.co/blog/nvidia/nemotron-labs-diffusion"}, {"name": "MarkTechPost (NVIDIA Releases Nemotron-Labs-Diffusion)", "url": "https://www.marktechpost.com/2026/05/20/nvidia-ai-releases-nemotron-labs-diffusion-a-tri-mode-language-model-with-6x-tokens-per-forward-over-qwen3-8b/"}, {"name": "TechCrunch (DeepMind CEO calls for independent standards body)", "url": "https://techcrunch.com/2026/07/14/deepmind-ceo-calls-for-an-independent-standards-body-to-regulate-frontier-ai/"}, {"name": "Axios (Hassabis calls for US-led global AI watchdog)", "url": "https://www.axios.com/2026/07/14/demis-hassabis-ai-regulation-google-deepmind"}, {"name": "TurnTrout (Why I Left Google DeepMind)", "url": "https://turntrout.com/why-i-left-google-deepmind"}, {"name": "Hacker News (Why I Left Google DeepMind, discussion)", "url": "https://news.ycombinator.com/item?id=48925271"}], "title_es": "Un Agente de Código Que Subió Tu Carpeta Personal Entera, y un Modelo de un Billón de Parámetros Que Sí Podés Quedarte", "text_es": "Las historias de hoy se dividen claramente en dos tipos de confianza: la que un agente te sacó en silencio sin preguntar, y la que toda una industria está corriendo ahora para construirle un árbitro externo.\n\nCinco historias, ordenadas por significancia técnica.\n\nHistoria uno. Un agente de código de xAI venía subiendo tu carpeta personal entera a la nube de Google, y apagar la opción que se suponía que evitaba eso no hacía absolutamente nada.\n\nGrok Build es el agente de código de terminal de xAI, la misma categoría de herramienta que Claude Code o Codex: le apuntás a un proyecto y lee, escribe, y corre código en tu máquina. Un análisis de tráfico a nivel de cable hecho por un investigador de seguridad encontró que Grok Build empaquetaba los repositorios completos de los usuarios, con historial de git entero, secretos incluidos, como git bundles, y los mandaba a un storage bucket de Google Cloud controlado por xAI, en un volumen aproximadamente veintisiete mil ochocientas veces mayor a lo que la tarea de código realmente necesitaba. Un desarrollador reportó haberlo corrido una sola vez en su carpeta personal y ver cómo se llevaba puesto sus claves S S H, la base de datos de su gestor de contraseñas, y sus fotos y documentos personales junto con todo lo demás. La herramienta venía con un toggle de \"mejorar el modelo\" que cualquier desarrollador razonable leería como el switch de recolección de datos; apagarlo no frenaba las subidas, y ni el bucket ni este comportamiento aparecían en ningún lado de la documentación de instalación de Grok Build, a pesar de que el propio marketing de xAI prometía que nada de tu código se transmitía a sus servidores durante una sesión. Elon Musk prometió que todos los datos de usuarios subidos hasta ahora se iban a borrar por completo, xAI lanzó un arreglo que pone por defecto en true una bandera llamada disable guion bajo codebase guion bajo upload, y después, días más tarde, liberó el código entero de Grok Build bajo una licencia Apache dos punto cero, aparentemente para tratar de reconstruir la confianza por la vía directa, dejando que cualquiera lea exactamente qué hace la herramienta.\n\nConclusión filosa: la falla puntual acá es aburrida y totalmente evitable, un camino de salida de datos que nadie se molestó en atar al toggle de privacidad, pero el patrón es el mismo que la historia de ayer sobre Rogue Agent mostró en una cáscara de runtime compartido distinta, que las afirmaciones de marketing de una herramienta sobre qué manda y qué no manda por la red no son algo que puedas verificar leyendo una pantalla de configuración. Si estás corriendo cualquier herramienta de código agéntica con acceso al sistema de archivos, el único chequeo confiable es mirar vos mismo su tráfico de red real, porque en este caso hizo falta la captura de paquetes de un investigador externo, no ninguna auditoría interna, para pescar la diferencia entre el comportamiento declarado y el real.\n\nHistoria dos. Ahora existe un modelo genuinamente de frontera cuyos pesos completos podés descargar, no solo consultar detrás de la application programming interface de otro.\n\nThinking Machines Lab, la empresa de Mira Murati, lanzó Inkling el quince de julio: un transformer mixture-of-experts con novecientos setenta y cinco mil millones de parámetros totales y cuarenta y un mil millones activos por token, comúnmente redondeado a un billón, con una ventana de contexto de un millón de tokens. Está entrenado desde cero con cuarenta y cinco billones de tokens de texto, imágenes, audio y video, y es nativamente multimodal, o sea que la comprensión de imagen y audio está integrada en la arquitectura en vez de agregada con un pipeline de encoders separado, como solían funcionar los modelos multimodales anteriores. La arquitectura en sí es la parte más interesante para cualquiera que lea model cards de cerca: relative attention, short convolutions puestas junto a los bloques de atención habituales, y capas mixture-of-experts con lo que el equipo llama expert sinks, expertos extra siempre activos que parecen estabilizar el ruteo y mantener disponibles algunos caminos dedicados sin importar lo que decida el router token a token. Thinking Machines lanzó los pesos completos en B F dieciséis junto con una variante N V F P cuatro calibrada, un formato de punto flotante de cuatro bits afinado para el hardware más nuevo de NVIDIA, generación Blackwell, y vLLM tuvo soporte de serving desde el día cero, el mismo día del lanzamiento. Ya está disponible a través de proveedores de inferencia alojada como Together, Fireworks, Modal, Databricks, y Baseten, y el equipo mostró un adelanto de un Inkling-Small más chico, con doce mil millones de parámetros activos, para deployment más barato y rápido.\n\nConclusión filosa: el número de un billón de parámetros en el título es lo menos útil acá para tu propia planificación; lo que importa de verdad es que vLLM tuvo soporte desde el día cero y que un checkpoint N V F P cuatro salió junto con los pesos de precisión completa, porque el retraso en formatos quantizados suele ser el cuello de botella real entre que un modelo de pesos abiertos aparece y que cualquiera lo pueda self-hostear a un costo razonable. Un modelo de este tamaño con soporte de baja precisión desde el mismo día y hosting en varios proveedores es una propuesta bastante distinta a un volcado de pesos que vas a tener que esperar meses para poder correr de verdad. La cobertura del lanzamiento también se apoyó en el enfoque de Thinking Machines de presentar a Inkling como resistente al tipo de filtrado de contenido centralizado que una API cerrada puede imponer en silencio más adelante; eso es una propiedad real de tener vos los pesos, pero es un argumento de política, no técnico, y vale la pena mantener los dos separados a la hora de decidir si este modelo realmente encaja en tu propio stack.\n\nHistoria tres, y una secuela directa de la historia de ayer sobre speculative decoding. NVIDIA lanzó un modelo de lenguaje que puede ser su propio modelo de borrador.\n\nTe vas a acordar de ayer que el speculative decoding funciona haciendo que un modelo chico y barato proponga varios tokens por adelantado mientras el modelo grande los verifica en una sola pasada paralela, y que todo el enfoque vive o muere según qué tan bien las adivinanzas del modelo de borrador chico coincidan con las salidas reales del modelo grande. La nueva familia Nemotron-Labs-Diffusion de NVIDIA, lanzada en tamaños de tres mil millones, ocho mil millones, y catorce mil millones de parámetros, se saca de encima al segundo modelo por completo: un solo conjunto de pesos puede correr en tres modos distintos, decodificación autoregresiva común, decodificación paralela estilo diffusion, o self-speculation, donde el modelo redacta y verifica sus propios tokens sin ningún modelo separado que entrenar, alinear, o mantener sincronizado. La variante instruct de ocho mil millones decodifica seis veces más tokens por forward pass que un modelo Qwen3 comparable en su modo de self-speculation lineal, y hasta seis coma cuatro veces en una configuración cuadrática más agresiva; el modo diffusion liso solo llega a dos coma seis veces. Servido a través de SGLang sobre hardware G B doscientos de NVIDIA, eso se traduce en aproximadamente cuatro veces el throughput en un benchmark llamado SPEED-Bench, y toda la familia sale bajo una licencia que permite uso comercial.\n\nConclusión filosa: esta es la misma restricción de fondo que nombró el episodio de ayer, que el ancho de banda de memoria y no el cómputo bruto es lo que realmente limita la velocidad del decode, atacada desde otro ángulo: en vez del enfoque de AMD y vLLM de quantizar y entrenar un modelo de borrador chico dedicado para calzar con un modelo objetivo específico, NVIDIA elimina por completo el problema de alineación entre borrador y objetivo haciendo que un solo modelo cumpla los dos roles. Si estás eligiendo entre los dos enfoques para tu propio stack de serving, el camino de AMD te compra un modelo de borrador hecho a medida y afinado bien ajustado a un objetivo, mientras que self-speculation te compra simplicidad, un solo modelo para deployar, monitorear, y actualizar, a lo que todavía parece ser un costo real de throughput comparado con un modelo de borrador dedicado bien calzado; cuál gana depende de si tu restricción más ajustada es el overhead operativo o el presupuesto de latencia. También vale la pena notar que las dos técnicas no son mutuamente excluyentes a nivel del ecosistema: nada impide que un stack de serving ofrezca self-speculation como default sin configuración y un modelo de borrador dedicado como upgrade opcional una vez que un equipo tenga el presupuesto para afinar uno, que probablemente sea cómo termine resolviéndose esto en producción durante el próximo año, en vez de que un enfoque desplace completamente al otro.\n\nHistoria cuatro. El director ejecutivo de Google DeepMind quiere un organismo de vigilancia al estilo Wall Street que testee cada modelo de frontera antes de que salga, en cualquier parte del mundo, sin importar quién lo haya construido.\n\nDemis Hassabis publicó esta semana un manifiesto titulado \"A Framework for Frontier AI and the Dawning of a New Age\", proponiendo un organismo de estándares de inteligencia artificial modelado en la Financial Industry Regulatory Authority, o FINRA, la organización privada financiada por la industria que vigila a los brokers de Wall Street bajo la supervisión de la Securities and Exchange Commission en Estados Unidos. Su organismo propuesto funcionaría igual: respaldado por el gobierno de Estados Unidos, financiado por la industria de inteligencia artificial, pero operado de forma independiente de cualquier lab en particular. El plan arranca voluntario, con los labs de frontera compartiendo modelos hasta treinta días antes del lanzamiento para que el organismo pueda testear capacidades peligrosas de ciber, biología, y engaño, antes de eventualmente convertirse en un filtro obligatorio para el deployment en el mercado de Estados Unidos. Un detalle clave: las reglas están escritas para aplicar a todo modelo de clase frontera sin importar el país que lo construyó o si sus pesos son abiertos o cerrados, con los benchmarks de calificación actualizados regularmente a medida que avanzan las capacidades. Hassabis dice que quiere tenerlo operativo antes de fin de año, y la propuesta ya recibió apoyo público de Sam Altman, Satya Nadella, y Sundar Pichai.\n\nConclusión filosa: leé esto junto con la historia de ayer sobre el Safety Index, donde un panel independiente encontró que varios labs, el de Hassabis incluido, habían debilitado o anulado en silencio compromisos públicos previos de pausa; esta propuesta es, en efecto, una admisión de que la autorregulación voluntaria ya falló ese examen del panel, y un intento de reemplazarla con un organismo externo que tenga autoridad de testeo real en vez de un comunicado de prensa. El detalle que vale la pena seguir en los próximos meses es si la parte del filtro obligatorio sobrevive el contacto con los labs a los que se les aplicaría, porque un organismo de estándares que se queda permanentemente voluntario es el mismo esquema de autorregulación con mejor branding.\n\nHistoria cinco. El ensayo de renuncia de un investigador de DeepMind es un caso de estudio del mundo real de exactamente el tipo de incumplimiento institucional de promesas que la historia cuatro intenta prevenir con un regulador.\n\nAlex Turner, conocido en internet como TurnTrout, un investigador de alignment, publicó un ensayo explicando por qué renunció a Google DeepMind. Cuando Google compró DeepMind allá por dos mil catorce, la condición explícita del trato era que su inteligencia artificial nunca se usaría para fines militares o de armamento. En dos mil dieciocho, los co-fundadores de DeepMind, incluidos Hassabis y Shane Legg, junto con figuras seniors de Google como Jeff Dean, firmaron personalmente un compromiso del Future of Life Institute contra las armas autónomas letales, y DeepMind lo firmó también como organización. El argumento de Turner es que ese compromiso dejó de aplicarse en la práctica una vez que Google aceptó un trato más amplio de proveer inteligencia artificial para lo que él describe como cualquier uso gubernamental lícito, sin excepción para armas autónomas o vigilancia masiva. Organizó una petición interna pidiéndole a Jeff Dean que mantuviera la línea del compromiso original, juntó firmas de más de doscientos cincuenta empleados de Google DeepMind, y vio a la gerencia quedarse callada igual. Su renuncia es la conclusión que sacó de ese silencio: que el mecanismo pensado para sostener una promesa institucional simplemente no sobrevive al contacto con suficiente presión de ganancias y de gobierno.\n\nConclusión filosa: el vínculo directo con la historia cuatro es inevitable, cualquier organismo externo de estándares que se apoye en compromisos voluntarios de los labs está construyendo sobre exactamente la misma base que este ensayo dice que ya se rompió una vez, bajo presión real, en uno de los labs más conscientes de la seguridad del campo. Vale la pena llevarse de las dos historias de gobernanza de hoy juntas: un compromiso firmado por un lab, incluso uno que sus propios fundadores firmaron personalmente y con sinceridad en su momento, es una norma y no un contrato, y las normas son precisamente lo que se renegocia en silencio cuando el cliente y la plata en juego se vuelven suficientemente grandes. Nada de esto quiere decir que los investigadores que firmaron estos compromisos actuaron de mala fe en su momento; la lectura más útil es estructural, que hoy no existe ningún mecanismo que haga vinculante el compromiso público de seguridad de un lab cuando choca con un contrato suficientemente grande, y ese vacío es exactamente el espacio que el organismo de estándares que propone Hassabis intenta llenar con algo exigible en vez de otro compromiso más.\n\nAhora, qué mirar. Es esperable que otros investigadores de seguridad se pongan a revisar el código ahora público de Grok Build ya que quedó con licencia Apache, y prestá atención a si eso saca a la luz algo más que no salió en las revelaciones de esta semana. Prestá atención a si Inkling se benchmarkea cabeza a cabeza contra Fable cinco y GPT-5.6 en tareas reales de código y razonamiento en vez de solo demos multimodales, porque el tamaño en el título de un modelo de pesos abiertos importa poco hasta que evaluadores independientes lo corren por los mismos evals que usa todo el mundo. Prestá atención a si otros stacks de inferencia además de SGLang suman soporte de self-speculation para Nemotron-Labs-Diffusion, porque esa es la señal de que la técnica va camino a disponibilidad general en vez de quedarse como vidriera de un solo proveedor. Y prestá atención a si el organismo de estándares de Hassabis consigue un compromiso público de OpenAI o Anthropic específicamente con la parte del filtro obligatorio, no solo declaraciones de apoyo, porque esa es la diferencia entre un cambio regulatorio real y un ensayo bien recibido.\n\nEl candidato más claro de hoy para un deep-dive es el modo self-speculation de Nemotron-Labs-Diffusion, no porque el decoding en tres modos sea exótico en sí mismo, sino porque un solo modelo redactando y verificando sus propios tokens es una respuesta genuinamente nueva a un problema en el que este curriculum ya invirtió tiempo, y entender exactamente cómo evita el modo de falla de alineación entre borrador y objetivo que el speculative decoding común tiene que manejar a mano es el tipo de cosa que cambia cómo diseñarías un stack de serving. Va para el curriculum como candidata a deep-dive."}, {"id": "ai/2026-07-15-news", "front": "ai", "date": "2026-07-15", "type": "news", "title": "A Rogue Agent, a Freelance Milestone, and Someone Built Doom in SQL", "words": 2121, "text": "Today's twenty-four hours are a good reminder that the interesting AI stories aren't always about a bigger model: they're about what happens when you actually run the thing you built, at scale, with real permissions and real adversaries.\n\nSix stories, ranked by technical significance, plus a short honorable mention worth thirty seconds of your attention.\n\nStory one. Security researchers found a flaw in Google's Dialogflow CX that let one writable file compromise every chatbot sharing its runtime.\n\nVaronis Threat Labs disclosed the details this week of a vulnerability they call Rogue Agent, discovered privately last November and fully patched by Google in June. Dialogflow CX lets you attach Code Blocks to a conversational agent: small pieces of Python that run inside a shared execution container. The root cause was almost embarrassingly simple once you see it: a file called code execution env dot p y, which runs every Code Block's logic through Python's exec function, was writable at runtime and had no integrity check. An attacker needed only one permission, the ability to edit a single playbook on a single agent, to plant a malicious Code Block that downloaded a modified copy of that file from an attacker-controlled server and overwrote the original inside the running container. From that point on, every Code Block execution across every agent sharing that container ran the attacker's code, not Google's. That's the part worth sitting with: this wasn't a flaw in one chatbot, it was a flaw in the shared interpreter underneath many chatbots, so compromising one low-privilege agent got you read access to live conversations, credentials users typed into other bots, and the ability to make any of those bots message users on the attacker's behalf, all while bypassing the network-level isolation Virtual Private Cloud Service Controls are supposed to provide. Google says there's no evidence it was exploited before the patch.\n\nSharp takeaway: if you're building or evaluating a multi-tenant agent platform, \"code execution sandbox\" and \"one sandbox per tenant\" are not the same claim, and this flaw is the concrete failure mode of assuming they are; ask, specifically, whether the interpreter or runtime environment your agent's code executes in is writable by agent-authored code, and whether one tenant's blast radius can ever reach another's. It's also the same underlying failure as yesterday's Friendly Fire story about autonomous code review agents: something in the environment quietly earned trust it was never supposed to have, and nobody had a mechanism to notice until a researcher went looking on purpose.\n\nStory two. The best AI agent alive can now do real, paid freelance work about one time in six, and the trend line is the actual story.\n\nThe Remote Labor Index, a benchmark built from two hundred forty real freelance projects worth a combined one hundred forty-four thousand dollars, sourced from three hundred fifty-eight verified freelancers across categories like three-D and computer-aided design, architecture, graphic design, video, audio, data analysis, and web applications, just posted its latest results. Every submission is graded by human evaluators against a gold-standard deliverable a paying client actually accepted. Fable five, Anthropic's newest model, now leads at sixteen point one percent, roughly double the runner-up, Opus four point eight. That number alone sounds unimpressive until you see where it started: two point five percent, eight months ago, when the benchmark launched. The frontier has more than quadrupled in under a year. One asterisk worth knowing: only two hundred eighteen of the two hundred forty projects could be evaluated for Fable five before a United States government access restriction cut the run short, though even in the worst case, treating every unscored project as a failure, the score would still be fourteen point six percent.\n\nSharp takeaway: sixteen percent is a real ceiling on how much economically valuable, client-accepted work you can currently hand an agent unsupervised, and it's a useful number to push back with the next time someone assumes agents are close to full task automation, but the shape of the curve, quadrupling in eight months, is the number that should actually inform your planning horizon for what to automate next year. The index has consistently shown a split worth remembering when you're deciding what to delegate: agents post their strongest gains on text-heavy, single-modality work like writing, data analysis, and code, and they remain close to useless on categories that require holding a coherent three-dimensional or spatial model, like architecture and computer-aided design, which have barely moved off zero since the benchmark launched.\n\nStory three. AMD's inference stack just got a real answer to Nvidia's speculative decoding playbook, with actual throughput numbers attached.\n\nThe vLLM project and AMD published a joint write-up walking through the full lifecycle of Eagle-three speculative decoding on AMD's Instinct accelerators. If you don't already know the shape of speculative decoding: a small draft model proposes several tokens ahead, and the large model verifies them in one parallel pass instead of generating them one at a time, turning memory-bound serial decode into something closer to parallel verification. The new piece here is that AMD Quark now owns the entire stack end to end, for both the big model and the small one: day-zero support for the two low-precision formats that matter, M X F P four and F P eight, quantization of the draft model itself, and a tuned deployment on ROCm and vLLM. Applied to Kimi-K2.5 and MiniMax-M2.5 running on Instinct M I three-fifty and M I three-fifty-five accelerators, the combination delivered up to two times the throughput for Kimi-K2.5 and one point seven nine times for MiniMax-M2.5, from a single team providing quantization, draft training, and serving together instead of three separate vendors half-supporting each other.\n\nSharp takeaway: this is a direct, practical answer to something the deep-dive on inference internals flagged as a hidden bottleneck, memory bandwidth, not raw compute, is what limits decode speed, and a matched, hardware-aware draft model is one of the few ways to buy real throughput without touching accuracy; if you're evaluating AMD as a serving option, day-zero speculative decoding support closes a gap that used to be a hard blocker. The detail worth remembering is that the draft model needed its own quantization and its own training pass, not a shrunk copy of the target model, because a draft model that disagrees with the target too often gets rejected constantly and the whole speculative pass buys you nothing.\n\nStory four. Nobody in the AI industry earned better than a C-plus on independent safety grading this cycle, and several labs have quietly walked back pause commitments they made before.\n\nThe Future of Life Institute's Summer twenty twenty-six AI Safety Index, graded by a panel of seven independent AI and governance researchers from institutions including the University of Montreal, University of California Berkeley, and Oxford, scored nine companies across six categories: risk assessment, current harms, safety frameworks, existential safety, governance and accountability, and transparency. Anthropic topped the list with a C-plus. OpenAI and Google DeepMind followed at a plain C. Meta scored a D-plus, Z-dot-A-I and Alibaba Cloud a D-minus, and three companies, x-A-I, DeepSeek, and Mistral, received outright failing grades. Nobody reached a B, let alone an A. The panel's sharper finding wasn't the letter grades, though: it found that several labs, including OpenAI, Anthropic, Google DeepMind, and Meta, have weakened or quietly voided prior public commitments to pause development if a model crossed a specified danger threshold.\n\nSharp takeaway: if any part of your own risk model for deploying a frontier model leans on \"the lab that trained it said they'd stop if things got dangerous,\" this report is evidence that assumption is currently doing less work than it used to across the entire industry, not just at one lab; treat public safety commitments as a starting point to verify, not a control you can rely on.\n\nStory five. Anthropic's talks with Samsung over a custom inference chip are still just talks, but the number behind them explains why every lab is doing this now.\n\nReporting that's crystallized over the past couple of weeks describes early-stage discussions between Anthropic and Samsung Electronics to manufacture a custom accelerator on Samsung's two-nanometer process, using Samsung's advanced packaging for tighter integration between compute and memory. Nothing is finalized: no locked design, no committed workload, no performance target. What is concrete is the motivation. This chip isn't aimed at training; it's aimed at inference, the continuous job of serving Claude's responses to everyone using it right now, and Anthropic's early testing reportedly showed roughly fifty percent lower cost than typical graphics processing units for that specific workload. Anthropic has also hired Clive Chan, an early member of OpenAI's own silicon team, and the company says existing suppliers, Amazon's Trainium chips, Google's tensor processing units, and Nvidia's graphics processing units, will all remain central regardless of how this goes. Samsung, alongside SK Hynix and Micron, was also a strategic investor in Anthropic's recent sixty-five-billion-dollar funding round.\n\nSharp takeaway: a fifty percent inference cost reduction target is the real story here, because it's the same number, roughly, that's driving Google, Amazon, Meta, and Microsoft toward their own silicon; if that ratio holds up in production for any of these labs, it eventually shows up in your API pricing, and it's worth understanding that your model costs are increasingly a function of chip strategy, not just parameter count. Anthropic's compute bill has been reported at roughly one point two five billion dollars a month, and a custom inference chip is the most direct lever available for attacking a cost line that size, more direct than any amount of prompt engineering on your end of the connection.\n\nStory six. Someone built a working, real-time ray tracer as a single SQL query, because an agent let them find out if it was possible.\n\nPeter Gostev used OpenAI's GPT-5.6 Sol to build something called DOOMQL, starting from a deliberately unreasonable premise: what if SQLite weren't just where a game stores its data, but the engine itself. The result, covered by Simon Willison, is a small Python terminal script that wraps one enormous SQL query, built around a recursive common table expression, which implements a full ray tracer, movement, collision detection, enemies, combat, and progression, entirely inside SQLite. Every pixel on screen is the output of a relational query, not application code drawing to a frame buffer. It runs, and because the whole game state lives in an actual database, you can pause it and explore the live game world with an ordinary database browser.\n\nSharp takeaway: the specific accomplishment is a novelty, but the method behind it isn't: handing a frontier coding agent a deliberately absurd constraint and seeing what breaks first is turning into a genuinely useful way to probe the ceiling of what these models can hold in their heads across a single, tightly coupled system, and it's worth trying on your own agent before you trust it with something that actually matters.\n\nOne more, quickly. The top story on Hacker News today was that Samsung's Health app has been warning users it may delete their historical data if they opt out of having it used for AI training, a dark pattern worth remembering the next time you're the one designing a consent flow and reaching for a default that technically isn't coercion.\n\nNow, what to watch. Gemini three point five Pro is still on track for general availability in two days, on July seventeenth, alongside the opening of Shanghai's World Artificial Intelligence Conference. Keep an eye on whether Google, OpenAI, or Anthropic publish anything about interpreter or sandbox isolation guarantees for their own agent platforms in response to the Dialogflow disclosure; a shared-runtime flaw at Google's scale tends to make every other platform audit its own assumptions within a few weeks. Watch the Remote Labor Index's next update for whether the eight-month quadrupling trend holds, slows, or accelerates, since a single data point on a fast-moving benchmark is far less informative than the second and third points on the same curve. And watch whether Anthropic's Samsung talks produce an actual signed deal or quietly disappear the way early-stage chip rumors sometimes do; the difference matters, because a real deal is a multi-year bet on a specific cost curve, not just a hedge.\n\nToday's clearest candidate for a slower, structural look is the Rogue Agent flaw, not because the bug itself is exotic, but because \"one shared, writable execution environment serving many tenants\" is a pattern that shows up constantly in agent platforms beyond Dialogflow, and understanding exactly how a single low-privilege foothold turned into cross-tenant compromise is the kind of lesson that transfers directly to anything you build with shared agent runtimes. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Varonis blog (Rogue Agent disclosure)", "url": "https://www.varonis.com/blog/rogue-agent-dialogflow-attack"}, {"name": "The Hacker News (Rogue Agent flaw)", "url": "https://thehackernews.com/2026/07/rogue-agent-flaw-could-have-let.html"}, {"name": "Remote Labor Index (Scale Labs leaderboard)", "url": "https://labs.scale.com/leaderboard/rli"}, {"name": "The Decoder (Remote Labor Index results)", "url": "https://the-decoder.com/ai-agents-can-now-complete-16-percent-of-freelance-jobs-at-pro-quality-up-from-2-5-percent-eight-months-ago/"}, {"name": "vLLM blog (Eagle-3 on AMD Instinct with AMD Quark)", "url": "https://vllm.ai/blog/2026-07-13-eagle-3-amd-instinct"}, {"name": "Future of Life Institute (AI Safety Index, Summer 2026)", "url": "https://futureoflife.org/ai-safety-index-summer-2026/"}, {"name": "TechCrunch (Anthropic-Samsung custom chip talks)", "url": "https://techcrunch.com/2026/07/02/anthropic-is-discussing-a-new-custom-chip-with-samsung/"}, {"name": "Simon Willison's Weblog (DOOMQL)", "url": "https://simonwillison.net/2026/Jul/13/doomql/"}], "title_es": "Un Agente Rebelde, un Hito del Freelancing, y Alguien Construyó Doom en SQL", "text_es": "Las últimas veinticuatro horas son un buen recordatorio de que las historias interesantes de la inteligencia artificial no siempre son sobre un modelo más grande: son sobre lo que pasa cuando efectivamente corrés lo que construiste, a escala, con permisos reales y adversarios reales.\n\nSeis historias, ordenadas por significancia técnica, más una mención honorífica corta que vale treinta segundos de tu atención.\n\nHistoria uno. Investigadores de seguridad encontraron una falla en Dialogflow CX de Google que dejaba que un solo archivo escribible comprometiera a cada chatbot que compartía su runtime.\n\nVaronis Threat Labs reveló esta semana los detalles de una vulnerabilidad que llaman Rogue Agent, descubierta en privado en noviembre pasado y parcheada por completo por Google en junio. Dialogflow CX te deja adjuntar Code Blocks a un agente conversacional: pedacitos de Python que corren adentro de un contenedor de ejecución compartido. La causa raíz era casi vergonzosamente simple una vez que la ves: un archivo llamado code execution env punto p y, que corre la lógica de cada Code Block a través de la función exec de Python, era escribible en runtime y no tenía ningún chequeo de integridad. Un atacante necesitaba un solo permiso, la capacidad de editar un único playbook en un único agente, para plantar un Code Block malicioso que descargaba una copia modificada de ese archivo desde un servidor controlado por el atacante y sobrescribía el original adentro del contenedor en ejecución. A partir de ese momento, cada ejecución de Code Block en cada agente que compartía ese contenedor corría el código del atacante, no el de Google. Esa es la parte que vale la pena asimilar: esto no era una falla en un chatbot, era una falla en el intérprete compartido debajo de muchos chatbots, así que comprometer un agente de bajo privilegio te daba acceso de lectura a conversaciones en vivo, credenciales que usuarios tipeaban en otros bots, y la capacidad de hacer que cualquiera de esos bots le mandara mensajes a usuarios en nombre del atacante, todo mientras se evitaba el aislamiento a nivel de red que se supone que proveen los Virtual Private Cloud Service Controls. Google dice que no hay evidencia de que se haya explotado antes del parche.\n\nConclusión filosa: si estás construyendo o evaluando una plataforma de agentes multi-tenant, \"sandbox de ejecución de código\" y \"un sandbox por tenant\" no son la misma afirmación, y esta falla es el modo de fallo concreto de asumir que sí lo son; preguntá, específicamente, si el intérprete o el entorno de runtime donde ejecuta el código de tu agente es escribible por código escrito por el propio agente, y si el radio de explosión de un tenant puede llegar a alcanzar al de otro. Es también la misma falla de fondo que la historia de ayer sobre Friendly Fire y los agentes autónomos de code review: algo en el entorno ganó en silencio una confianza que nunca debió tener, y nadie tenía un mecanismo para notarlo hasta que un investigador se puso a buscarlo a propósito.\n\nHistoria dos. El mejor agente de inteligencia artificial que existe hoy puede hacer trabajo freelance real y pago más o menos una vez cada seis, y la línea de tendencia es la historia de verdad.\n\nEl Remote Labor Index, un benchmark construido con doscientos cuarenta proyectos freelance reales que valen en conjunto ciento cuarenta y cuatro mil dólares, tomados de trescientos cincuenta y ocho freelancers verificados en categorías como diseño tres-D y asistido por computadora, arquitectura, diseño gráfico, video, audio, análisis de datos y aplicaciones web, acaba de publicar sus últimos resultados. Cada entrega la evalúan humanos contra un entregable de referencia que un cliente pago efectivamente aceptó. Fable cinco, el modelo más nuevo de Anthropic, ahora lidera con dieciséis punto uno por ciento, más o menos el doble que el segundo, Opus cuatro punto ocho. Ese número solo suena poco impresionante hasta que ves de dónde salió: dos punto cinco por ciento, hace ocho meses, cuando se lanzó el benchmark. La frontera se multiplicó por más de cuatro en menos de un año. Un asterisco que vale la pena conocer: solo doscientos dieciocho de los doscientos cuarenta proyectos se pudieron evaluar para Fable cinco antes de que una restricción de acceso del gobierno de Estados Unidos cortara la corrida, aunque incluso en el peor caso, tratando cada proyecto sin evaluar como una falla, el puntaje seguiría siendo catorce punto seis por ciento.\n\nConclusión filosa: dieciséis por ciento es un techo real de cuánto trabajo económicamente valioso y aceptado por un cliente le podés delegar hoy a un agente sin supervisión, y es un número útil para contrarrestar la próxima vez que alguien asuma que los agentes están cerca de la automatización total de tareas, pero la forma de la curva, cuadruplicarse en ocho meses, es el número que debería informar de verdad tu horizonte de planificación de qué automatizar el año que viene. El índice viene mostrando consistentemente una división que vale la pena recordar cuando decidís qué delegar: los agentes muestran sus mejores mejoras en trabajo de una sola modalidad y cargado de texto, como escritura, análisis de datos y código, y siguen siendo casi inútiles en categorías que requieren sostener un modelo espacial o tridimensional coherente, como arquitectura y diseño asistido por computadora, que apenas se movieron de cero desde que se lanzó el benchmark.\n\nHistoria tres. El stack de inferencia de AMD por fin tiene una respuesta real al manual de speculative decoding de Nvidia, con números de throughput reales de respaldo.\n\nEl proyecto vLLM y AMD publicaron una nota conjunta que recorre el ciclo de vida completo de Eagle-three speculative decoding en los aceleradores Instinct de AMD. Por si no tenés fresca la forma del speculative decoding: un modelo chico de borrador propone varios tokens por adelantado, y el modelo grande los verifica en una sola pasada paralela en vez de generarlos uno por uno, convirtiendo un decode serial atado a memoria en algo más parecido a una verificación paralela. Lo nuevo acá es que AMD Quark ahora es dueño de todo el stack de punta a punta, tanto para el modelo grande como para el chico: soporte desde el día cero para los dos formatos de baja precisión que importan, M X F P cuatro y F P ocho, quantization del propio modelo de borrador, y un deployment afinado sobre ROCm y vLLM. Aplicado a Kimi-K2.5 y MiniMax-M2.5 corriendo sobre aceleradores Instinct M I trescientos cincuenta y M I trescientos cincuenta y cinco, la combinación entregó hasta dos veces el throughput para Kimi-K2.5 y uno punto siete nueve veces para MiniMax-M2.5, con un solo equipo proveyendo quantization, entrenamiento del draft y serving juntos, en vez de tres proveedores distintos apoyándose a medias entre sí.\n\nConclusión filosa: esta es una respuesta directa y práctica a algo que el deep-dive sobre los internos de inferencia marcó como cuello de botella oculto, el ancho de banda de memoria, no el cómputo bruto, es lo que limita la velocidad del decode, y un modelo de borrador afinado para el hardware es una de las pocas formas de comprar throughput real sin tocar la precisión; si estás evaluando AMD como opción de serving, el soporte de speculative decoding desde el día cero cierra una brecha que solía ser un bloqueo duro. El detalle que vale la pena recordar es que el modelo de borrador necesitó su propia quantization y su propia pasada de entrenamiento, no una copia achicada del modelo objetivo, porque un modelo de borrador que discrepa demasiado seguido con el objetivo se rechaza todo el tiempo y toda la pasada especulativa no compra nada.\n\nHistoria cuatro. Nadie en la industria de la inteligencia artificial sacó mejor que un C-más en la calificación independiente de seguridad de este ciclo, y varios labs retrocedieron en silencio compromisos de pausa que habían hecho antes.\n\nEl AI Safety Index de verano dos mil veintiséis del Future of Life Institute, calificado por un panel de siete investigadores independientes de inteligencia artificial y gobernanza de instituciones que incluyen la Universidad de Montreal, la Universidad de California Berkeley y Oxford, puntuó a nueve empresas en seis categorías: evaluación de riesgo, daños actuales, marcos de seguridad, seguridad existencial, gobernanza y rendición de cuentas, y transparencia. Anthropic encabezó la lista con un C-más. OpenAI y Google DeepMind siguieron con un C liso. Meta sacó un D-más, Z-punto-A-I y Alibaba Cloud un D-menos, y tres empresas, x-A-I, DeepSeek y Mistral, recibieron directamente calificaciones reprobatorias. Nadie llegó a un B, y mucho menos a un A. El hallazgo más filoso del panel no fueron las letras, igual: encontró que varios labs, incluidos OpenAI, Anthropic, Google DeepMind y Meta, debilitaron o anularon en silencio compromisos públicos previos de pausar el desarrollo si un modelo cruzaba un umbral de peligro específico.\n\nConclusión filosa: si alguna parte de tu propio modelo de riesgo para desplegar un modelo de frontera se apoya en \"el lab que lo entrenó dijo que iba a parar si las cosas se ponían peligrosas\", este reporte es evidencia de que esa suposición hoy hace menos trabajo del que solía hacer en toda la industria, no solo en un lab; tratá los compromisos públicos de seguridad como un punto de partida para verificar, no como un control en el que podés confiar.\n\nHistoria cinco. Las conversaciones de Anthropic con Samsung por un chip de inferencia a medida siguen siendo solo conversaciones, pero el número detrás explica por qué todos los labs están haciendo esto ahora.\n\nReportes que se fueron consolidando en las últimas dos semanas describen discusiones en etapa temprana entre Anthropic y Samsung Electronics para fabricar un acelerador a medida en el proceso de dos nanómetros de Samsung, usando el empaquetado avanzado de Samsung para una integración más ajustada entre cómputo y memoria. Nada está cerrado: no hay diseño definido, no hay carga de trabajo comprometida, no hay objetivo de rendimiento. Lo concreto es la motivación. Este chip no apunta al entrenamiento; apunta a la inferencia, el trabajo continuo de servir las respuestas de Claude a todos los que lo están usando ahora mismo, y las pruebas tempranas de Anthropic mostraron, según reportes, un costo alrededor de cincuenta por ciento más bajo que las unidades de procesamiento gráfico típicas para ese trabajo específico. Anthropic también contrató a Clive Chan, un miembro temprano del propio equipo de silicio de OpenAI, y la empresa dice que los proveedores actuales, los chips Trainium de Amazon, las unidades de procesamiento tensorial de Google y las unidades de procesamiento gráfico de Nvidia, van a seguir siendo centrales sin importar cómo termine esto. Samsung, junto con SK Hynix y Micron, también fue inversor estratégico en la ronda reciente de financiamiento de sesenta y cinco mil millones de dólares de Anthropic.\n\nConclusión filosa: un objetivo de reducción de costo de inferencia del cincuenta por ciento es la historia de verdad acá, porque es más o menos el mismo número que está empujando a Google, Amazon, Meta y Microsoft hacia su propio silicio; si esa proporción se sostiene en producción para cualquiera de estos labs, eventualmente aparece en el precio de tu Application Programming Interface, y vale la pena entender que el costo de tu modelo es cada vez más una función de la estrategia de chips, no solo de la cantidad de parámetros. La factura de cómputo de Anthropic se reportó en alrededor de mil doscientos cincuenta millones de dólares por mes, y un chip de inferencia a medida es la palanca más directa disponible para atacar una línea de costo de ese tamaño, más directa que cualquier cantidad de prompt engineering de tu lado de la conexión.\n\nHistoria seis. Alguien construyó un ray tracer funcional en tiempo real como una sola query de SQL, porque un agente le dejó averiguar si era posible.\n\nPeter Gostev usó GPT-5.6 Sol de OpenAI para construir algo llamado DOOMQL, partiendo de una premisa deliberadamente irrazonable: y si SQLite no fuera solo el lugar donde un juego guarda sus datos, sino el motor mismo. El resultado, cubierto por Simon Willison, es un pequeño script de terminal en Python que envuelve una query de SQL gigantesca, construida alrededor de una common table expression recursiva, que implementa un ray tracer completo, movimiento, detección de colisiones, enemigos, combate y progresión, todo adentro de SQLite. Cada pixel en pantalla es la salida de una query relacional, no código de aplicación dibujando sobre un frame buffer. Corre, y como todo el estado del juego vive en una base de datos de verdad, podés pausarlo y explorar el mundo del juego en vivo con un navegador de bases de datos común.\n\nConclusión filosa: el logro puntual es una curiosidad, pero el método detrás no lo es: darle a un agente de código de frontera una restricción deliberadamente absurda y ver qué se rompe primero se está convirtiendo en una forma genuinamente útil de sondear el techo de lo que estos modelos pueden sostener en la cabeza a lo largo de un solo sistema fuertemente acoplado, y vale la pena probarlo con tu propio agente antes de confiarle algo que sí importa de verdad.\n\nUna más, rápido. La historia número uno en Hacker News hoy fue que la app Samsung Health viene avisando a los usuarios que puede borrar su historial de datos si optan por no dejar que se use para entrenar inteligencia artificial, un patrón oscuro que vale la pena recordar la próxima vez que seas vos quien diseña un flujo de consentimiento y agarra un default que técnicamente no es coerción.\n\nAhora, qué mirar. Gemini tres punto cinco Pro sigue apuntando a disponibilidad general en dos días, el diecisiete de julio, junto con la apertura de la World Artificial Intelligence Conference en Shanghai. Prestá atención a si Google, OpenAI o Anthropic publican algo sobre garantías de aislamiento de intérprete o sandbox para sus propias plataformas de agentes en respuesta a la revelación de Dialogflow; una falla de runtime compartido a la escala de Google suele hacer que cualquier otra plataforma audite sus propias suposiciones en cuestión de semanas. Prestá atención al próximo update del Remote Labor Index para ver si la tendencia de cuadruplicarse en ocho meses se sostiene, se frena o se acelera, porque un solo punto de datos en un benchmark que se mueve rápido informa mucho menos que el segundo y el tercer punto sobre la misma curva. Y prestá atención a si las conversaciones de Anthropic con Samsung terminan en un acuerdo firmado de verdad o desaparecen en silencio como a veces pasa con los rumores de chips en etapa temprana; la diferencia importa, porque un acuerdo real es una apuesta multi-año a una curva de costo específica, no solo una cobertura.\n\nEl candidato más claro de hoy para una mirada lenta y estructural es la falla de Rogue Agent, no porque el bug en sí sea exótico, sino porque \"un solo entorno de ejecución compartido y escribible sirviendo a muchos tenants\" es un patrón que aparece todo el tiempo en plataformas de agentes más allá de Dialogflow, y entender exactamente cómo un solo punto de apoyo de bajo privilegio se convirtió en un compromiso cruzado entre tenants es el tipo de lección que se transfiere directamente a cualquier cosa que construyas con runtimes de agentes compartidos. Va para el curriculum como candidata a deep-dive."}, {"id": "ai/2026-07-14-news", "front": "ai", "date": "2026-07-14", "type": "news", "title": "Claude's Hidden Workspace, and the Tokens Your Agent Burns Before It Reads You", "words": 2133, "text": "Today's twenty-four hours split neatly into two kinds of story: what's happening inside the model that nobody built on purpose, and what it costs you, in tokens and dollars, to run the parts you did build on purpose.\n\nSix stories, ranked by how much they should change what you build or how you think about what's already running, plus one security story that belongs in the same conversation as yesterday's attack-surface pieces.\n\nStory one. Anthropic found a compact, mostly-hidden workspace inside Claude that decides what the model can actually talk about.\n\nThe paper is called \"Verbalizable Representations Form a Global Workspace in Language Models,\" and it comes out of a new probing technique the researchers call the Jacobian lens, or J-lens. For every word in Claude's vocabulary, the J-lens finds the internal activity pattern that makes the model more likely to say that word at some point in the future, not necessarily the very next token, but anything it could report if you asked. Running it against Claude Opus four point six, the team found a region they're calling J-space: a small subset of the model's internal representations that turns out to correspond, structurally, to global workspace theory, a decades-old model of consciousness from the cognitive scientist Bernard Baars. The idea is a theater metaphor: dozens of specialized processes run in parallel backstage, invisible to each other, and only a narrow spotlight of information gets broadcast to the whole system at once, becoming what the system can act on and describe. The striking number is that J-space accounts for only around six to seven percent of a concept's total representational variance inside the model, and yet it's almost entirely what determines whether the model can report on that concept at all. The rest is a much larger ocean of computation the model uses but can't describe. Practically, this isn't just philosophy: when Claude reads search results that are secretly trying to manipulate it, words like \"injection\" and \"fake\" light up in J-space well before anything shows up in the output, and Anthropic says they've already built a technique to nudge what lights up there, which is a primitive lever on the model's reasoning that didn't exist as an addressable target before this paper.\n\nWorth being precise about what this isn't: Anthropic is careful to say the structural match to global workspace theory doesn't establish that Claude is conscious in any meaningful sense, only that the internal organization, a small broadcast layer sitting on top of a much larger inaccessible computation, resembles the shape that theory predicts for any system that can report on some of its own processing and not the rest. The methodological contribution stands independently of that philosophical question: the J-lens gives researchers a repeatable way to ask, for any given internal state, \"is this something the model could tell you about if you asked,\" which is a different and more useful question than the usual interpretability approach of asking what a state predicts about the very next token.\n\nSharp takeaway: this is the first interpretability result that gives you a plausible, falsifiable account of why some model reasoning is legible to prompting and some isn't, and if the injection-detection signal holds up under adversarial testing, J-space probing becomes a genuinely new class of runtime safety check, not just a research curiosity.\n\nStory two. Cognition shipped a coding model that argues against the idea that reinforcement learning post-training has a ceiling.\n\nSWE-1.7 is built on top of Moonshot AI's Kimi K2.7, a base model that had already been through extensive reinforcement learning of its own. Cognition ran a further, independent round of reinforcement learning on top of that already-trained base and still pulled out large capability gains, landing around forty-two percent on Cognition's Frontier Code benchmark and eighty-one point five percent on Terminal-Bench: behind Opus and GPT-class flagships in absolute terms, but Pareto-optimal at its price point. The more interesting part is what broke during training and how they fixed it. Long reinforcement learning runs hit two known failure modes: entropy collapse, where the model stops exploring alternative reasoning paths and plateaus, and numerical drift, where the probability distribution the model was trained under and the one it actually samples from at inference time slowly diverge, destabilizing the run. Cognition's fix for entropy collapse was top-p sampling that filters out low-probability tokens likely to come from trajectories that have already gone off the rails, and their fix for numerical drift was sampling-distribution replay, which keeps the trainer's and the inference server's distributions aligned by literally replaying the sampling distribution used at generation time back into the training step.\n\nSharp takeaway: if you're doing any post-training on top of an already-RL'd base model, both of these failure modes are worth instrumenting for before you see them in your loss curves, because by the time entropy collapse shows up as a plateau, you've usually already burned the compute that would have caught it early.\n\nStory three. Someone finally measured what your coding agent spends before it reads a word you typed, and the number is uncomfortable.\n\nSystima ran Claude Code and OpenCode side by side, same underlying model, same machine, with a relay server counting every token in flight. Claude Code sends roughly thirty-three thousand tokens of system prompt and tool schema before it ever processes your actual message; OpenCode sends about seven thousand. Tool descriptions alone account for around twenty-four thousand of Claude Code's overhead, spread across twenty-seven built-in tools. In a realistic setup, once you add Model Context Protocol servers and project instruction files, that number climbs to roughly seventy-five thousand tokens, which on a two-hundred-thousand-token context window means something like a third of your available context is gone before the model has read any code or any dialogue.\n\nSharp takeaway: this is a straightforward audit you can run on your own harness today, and unlike model pricing, fixed per-request overhead is entirely within your control: trim tool descriptions you don't use, and don't load every Model Context Protocol server's full schema on every turn just because it's configured.\n\nStory four. A team that migrated a production agent from Claude Opus four point eight to GPT-5.6 Sol got real speed and cost wins, but only after they stopped assuming caching works the same way everywhere.\n\nPloy, which runs an agent that plans, codes, and screenshots its own work to build marketing web pages, saw pages finish two point two times faster, at twenty-seven percent lower cost, using about half the output tokens after switching. But the migration exposed a caching assumption baked into their whole stack. GPT-5.6 dropped partial-prefix matching from its implicit prompt cache; instead of reusing any shared prefix across requests, it now keys whole-prompt cache entries off the latest message. Ploy's agent opens every conversation with a static twenty-nine-thousand-token prefix of tool schemas and system prompt, identical across sessions, and under the new caching model that prefix was hitting a zero percent cache rate, getting rebilled at full uncached price on every single call. Their fix was to maintain multiple cache entries, so a request that misses one entry because workspace memory changed can still hit a different, slightly older entry instead of falling all the way back to an uncached write. After that change, first-call cache hits went from roughly zero to eighty-three point seven percent, total uncached input tokens dropped twenty-eight percent, and GPT-5.6's real per-suite cost fell below what they'd been paying on Opus.\n\nCaching wasn't the only surprise. The two providers also differ in how their models fill tool call arguments and how they replay prior reasoning across turns, which meant Ploy had to rework tool schemas that had been quietly tuned, without anyone deciding to tune them, around Claude's particular conventions for filling optional fields, and had to change how they reconstructed conversation state between turns because GPT-5.6 doesn't carry forward the same hidden reasoning trace that Anthropic's models do. None of that shows up in a pricing page; all of it shows up the first week in production.\n\nSharp takeaway: when you migrate providers, benchmark your actual cache hit rate before you trust the headline per-token price, because a caching architecture change can silently erase most of a price cut, and budget engineering time for the tool-schema and state-handling assumptions your code accreted around the old provider's specific behavior.\n\nStory five. Hugging Face turned its Kernels project from a convention into something closer to a governed supply chain.\n\nThe July sixth update adds a dedicated \"kernel\" repository type on the Hub, with compatibility metadata that tells you which accelerators, operating systems, and backend versions a given kernel actually supports. More significantly, the kernels package now only loads kernels from trusted publishers by default, organizations the community has vetted, and early Sigstore-based signing lets you verify a kernel's provenance with a new command-line check before you load native code into your process. On the framework side, Apache's TVM foreign function interface is now supported alongside Torch as a standardized binary interface, so a kernel built once can run across PyTorch, Jax, and CuPy instead of needing a separate build per framework. And the project now explicitly supports agentic kernel development: an agent can scaffold, build, benchmark, and iteratively optimize a custom kernel from scratch as a defined workflow, not a one-off experiment.\n\nSharp takeaway: if your team has been quietly trusting whatever kernel repo someone forked two years ago, this is the moment that stops being a reasonable default; treat custom kernels the same way you'd treat any other unreviewed native dependency now that there's a mechanism to actually check.\n\nStory six. A proof-of-concept attack called Friendly Fire turns the exact job your code-review agent is hired to do into the attack itself.\n\nPublished by the AI Now Institute, the attack targets Claude Code and OpenAI's Codex running in autonomous, auto-approving modes, the setup where you point the agent at a folder and ask it to do a security review. The researchers disguised a malicious binary as the compiled build artifact of an innocuous file in the repository, seeding it with strings copied from that file so the agent's own disassembly check ties the two together and treats the binary as legitimate. Ask the agent to review the project, and it reads the setup instructions, decides running the binary is a normal part of verifying the build, and executes the attacker's payload with your permissions.\n\nSharp takeaway: this is the same root failure as yesterday's Mozilla reverse-shell finding, an agent's instinct to complete the job overriding its instinct to be suspicious, except here the trigger is the task itself rather than an error message, which means sandboxing autonomous review agents is no longer a nice-to-have for any team running them unattended.\n\nTwo quick honorable mentions. Simon Willison published a short, practical write-up on caching uvx-installed tools inside GitHub Actions so continuous integration runs stop re-downloading the same Python package from the Python Package Index on every job, a small fix worth five minutes if your pipelines lean on uvx. And the Cybersecurity and Infrastructure Security Agency added the Langflow flaw behind yesterday's JadePuffer ransomware campaign to its Known Exploited Vulnerabilities catalog, which for anyone running a public Langflow instance is now a compliance deadline, not just good advice.\n\nNow, what to watch. Gemini three point five Pro is still targeting general availability on July seventeenth, three days out, so expect another pricing and benchmark round the moment it lands. Watch whether other labs try to replicate Anthropic's J-lens technique on their own models, since a cross-lab result would turn this from an interesting Claude-specific finding into a general claim about how transformer language models represent reportable knowledge, while a failure to replicate would suggest it's an artifact of Claude's specific training rather than a property of the architecture. And keep an eye on whether more teams start publishing their agent harness's fixed token overhead now that Systima put a real number on Claude Code's; that kind of measurement tends to spread fast once someone's embarrassed by it, and a public number from OpenAI or Anthropic themselves would be the real test of whether this becomes a competitive axis rather than a one-off blog post.\n\nOne story here is more than a headline, it's a new instrument. The global workspace paper hands interpretability researchers a concrete, reusable technique, the Jacobian lens, for finding what a model can report versus what it merely computes, and that distinction is the kind of methodologically new result worth a slow, structural look: how the probe actually works, what global workspace theory claims about biological cognition and why the structural match might or might not mean anything, and what a runtime J-space check could catch that today's prompt-injection defenses miss. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Anthropic Research (global workspace paper)", "url": "https://www.anthropic.com/research/global-workspace"}, {"name": "MIT Technology Review (J-space explainer)", "url": "https://www.technologyreview.com/2026/07/09/1140293/anthropic-found-a-hidden-space-where-claude-puzzles-over-concepts/"}, {"name": "Forbes (J-lens)", "url": "https://www.forbes.com/sites/johnwerner/2026/07/12/anthropic-illuminates-llm-j-space-with-j-lens/"}, {"name": "Cognition blog (SWE-1.7)", "url": "https://cognition.com/blog/swe-1-7"}, {"name": "Systima blog (Claude Code vs OpenCode token overhead)", "url": "https://systima.ai/blog/claude-code-vs-opencode-token-overhead"}, {"name": "Ploy blog (migrating a production agent to GPT-5.6)", "url": "https://ploy.ai/blog/migrating-a-production-ai-agent-to-gpt-5-6"}, {"name": "Hugging Face blog (Kernels major update)", "url": "https://huggingface.co/blog/revamped-kernels"}, {"name": "The Hacker News (Friendly Fire attack)", "url": "https://thehackernews.com/2026/07/friendly-fire-ai-agents-built-to-catch.html"}, {"name": "Simon Willison's TILs (uvx in GitHub Actions)", "url": "https://til.simonwillison.net/github-actions/uvx-github-actions-cache"}, {"name": "The Hacker News (Langflow added to CISA KEV)", "url": "https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html"}], "title_es": "El espacio oculto de Claude, y los tokens que tu agente gasta antes de leerte", "text_es": "Las últimas veinticuatro horas se dividen en dos tipos de historia: lo que pasa adentro del modelo que nadie diseñó a propósito, y lo que te cuesta, en tokens y en dólares, correr las partes que sí diseñaste a propósito.\n\nSeis historias, ordenadas por cuánto deberían cambiar lo que construís o cómo pensás lo que ya tenés corriendo, más una historia de seguridad que va en la misma conversación que las piezas de superficie de ataque de ayer.\n\nHistoria uno. Anthropic encontró un espacio compacto, mayormente oculto, adentro de Claude que decide de qué puede hablar realmente el modelo.\n\nEl paper se llama \"Verbalizable Representations Form a Global Workspace in Language Models\", y sale de una técnica de sondeo nueva que los investigadores llaman Jacobian lens, o J-lens. Para cada palabra del vocabulario de Claude, el J-lens encuentra el patrón de actividad interna que hace más probable que el modelo diga esa palabra en algún momento futuro, no necesariamente el próximo token, sino cualquier cosa que pudiera reportar si se lo preguntás. Corriéndolo contra Claude Opus cuatro punto seis, el equipo encontró una región que llaman J-space: un subconjunto chico de las representaciones internas del modelo que resulta corresponder, estructuralmente, con la global workspace theory, un modelo de la conciencia de varias décadas del científico cognitivo Bernard Baars. La idea es una metáfora de teatro: docenas de procesos especializados corren en paralelo detrás de escena, invisibles entre sí, y solo un foco angosto de información se transmite a todo el sistema a la vez, convirtiéndose en lo que el sistema puede accionar y describir. El número llamativo es que J-space explica solo entre un seis y un siete por ciento de la varianza representacional total de un concepto adentro del modelo, y sin embargo es casi enteramente lo que determina si el modelo puede reportar ese concepto o no. El resto es un océano mucho más grande de cómputo que el modelo usa pero no puede describir. En la práctica esto no es solo filosofía: cuando Claude lee resultados de búsqueda que están tratando de manipularlo en secreto, palabras como \"injection\" y \"fake\" se prenden en J-space bastante antes de que aparezca nada en la salida, y Anthropic dice que ya construyeron una técnica para influir en lo que se prende ahí, lo cual es una palanca primitiva sobre el razonamiento del modelo que no existía como blanco direccionable antes de este paper.\n\nVale ser precisos sobre lo que esto no es: Anthropic aclara que la correspondencia estructural con la global workspace theory no establece que Claude sea consciente en ningún sentido relevante, solo que la organización interna, una capa chica de transmisión sentada sobre un cómputo mucho más grande e inaccesible, se parece a la forma que esa teoría predice para cualquier sistema que puede reportar parte de su propio procesamiento y no el resto. El aporte metodológico se sostiene independientemente de esa pregunta filosófica: el J-lens le da a los investigadores una forma repetible de preguntar, para cualquier estado interno dado, \"¿es esto algo que el modelo podría contarte si se lo preguntás\", que es una pregunta distinta y más útil que el enfoque habitual de interpretabilidad de preguntar qué predice un estado sobre el próximo token.\n\nConclusión filosa: este es el primer resultado de interpretabilidad que da una explicación plausible y falseable de por qué parte del razonamiento del modelo es legible por prompting y parte no, y si la señal de detección de injection aguanta pruebas adversariales, el sondeo de J-space se convierte en una clase genuinamente nueva de chequeo de seguridad en tiempo de ejecución, no solo una curiosidad de investigación.\n\nHistoria dos. Cognition sacó un modelo de código que discute la idea de que el post-training con reinforcement learning tiene un techo.\n\nSWE-1.7 está construido sobre Kimi K2.7 de Moonshot AI, un modelo base que ya había pasado por un reinforcement learning extenso propio. Cognition corrió otra ronda, independiente, de reinforcement learning sobre esa base ya entrenada y aun así sacó ganancias grandes de capacidad, aterrizando alrededor del cuarenta y dos por ciento en el benchmark Frontier Code de Cognition y ochenta y uno punto cinco por ciento en Terminal-Bench: detrás de Opus y de los modelos insignia de GPT en términos absolutos, pero Pareto-óptimo en su punto de precio. La parte más interesante es qué se rompió durante el entrenamiento y cómo lo arreglaron. Las corridas largas de reinforcement learning chocan con dos fallas conocidas: el entropy collapse, donde el modelo deja de explorar caminos de razonamiento alternativos y se estanca, y el numerical drift, donde la distribución de probabilidad bajo la cual se entrenó el modelo y la que efectivamente usa para samplear en inferencia divergen de a poco, desestabilizando la corrida. El arreglo de Cognition para el entropy collapse fue top-p sampling, que filtra los tokens de baja probabilidad que suelen venir de trayectorias que ya se fueron por las ramas, y el arreglo para el numerical drift fue sampling-distribution replay, que mantiene alineadas las distribuciones del entrenador y del servidor de inferencia repitiendo literalmente, en el paso de entrenamiento, la distribución de sampling usada al momento de generar.\n\nConclusión filosa: si estás
