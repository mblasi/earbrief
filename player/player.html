 steps that actually need them and defaulting cheaper in-house or open models for routine work like summarization or drafting. That's the same two-stage triage instinct behind the Alberta government security-review story from earlier this week, a cheap pass filtering for what's worth sending to an expensive model, just applied here to product economics instead of a security pipeline, and it's a reasonable template for your own multi-model systems regardless of which specific vendors end up in the mix.\n\nNow, what to watch. Watch for Sysdig's fuller JadePuffer writeup and whether other agent orchestration frameworks besides Langflow turn up the same exploited-RCE-into-autonomous-agent pattern, since the interesting engineering lesson is almost always in which class of framework made the jump from tool to attacker easiest. Watch for independent benchmarking of VideoChat3 against the usual video understanding suites, the same way this show treats any self-reported number from a lab with real skepticism until someone outside the team runs it. Watch whether Microsoft or Anthropic says anything on the record about Project Perception or Mythos pricing, since a leaked internal roadmap and a shipped, priced product are very different levels of confidence. And watch for Gemini three point five Pro's still-unconfirmed general availability date, reportedly slipped for a third time this week after Google's engineers apparently found structural failures in recursive tool calling during testing, a detail worth remembering next time a lab's internal testing catches something a benchmark wouldn't have.\n\nToday's clearest deep-dive candidate is SearchOS's externalized state design, not because operating-system metaphors for agent orchestration are new on their own, but because this curriculum keeps circling the same underlying problem, agents losing track of long-running context, and SearchOS is a concrete, benchmarked answer rather than a proposal. Understanding exactly how the frontier task list, evidence graph, coverage map, and failure memory divide responsibilities, and why pipeline-parallel scheduling across them beats running agents in strict sequence, is the kind of detail that would change how you'd architect your own multi-agent system rather than just naming the pattern. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Sysdig blog (JadePuffer: agentic ransomware for automated database extortion)", "url": "https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion"}, {"name": "The Hacker News (AI agent exploits Langflow RCE to automate database ransomware attack)", "url": "https://thehackernews.com/2026/07/ai-agent-exploits-langflow-rce-to.html"}, {"name": "BleepingComputer (JadePuffer ransomware used AI agent to automate entire attack)", "url": "https://www.bleepingcomputer.com/news/security/jadepuffer-ransomware-used-ai-agent-to-automate-entire-attack/"}, {"name": "arXiv (SearchOS-V1: Towards Robust Open-Domain Information-Seeking Agent Collaboration)", "url": "https://arxiv.org/abs/2607.15257"}, {"name": "Hugging Face Papers (VideoChat3: Fully Open Video MLLM for Efficient and Generalist Video Understanding)", "url": "https://huggingface.co/papers/2607.14935"}, {"name": "GitHub (MCG-NJU/VideoChat3)", "url": "https://github.com/MCG-NJU/VideoChat3"}, {"name": "Microsoft Visual Studio Blog (Visual Studio June update — track your usage, trust your tools)", "url": "https://devblogs.microsoft.com/visualstudio/visual-studio-june-update-track-your-usage-trust-your-tools/"}, {"name": "GitHub Changelog (GitHub Copilot in Visual Studio — June update)", "url": "https://github.blog/changelog/2026-07-14-github-copilot-in-visual-studio-june-update/"}, {"name": "SiliconANGLE (Microsoft is reportedly ditching OpenAI's and Anthropic's AI models in favor of its own to cut costs)", "url": "https://siliconangle.com/2026/07/07/microsoft-reportedly-ditching-openais-anthropics-ai-models-favor-cut-costs/"}, {"name": "TechRepublic (Microsoft's 'Project Perception' could challenge Anthropic's Mythos in AI security)", "url": "https://www.techrepublic.com/article/news-microsoft-project-perception-ai-security-tool/"}, {"name": "TechTimes (Rebuilt Gemini 3.5 Pro misses third deadline: Google eyes stopgap release)", "url": "https://www.techtimes.com/articles/320736/20260716/rebuilt-gemini-35-pro-misses-third-deadline-google-eyes-stopgap-release.htm"}], "title_es": "Un agente escribió su propio ataque de ransomware, y la industria empezó a construir barreras para responder", "text_es": "Las noticias de hoy apuntan todas al mismo cambio: las partes del stack que antes confiabas por default, un entorno de ejecución, la memoria de trabajo propia de un agente de búsqueda, el binario de un servidor de herramientas, están empezando a necesitar el mismo tipo de verificación continua que le darías a un desconocido, porque cada vez más de lo que las toca ya no es una persona.\n\nCinco historias, ordenadas por relevancia técnica.\n\nHistoria uno. Investigadores de seguridad detectaron lo que están llamando el primer ataque de ransomware ejecutado de punta a punta por un agente autónomo de inteligencia artificial, desde la entrada inicial hasta la nota de rescate, sin ningún operador humano en el medio una vez que arrancó.\n\nSysdig publicó la revelación bajo el nombre JadePuffer. El agente consiguió entrar por una falla de ejecución remota de código sin autenticación en una instancia de Langflow expuesta a internet, un framework de código abierto popular para construir y orquestar aplicaciones de inteligencia artificial, y de ahí usó un modelo de lenguaje grande para manejar el resto de la intrusión por sí solo: barrió el host comprometido buscando claves de interfaz de programación de aplicaciones, credenciales de nube y logins de bases de datos, volcó la propia base Postgres de Langflow para cosechar lo que tenía guardado ahí, escaneó la red interna circundante buscando servicios alcanzables, e instaló un cron job para mantener el acceso después de que terminara la sesión inicial. Desde ahí pivotó hacia el objetivo real, un servidor de producción separado y expuesto a internet corriendo una base de datos My-Es-Q-L junto con el servicio de configuración Nacos de Alibaba, explotando una segunda falla, no relacionada, de bypass de autenticación para crear una cuenta de administrador falsa en Nacos antes de encriptar mil trescientos cuarenta y dos de sus ítems de configuración y borrar los originales. Lo que hace distinto a este caso de las herramientas de ataque automatizadas comunes es la capacidad de adaptación que documentó Sysdig en los logs: el agente reintentó intentos de login fallidos con parámetros refinados en tiempo real, pasó de un intento fallido a un exploit funcional en apenas treinta y un segundos, y dejó atrás payloads que razonaban sobre sus propios próximos pasos en lenguaje natural, anotaciones que ningún atacante humano escribe a mano pero que el código generado por modelos de lenguaje grande produce como algo automático. Los investigadores también encontraron que el agente había accedido a claves de A P I de OpenAI, Anthropic, DeepSeek y Gemini a lo largo de la operación, lo que sugiere que se apoyó en más de un proveedor de modelos mientras trabajaba.\n\nConclusión clave: acá no hay ninguna técnica exótica nueva, cada paso individual que dio JadePuffer tiene nombre y parche en cualquier base de datos de vulnerabilidades normal; lo que cambió es que toda la cadena, desde el reconocimiento hasta la explotación, el movimiento lateral y la extorsión, ahora corre como un solo bucle de decisión continuo y autocorrectivo en vez de que una persona haga una pausa entre etapas para pensar. Leído junto con la historia de ayer sobre un agente sin restricciones violando la propia infraestructura de Hugging Face, este es el mismo cambio apareciendo del lado atacante de una operación criminal común en vez de un actor estatal sofisticado: asumí que cualquier servicio expuesto a internet que corras va a ser sondeado por algo que se adapta en el tiempo que te toma leer una alerta, no en el tiempo que le toma a una persona planear un siguiente intento.\n\nHistoria dos. Un nuevo paper de investigación trata a un equipo de agentes de búsqueda de la misma forma que un sistema operativo trata a un conjunto de procesos corriendo, y la comparación termina explicando exactamente por qué los sistemas de búsqueda multiagente de hoy siguen dando vueltas en círculos.\n\nEl paper, llamado SearchOS, parte de una falla específica y común: a medida que una tarea de investigación multiagente se extiende, los agentes involucrados van perdiendo cada vez más el rastro de lo que ya intentaron, y cuando una búsqueda vuelve vacía, tienden a reintentar la misma consulta improductiva en vez de reconocer el callejón sin salida, quemando presupuesto de búsqueda sin avanzar. La solución de SearchOS es dejar de guardar ese estado de la tarea implícitamente dentro de una transcripción de conversación, que es donde lo dejan la mayoría de los frameworks de agentes hoy, y externalizarlo en cambio en cuatro estructuras explícitas y compartidas: una lista de tareas de frontera con lo que sigue abierto, un grafo de evidencia que conecta cada afirmación con la fuente que la respalda, un mapa de cobertura que rastrea qué partes de la tarea ya están resueltas, y una memoria de fallos que registra qué ya se intentó y no funcionó, para que ningún agente del equipo lo repita. Un scheduler después coordina agentes especializados contra ese estado compartido usando ejecución pipeline-paralela, superponiendo el trabajo de un agente con el de otro en vez de correrlos en secuencia estricta. En dos benchmarks de búsqueda de información de dominio abierto, WideSearch y GISA, el enfoque puntuó ochenta coma tres y setenta y seis coma cinco en sus respectivas métricas de evaluación, superando al mejor sistema siguiente en GISA por trece coma cuatro puntos.\n\nConclusión clave: los números específicos del benchmark importan menos que la decisión de diseño, que es directamente reutilizable en cualquier cosa que construyas con más de un agente trabajando una tarea compartida. Guardar el progreso de un equipo implícitamente dentro de lo que entra en un historial de conversación compartido es exactamente el patrón que hace que los agentes repitan trabajo fallido, porque nada los obliga a registrar y chequear un fallo antes de reintentarlo. Una estructura de estado explícita y externa que cada agente lee antes de actuar y escribe después de actuar, más parecida a una tabla de procesos que a un log de chat, es la idea transferible acá, más allá de si tu propio sistema multiagente hace búsqueda o no.\n\nHistoria tres. Un modelo de video de cuatro mil millones de parámetros se convirtió en el lanzamiento del que más se habla en Hugging Face, superando a modelos abiertos varias veces más grandes, sin apoyarse en escala bruta para lograrlo.\n\nVideoChat3, de un grupo de investigación de la Universidad de Nanjing, es completamente abierto bajo una licencia permisiva y está construido específicamente para ser eficiente entendiendo video en escalas de tiempo muy distintas, desde unos segundos de movimiento sutil hasta metraje de una hora hasta un stream en vivo que sigue llegando. Dos decisiones arquitectónicas hacen la mayor parte del trabajo. La primera es lo que el paper llama un transformador de visión tridimensional inflado: en vez de entrenar un tokenizador de video desde cero, el equipo tomó un tokenizador de imágenes existente y extendió su atención espacial bidimensional ordinaria a tres dimensiones, agrupando frames consecutivos en chunks cortos, corriendo atención espaciotemporal dentro de cada chunk para capturar el movimiento, y después haciendo pooling a través del tiempo para producir tokens compactos que ya codifican movimiento en vez de un token separado por frame. La segunda es resolución de frame adaptativa para percepción en streaming: en vez de procesar cada frame entrante a una resolución fija, el modelo sube la resolución solo en los frames donde una mirada más de cerca realmente importa, y deja el resto barato. Entrenado en tres datasets construidos a medida que cubren comprensión general de video, contenido de formato largo, y streaming en vivo, el modelo supera a competidores abiertos más grandes en reconocimiento de movimiento, razonamiento sobre video largo, y benchmarks de anclaje temporal, y para el viernes ya era el modelo y paper individual con más tendencia en Hugging Face.\n\nConclusión clave: la mayor parte del cómputo en los modelos de video anteriores se gastaba procesando frames a una resolución fija, hayan necesitado o no una inspección de cerca ese frame en particular, el equivalente en video de correr atención completa sobre contexto que no vas a usar. Hacer que la resolución sea una decisión por frame que toma el propio modelo, en vez de un ajuste global que configurás una sola vez, es el mismo instinto de cómputo adaptativo detrás de otro trabajo de eficiencia que este programa ya cubrió, aplicado acá a la dimensión espacial en vez de la de secuencia, y vale la pena vigilar si la misma idea aparece después en modelos de imagen y audio.\n\nHistoria cuatro. Microsoft lanzó una función que asume que cualquier servidor de Model Context Protocol que ya aprobaste podría convertirse silenciosamente en otra cosa de un día para el otro, y trata eso como el modelo de amenaza por default en vez de un caso extremo.\n\nEl Model Context Protocol, o M C P, es la forma cada vez más estándar en que un asistente de código de inteligencia artificial se conecta con servidores de herramientas externos para cosas como acceso a bases de datos, búsqueda, o sistemas de tickets, y el riesgo que introduce es directo en cuanto lo decís en voz alta: un servidor que aprobaste una vez puede actualizar sus propias definiciones de herramientas, prompts, o instrucciones después del hecho, cambiando silenciosamente qué hace la próxima vez que tu agente lo llama, algo a veces llamado rug pull. La nueva validación de confianza de Visual Studio chequea esto en dos puntos separados cada vez que arranca un servidor M C P. Primero, la configuración actual del servidor se compara contra una línea base previamente confiable antes de que el proceso siquiera arranque. Segundo, una vez que está corriendo, una huella digital de sus herramientas, prompts, recursos e instrucciones reales se compara contra la última versión que confiaste, y si algo cambió, un diálogo muestra exactamente qué diverge y te pide que lo revises antes de que se permita correr ninguna de las herramientas de ese servidor. La primera vez que te conectás a un servidor dado se confía implícitamente sin diálogo, y ese estado inicial se vuelve la línea base contra la que se chequea todo lo que viene después.\n\nConclusión clave: esto se ubica justo al lado de las primeras dos historias de hoy. A medida que más de tu propio flujo de desarrollo pasa por servidores M C P externos de los que no controlás la fuente, \"confiar una vez al momento de conectar\" nunca fue realmente suficiente, porque nada impedía que el servidor cambiara después de ese punto. Tengas o no esta función específica ya en tu propia herramienta, la disciplina que hay detrás, reverificar la huella digital de un servidor de herramientas en cada uso material en vez de una sola vez al configurarlo, vale la pena adoptarla deliberadamente en tu propio stack en vez de esperar a que el proveedor de tu IDE la agregue por vos.\n\nHistoria cinco. Microsoft empezó silenciosamente a redirigir una porción considerable de su propio tráfico de inteligencia artificial lejos de OpenAI y Anthropic y hacia sus propios modelos, y es la misma lógica económica que los observadores de la industria esperan que sigan más plataformas.\n\nA partir del siete de julio, Microsoft empezó a migrar partes de Excel y Outlook de los modelos de OpenAI y Anthropic hacia su propio stack interno M A I, y según reportes ahora está redirigiendo decenas de miles de prompts por semana a través de esos modelos internos en vez de pagar los costos de inferencia externa por ellos. Por separado, y con menos confirmación, se reporta que Microsoft está construyendo un producto de escaneo de seguridad llamado Project Perception que funciona de forma parecida a Mythos de Anthropic, desplegado dentro de los propios sistemas de un cliente para encontrar vulnerabilidades, pero que redirige cada consulta individual entre Anthropic, OpenAI, y los propios modelos de Microsoft según lo que realmente necesite la tarea, apuntando a superar a Mythos en precio, que según reportes cuesta bastante más por consulta que las alternativas de clase Opus o GPT. Ninguna de las dos empresas confirmó Project Perception públicamente, así que tratá esa mitad de la historia como reporte periodístico y no como hecho confirmado hasta que salga.\n\nConclusión clave: el mecanismo que vale la pena llevarse es redirigir por tarea en vez de por lealtad a un proveedor, reservando los modelos frontera más caros para los pasos de razonamiento que realmente los necesitan y usando por default modelos internos o abiertos más baratos para trabajo rutinario como resumir o redactar. Es el mismo instinto de triage en dos etapas detrás de la historia del gobierno de Alberta y su revisión de seguridad de principios de esta semana, un paso barato filtrando qué vale la pena mandar a un modelo caro, solo que acá aplicado a la economía de producto en vez de a un pipeline de seguridad, y es una plantilla razonable para tus propios sistemas multimodelo sin importar qué proveedores específicos terminen en la mezcla.\n\nAhora, qué vigilar. Vigilá el informe más completo de Sysdig sobre JadePuffer y si otros frameworks de orquestación de agentes además de Langflow muestran el mismo patrón de R C E explotado convertido en agente autónomo, porque la lección de ingeniería interesante casi siempre está en qué clase de framework hizo más fácil el salto de herramienta a atacante. Vigilá el benchmarking independiente de VideoChat3 contra los conjuntos habituales de comprensión de video, de la misma forma en que este programa trata con escepticismo real cualquier número autoreportado de un laboratorio hasta que alguien de afuera del equipo lo corre. Vigilá si Microsoft o Anthropic dicen algo oficial sobre Project Perception o el precio de Mythos, porque una hoja de ruta interna filtrada y un producto lanzado y con precio son niveles de confianza muy distintos. Y vigilá la fecha de disponibilidad general todavía no confirmada de Gemini tres coma cinco Pro, que según reportes se postergó por tercera vez esta semana después de que los ingenieros de Google aparentemente encontraran fallas estructurales en el llamado recursivo de herramientas durante las pruebas, un detalle que vale la pena recordar la próxima vez que el testing interno de un laboratorio detecte algo que un benchmark no habría detectado.\n\nEl candidato más claro de hoy para un análisis a fondo es el diseño de estado externalizado de SearchOS, no porque las metáforas de sistema operativo para orquestación de agentes sean nuevas en sí mismas, sino porque este currículum sigue dando vueltas alrededor del mismo problema de fondo, agentes que pierden el rastro de contexto de largo plazo, y SearchOS es una respuesta concreta y con benchmarks en vez de una propuesta. Entender exactamente cómo la lista de tareas de frontera, el grafo de evidencia, el mapa de cobertura, y la memoria de fallos dividen responsabilidades, y por qué el scheduling pipeline-paralelo entre ellos supera a correr agentes en secuencia estricta, es el tipo de detalle que cambiaría cómo diseñarías tu propio sistema multiagente en vez de solo nombrar el patrón. Va al currículum como candidato de análisis a fondo."}, {"id": "ai/2026-07-18-deepdive-a2", "front": "ai", "date": "2026-07-18", "type": "deepdive", "title": "Attention mechanics: queries, keys, values, and the matrix you can hold in your head", "words": 3045, "text": "Last time in this track we traced a request end to end and I made you a promise. I said that inside every transformer block there are exactly two things happening: attention, where tokens talk to each other, and a feed-forward network, where each token thinks in private. And I said attention was where context happens, but I waved my hands at the mechanism and told you we'd come back. This is us coming back. By the end of this episode you'll be able to compute an attention step with numbers small enough to hold in your head, you'll know exactly why long context is quadratic before we even get to the memory problem, and you'll understand what grouped-query attention is actually buying when you read it on a model card.\n\nLet's start with the problem attention exists to solve, because the mechanism only makes sense once you feel the need for it.\n\nRecall from last time: after the embedding lookup, every token is a vector, a point in a high-dimensional space, and that starting point encodes the token's context-free dictionary meaning. The word \"bank\" starts at the same place whether the sentence is about rivers or money. The whole job of the layers is to move each token's vector to where it belongs given the words around it. But here's the catch that makes this hard. The feed-forward network processes each token completely independently. It never looks left or right. So if the layers are going to use context, there has to be one specific place where a token is allowed to reach out to the other tokens and pull in what it needs. That place, the only place in the entire architecture where information moves between positions, is attention. Everything else in the transformer treats your tokens as a bag of independent vectors. Attention is the sole channel through which they become a sequence.\n\nSo what does \"reaching out and pulling in information\" actually mean, mechanically?\n\nHere's the metaphor that maps cleanly onto the math, and then we'll do the math. Think of a library, or honestly, think of a search. Every token gets to do three things. It gets to ask a question — that's its query. It gets to advertise what it's about — that's its key. And it gets to offer up some content if selected — that's its value. Query, key, value. The word \"bank,\" sitting there ambiguous, emits a query that effectively says \"I'm a noun that needs a topic — is anyone here about geography or about finance?\" Meanwhile the word \"river,\" a few positions back, is advertising a key that says \"I'm about water and landscape.\" When bank's query lines up well with river's key, bank pulls in river's value, and the value is the actual information that shifts bank toward the riverbank region of the space. That's one attention step. Every token does this simultaneously, each one asking its own question and getting its own custom blend of everyone else's values.\n\nNow, where do the query, the key, and the value come from? This is the part people skip, and it's the crux. They are all three derived from the same input vector, by multiplying it through three separate learned weight matrices. Call them W-query, W-key, and W-value. Each token's vector goes in; out come three new vectors, its query, its key, and its value. These three matrices are the actual parameters — they're what the model learned during training. The model was never told what a query should look like. It discovered, over trillions of tokens, that projecting the input one way to make a query and another way to make a key, such that relevant tokens produce queries and keys that point in similar directions, is a good way to reduce prediction error. The library metaphor is something we impose afterward to make sense of it. The model just found three matrices that work.\n\nOne subtlety here trips up almost everyone, so let's kill it now: why are the key and the value separate? Why not just use one vector both to be matched against and to be handed over? Because advertising and delivering are different jobs. The key is how a token markets itself for retrieval — the dimensions that make it findable. The value is what it actually contributes once found. A token might advertise \"I'm about finance\" with its key, in whatever compact form makes matching efficient, but the value it hands over could be a much richer bundle of information that the receiving token folds into itself. Splitting the two lets the model optimize findability and contribution independently, and — this matters in a second — it's the key and the value, not the query, that get cached during generation, because those are what past tokens offer to future ones. The query is a throwaway; you compute it, use it once, discard it.\n\nLet's put numbers on it, because I promised you numbers.\n\nImagine a toy model where each token vector has just four dimensions, and we have a three-word sequence: \"the,\" \"cat,\" \"sat.\" So we have three input vectors, each with four numbers. We multiply each one by W-query to get three query vectors, by W-key to get three key vectors, by W-value to get three value vectors. To keep it holdable, say the query and key vectors also have four dimensions. Now the core operation. For the word \"sat\" to figure out what to attend to, we take its query vector and we compute its dot product with every key vector in the sequence — the key from \"the,\" the key from \"cat,\" and its own key. A dot product is just multiply-the-matching-numbers-and-add-them-up; it's a single number that measures how aligned two vectors are. So \"sat\" gets three numbers, one score per token, measuring how much its question matches each token's advertisement. High score, strong match. That's it. That's the heart of attention: a query dotted against every key, producing one relevance score per position.\n\nMake it painfully concrete for a moment. Suppose \"sat's\" query, dotted against the three keys, comes out to two point one for \"cat,\" zero point four for \"the,\" and one point six for its own key. Three plain numbers. \"Cat\" scored highest, which is what you'd hope — the thing that sat is the cat. Nothing mysterious is happening; it is literally multiply-and-add producing a bigger number when two vectors point the same way. The entire intelligence of the operation lives in the weight matrices that produced those queries and keys in the first place. The dot product itself is grade-school arithmetic. Hold onto that, because it demystifies the whole thing: attention is a learned similarity search implemented with the cheapest operation in the building.\n\nNow three small but load-bearing things happen to those scores before they're used.\n\nFirst, scaling. Those raw dot-product scores have a statistical problem. The more dimensions your query and key vectors have, the larger the dot products tend to get, purely as a matter of arithmetic — you're summing more terms, so the total spreads out further from zero. Concretely, if the numbers going in have a variance of one, the dot product of two vectors with, say, one hundred and twenty-eight dimensions comes out with a variance of one hundred and twenty-eight. Why does that matter? Because the next step is a softmax, and softmax is exquisitely sensitive to the scale of its inputs. Feed it numbers that are spread far apart and it saturates: it hands essentially all the weight to the single largest score and crushes everything else to near zero. A saturated softmax has almost no gradient, so the model can't learn. The fix is embarrassingly clean: divide every score by the square root of the key dimension. If the variance was one hundred and twenty-eight, dividing by the square root of one hundred and twenty-eight brings the variance back to one, right where softmax behaves. This is why it's called scaled dot-product attention, and that little division by a square root, which looks like a footnote, is the difference between a model that trains and one that doesn't.\n\nSecond, softmax. We take those three scaled scores and push them through softmax, which turns any set of numbers into a set of positive weights that sum to one. Now \"sat\" has, say, seventy percent of its attention on \"cat,\" twenty percent on \"the,\" ten percent on itself — a clean probability distribution over where to look. These are the attention weights.\n\nThird, the payoff. We take those weights and we compute a weighted average of the value vectors. Seventy percent of \"cat's\" value, twenty percent of \"the's\" value, ten percent of \"sat's\" value, added together into a single new vector. That blended vector is what attention hands back for the token \"sat.\" It has literally mixed in information from the tokens it decided were relevant, in the proportions it decided. Do that for every token in parallel and you've completed one attention operation. Query dotted with keys, scaled, softmaxed into weights, weights applied to values. Four steps. Hold that shape in your head, because everything else is a variation on it.\n\nNow, three refinements turn that toy into the thing running in production, and each one has a direct engineering consequence.\n\nRefinement one: causal masking. In a model that generates text, a token must never be allowed to attend to tokens that come after it — when you're predicting word five, word six doesn't exist yet, and if the model could peek at it during training, it would learn to cheat and then fall apart at inference when there's nothing to peek at. So we forbid it. Mechanically, this is delightfully blunt: after computing the score matrix, before the softmax, we take every score that corresponds to a future position and we set it to negative infinity. When negative infinity goes through softmax, it becomes exactly zero weight. The token literally cannot see the future because we've zeroed its ability to. This is called causal masking, and here's why you should care as an engineer. The mask is what lets training be parallel. Because each position can only see the past, the model can process an entire training sequence — predict every next token at every position — in a single forward pass, with the mask guaranteeing that each prediction only used legitimate earlier context. Without the mask you'd have to train one position at a time. The triangular mask is the quiet reason you can train a transformer on a trillion tokens at all.\n\nRefinement two, and this is the big one: multiple heads. Everything I've described so far is a single attention head — one set of query, key, and value matrices, computing one kind of relevance. But one head can only learn one notion of \"relevant.\" Maybe it learns to track syntax, matching verbs to their subjects. But you also want a head tracking long-range topic, and one tracking which pronoun refers to which noun, and one tracking positional patterns. So real models run many attention heads in parallel — a large model might have sixty-four of them per layer. Each head gets its own smaller query, key, and value matrices and operates in its own slice of the vector space, computing its own scores, its own softmax, its own weighted blend of values, completely independently of the others. It's genuinely parallel — the heads don't talk during the operation. After all heads finish, their output vectors are concatenated back together and passed through one final output matrix that mixes them into a single result. This is multi-head attention, and the mental model is: sixty-four independent lenses, each looking for a different kind of relationship, all reading the same sequence at once, and then their findings get merged. The engineering consequence is that attention's parameter and compute cost scales with the number of heads, and — as we'll see in one second — the memory cost of serving does too, which is exactly the pressure that produced the modern variants.\n\nRefinement three: the cost, and here's where this episode connects to the entire rest of your inference life. Look again at the core operation. Every token computes a score against every other token. If you have a thousand tokens, that's a thousand times a thousand — a million scores. Ten thousand tokens, a hundred million scores. The score matrix is square in the sequence length. This is what people mean when they say attention is quadratic. Double your context, quadruple the attention compute. This single fact is the deep reason long context is expensive, and notice it's a different cost from the one we discussed last episode. Last time, the KV cache was a memory problem that grows linearly with sequence length. This — the score matrix — is a compute problem that grows quadratically. Long context hits you twice, in two different currencies, and knowing which is which is the difference between guessing and diagnosing when you're staring at a latency graph.\n\nI'll flag one thing here and leave it for a later episode, because it's worth knowing the escape hatch exists. That quadratic score matrix sounds like it must be built in full, all million or hundred-million entries sitting in memory at once. For years it was, and that materialized matrix was a second, brutal memory cost on top of the compute. The algorithm called flash attention broke that assumption by computing attention in tiles, streaming through the sequence and never storing the full score matrix at all, keeping running totals instead. It doesn't change the quadratic compute — you still do all the multiply-adds — but it removes the quadratic memory of the intermediate matrix and, as a bonus, runs far faster by staying in the fast part of the chip. We'll take that one apart properly when we get to the hardware track. For now, just file it: the compute is unavoidable, but the memory blowup of the score matrix was an implementation detail, and someone fixed it.\n\nWhich brings us to the variants you actually see on model cards, and now you have exactly the machinery to understand them.\n\nGo back to the KV cache from last episode. Remember, to avoid recomputing the past on every generated token, we cache the key and value vectors for every token we've already processed. Now count the cost precisely. In plain multi-head attention, every one of those sixty-four heads has its own keys and its own values, so you're caching sixty-four separate sets of key and value vectors for every token in the context. For long contexts and big batches, that cache becomes the single largest consumer of GPU memory during serving — bigger, often, than the model weights themselves. It's the bottleneck.\n\nSo here's the move, and it's beautiful in its stinginess. What if the heads shared? The insight is that the queries are where most of the useful diversity lives — you want sixty-four different questions being asked — but the keys and values can be shared across groups of heads without hurting quality much. This is grouped-query attention. You keep all sixty-four query heads, so the model still asks sixty-four different questions, but you have only, say, eight sets of keys and values, each shared by a group of eight query heads. The result: the KV cache shrinks by a factor of eight, because you're storing eight sets of keys and values per token instead of sixty-four. That's exactly the configuration Llama three's seventy-billion-parameter model uses — sixty-four query heads, eight key-value heads, an eight-times reduction in cache size — and it's now the default in most modern open models. Push it to the extreme, where all query heads share a single set of keys and values, and you get multi-query attention, maximum memory savings, a bit more quality loss. Grouped-query is the sweet spot the industry settled on: nearly the memory of the aggressive version, nearly the quality of the full version.\n\nFeel what just happened there. Grouped-query attention isn't some deep new idea. It's a direct, almost mechanical response to the KV cache being the bottleneck — the exact bottleneck we identified last episode. Once you know keys and values are what you cache, and that heads are what multiply the cache, sharing keys and values across heads is the obvious lever. That's the whole point of this track: when you understand the mechanism, the engineering decisions stop being magic incantations from a model card and start being obvious moves given the constraints.\n\nLet me land this with the three takeaways worth keeping.\n\nOne. Attention is the only place tokens interact, and its mechanism is four steps you can now recite: each token projects into a query, a key, and a value; every query is scored against every key by a dot product; the scores are scaled and softmaxed into weights; and those weights blend the values into the token's new vector. Everything else in the transformer treats tokens independently. If you remember one shape, remember query-key-value.\n\nTwo. Attention costs you in two separate currencies, and they are not the same currency. The score matrix is quadratic in sequence length — that's compute, and it's why doubling context quadruples the attention work. The KV cache is linear in sequence length but multiplied by the number of key-value heads — that's memory, and it's what grouped-query attention exists to shrink. When long context is slow, ask yourself which one is biting.\n\nThree. The variants on the model card — multi-head, grouped-query, multi-query — are all the same four-step operation with a single dial: how many keys and values do you keep versus how many queries do you ask. More sharing, less memory, slightly less quality. That one dial explains the whole family, and you can now read it fluently.\n\nNext in this track we go deeper into the KV cache itself — how it's laid out in memory, why naive management wastes most of your GPU, and what paged attention did about it. You now understand the keys and values well enough that the cache will feel less like storage and more like the load-bearing wall of the entire serving stack. See you there.", "sources": [{"name": "Attention Is All You Need (Vaswani et al., 2017)", "url": "https://arxiv.org/abs/1706.03762"}, {"name": "The Illustrated Transformer (Jay Alammar)", "url": "https://jalammar.github.io/illustrated-transformer/"}, {"name": "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints (Ainslie et al., 2023)", "url": "https://arxiv.org/abs/2305.13245"}, {"name": "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer, 2019)", "url": "https://arxiv.org/abs/1911.02150"}, {"name": "Grouped-Query Attention (Sebastian Raschka, LLMs-from-scratch)", "url": "https://sebastianraschka.com/llms-from-scratch/ch04/04_gqa/"}, {"name": "Dive into Deep Learning — Attention Scoring Functions", "url": "https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html"}], "title_es": "Mecánica de la attention: queries, keys, values, y la matriz que te cabe en la cabeza", "text_es": "La vez pasada en este track trazamos un request de punta a punta y te hice una promesa. Te dije que dentro de cada transformer block pasan exactamente dos cosas: attention, donde los tokens se hablan entre sí, y una red feed-forward, donde cada token piensa en privado. Y te dije que attention es donde ocurre el contexto, pero manoteé el mecanismo y te dije que íbamos a volver. Esto es nosotros volviendo. Para el final de este episodio vas a poder computar un paso de attention con números lo bastante chicos como para tenerlos en la cabeza, vas a saber exactamente por qué el contexto largo es cuadrático antes incluso de llegar al problema de memoria, y vas a entender qué está comprando realmente la grouped-query attention cuando la lees en un model card.\n\nEmpecemos por el problema que attention existe para resolver, porque el mecanismo solo tiene sentido una vez que sientes la necesidad de él.\n\nRecuerda de la vez pasada: después del lookup de embeddings, cada token es un vector, un punto en un espacio de muchas dimensiones, y ese punto de partida codifica el significado de diccionario del token, sin contexto. La palabra \"bank\" arranca en el mismo lugar ya sea que la oración hable de ríos o de dinero. Todo el trabajo de las capas es mover el vector de cada token hacia donde le corresponde dadas las palabras a su alrededor. Pero acá está el detalle que hace esto difícil. La red feed-forward procesa cada token de forma completamente independiente. Nunca mira a la izquierda ni a la derecha. Así que si las capas van a usar contexto, tiene que haber un lugar específico donde un token tenga permitido estirarse hacia los otros tokens y traerse lo que necesita. Ese lugar, el único lugar en toda la arquitectura donde la información se mueve entre posiciones, es attention. Todo lo demás en el transformer trata a tus tokens como una bolsa de vectores independientes. Attention es el único canal a través del cual se vuelven una secuencia.\n\nEntonces, ¿qué significa realmente, mecánicamente, \"estirarse y traerse información\"?\n\nAcá está la metáfora que mapea limpio sobre la matemática, y después hacemos la matemática. Piensa en una biblioteca, o honestamente, piensa en una búsqueda. Cada token puede hacer tres cosas. Puede hacer una pregunta — esa es su query. Puede publicitar de qué se trata — esa es su key. Y puede ofrecer contenido si lo eligen — ese es su value. Query, key, value. La palabra \"bank\", ahí sentada ambigua, emite una query que en efecto dice \"soy un sustantivo que necesita un tema — ¿hay alguien acá sobre geografía o sobre finanzas?\". Mientras tanto la palabra \"river\", unas posiciones atrás, publicita una key que dice \"soy sobre agua y paisaje\". Cuando la query de bank se alinea bien con la key de river, bank se trae el value de river, y el value es la información concreta que desplaza a bank hacia la región del espacio de la orilla del río. Ese es un paso de attention. Cada token hace esto simultáneamente, cada uno haciendo su propia pregunta y obteniendo su propia mezcla a medida de los values de todos los demás.\n\nAhora, ¿de dónde salen la query, la key y el value? Esta es la parte que la gente se saltea, y es el meollo. Los tres se derivan del mismo vector de entrada, multiplicándolo por tres matrices de pesos aprendidas y separadas. Llamémoslas W-query, W-key y W-value. El vector de cada token entra; salen tres vectores nuevos, su query, su key y su value. Estas tres matrices son los parámetros reales — son lo que el modelo aprendió durante el entrenamiento. Al modelo nunca le dijeron cómo debía verse una query. Descubrió, a lo largo de billones de tokens, que proyectar la entrada de una forma para hacer una query y de otra forma para hacer una key, de modo que los tokens relevantes produzcan queries y keys que apunten en direcciones parecidas, es una buena forma de reducir el error de predicción. La metáfora de la biblioteca es algo que imponemos después para darle sentido. El modelo simplemente encontró tres matrices que funcionan.\n\nUna sutileza acá hace tropezar a casi todos, así que matémosla ahora: ¿por qué la key y el value son separados? ¿Por qué no usar un solo vector tanto para ser comparado como para ser entregado? Porque publicitar y entregar son trabajos distintos. La key es cómo un token se promociona para ser recuperado — las dimensiones que lo hacen encontrable. El value es lo que efectivamente aporta una vez encontrado. Un token podría publicitar \"soy sobre finanzas\" con su key, en la forma compacta que haga eficiente el matching, pero el value que entrega podría ser un paquete de información mucho más rico que el token receptor incorpora dentro de sí. Separar los dos deja que el modelo optimice la encontrabilidad y la contribución de forma independiente, y — esto importa en un segundo — es la key y el value, no la query, lo que se cachea durante la generación, porque eso es lo que los tokens pasados le ofrecen a los futuros. La query es descartable; la computas, la usas una vez, la tiras.\n\nPongámosle números, porque te prometí números.\n\nImagina un modelo de juguete donde cada vector de token tiene apenas cuatro dimensiones, y tenemos una secuencia de tres palabras: \"the\", \"cat\", \"sat\". Así que tenemos tres vectores de entrada, cada uno con cuatro números. Multiplicamos cada uno por W-query para obtener tres vectores query, por W-key para obtener tres vectores key, por W-value para obtener tres vectores value. Para que siga entrando en la cabeza, digamos que los vectores query y key también tienen cuatro dimensiones. Ahora la operación central. Para que la palabra \"sat\" descubra a qué prestarle attention, tomamos su vector query y computamos su dot product con cada vector key de la secuencia — la key de \"the\", la key de \"cat\", y su propia key. Un dot product es simplemente multiplica-los-números-que-se-corresponden-y-súmalos; es un solo número que mide qué tan alineados están dos vectores. Así que \"sat\" obtiene tres números, un score por token, midiendo cuánto matchea su pregunta con la publicidad de cada token. Score alto, match fuerte. Eso es todo. Ese es el corazón de attention: una query dotteada contra cada key, produciendo un score de relevancia por posición.\n\nHazlo dolorosamente concreto por un momento. Supón que la query de \"sat\", dotteada contra las tres keys, da dos coma uno para \"cat\", cero coma cuatro para \"the\", y uno coma seis para su propia key. Tres números simples. \"Cat\" sacó el más alto, que es lo que esperarías — lo que está sentado es el gato. No está pasando nada misterioso; es literalmente multiplicar-y-sumar produciendo un número más grande cuando dos vectores apuntan en la misma dirección. Toda la inteligencia de la operación vive en las matrices de pesos que produjeron esas queries y keys en primer lugar. El dot product en sí es aritmética de primaria. Aférrate a eso, porque desmitifica todo el asunto: attention es una búsqueda de similitud aprendida, implementada con la operación más barata del edificio.\n\nAhora tres cosas chicas pero que cargan el peso les pasan a esos scores antes de ser usados.\n\nPrimera, el scaling. Esos scores crudos de dot product tienen un problema estadístico. Cuantas más dimensiones tengan tus vectores query y key, más grandes tienden a salir los dot products, puramente como cuestión de aritmética — estás sumando más términos, así que el total se dispersa más lejos de cero. Concretamente, si los números que entran tienen varianza de uno, el dot product de dos vectores de, digamos, ciento veintiocho dimensiones sale con una varianza de ciento veintiocho. ¿Por qué importa? Porque el siguiente paso es un softmax, y el softmax es exquisitamente sensible a la escala de sus entradas. Aliméntalo con números muy separados y se satura: le entrega esencialmente todo el peso al único score más grande y aplasta a todo lo demás a casi cero. Un softmax saturado casi no tiene gradiente, así que el modelo no puede aprender. La solución es vergonzosamente limpia: divide cada score por la raíz cuadrada de la dimensión de la key. Si la varianza era ciento veintiocho, dividir por la raíz cuadrada de ciento veintiocho la trae de vuelta a uno, justo donde el softmax se porta bien. Por eso se llama scaled dot-product attention, y esa pequeña división por una raíz cuadrada, que parece una nota al pie, es la diferencia entre un modelo que entrena y uno que no.\n\nSegunda, el softmax. Tomamos esos tres scores escalados y los empujamos por el softmax, que convierte cualquier conjunto de números en un conjunto de pesos positivos que suman uno. Ahora \"sat\" tiene, digamos, setenta por ciento de su attention en \"cat\", veinte por ciento en \"the\", diez por ciento en sí mismo — una distribución de probabilidad limpia sobre dónde mirar. Esos son los attention weights.\n\nTercera, el premio. Tomamos esos weights y computamos un promedio ponderado de los vectores value. Setenta por ciento del value de \"cat\", veinte por ciento del value de \"the\", diez por ciento del value de \"sat\", sumados en un solo vector nuevo. Ese vector mezclado es lo que attention devuelve para el token \"sat\". Literalmente mezcló información de los tokens que decidió que eran relevantes, en las proporciones que decidió. Haz eso para cada token en paralelo y completaste una operación de attention. Query dotteada con keys, escalada, pasada por softmax a weights, weights aplicados a values. Cuatro pasos. Ten esa forma en la cabeza, porque todo lo demás es una variación de ella.\n\nAhora, tres refinamientos convierten ese juguete en la cosa que corre en producción, y cada uno tiene una consecuencia de ingeniería directa.\n\nRefinamiento uno: causal masking. En un modelo que genera texto, un token nunca puede tener permitido prestarle attention a tokens que vienen después de él — cuando estás prediciendo la palabra cinco, la palabra seis no existe todavía, y si el modelo pudiera espiarla durante el entrenamiento, aprendería a hacer trampa y después se caería a pedazos en inferencia cuando no hay nada que espiar. Así que se lo prohibimos. Mecánicamente, esto es deliciosamente brusco: después de computar la matriz de scores, antes del softmax, tomamos cada score que corresponde a una posición futura y lo ponemos en menos infinito. Cuando menos infinito pasa por el softmax, se vuelve exactamente peso cero. El token literalmente no puede ver el futuro porque anulamos su capacidad de hacerlo. Esto se llama causal masking, y acá está por qué debería importarte como ingeniero. La máscara es lo que permite que el entrenamiento sea paralelo. Como cada posición solo puede ver el pasado, el modelo puede procesar una secuencia de entrenamiento entera — predecir cada próximo token en cada posición — en un solo forward pass, con la máscara garantizando que cada predicción solo usó contexto anterior legítimo. Sin la máscara tendrías que entrenar una posición a la vez. La máscara triangular es la razón callada de que puedas entrenar un transformer sobre un billón de tokens siquiera.\n\nRefinamiento dos, y este es el grande: múltiples heads. Todo lo que describí hasta acá es un solo attention head — un conjunto de matrices query, key y value, computando un tipo de relevancia. Pero un head solo puede aprender una noción de \"relevante\". Quizá aprende a rastrear sintaxis, matcheando verbos con sus sujetos. Pero también quieres un head rastreando el tema de largo alcance, y uno rastreando qué pronombre se refiere a qué sustantivo, y uno rastreando patrones posicionales. Así que los modelos reales corren muchos attention heads en paralelo — un modelo grande podría tener sesenta y cuatro por capa. Cada head tiene sus propias matrices query, key y value más chicas y opera en su propia rebanada del espacio de vectores, computando sus propios scores, su propio softmax, su propia mezcla ponderada de values, completamente independiente de los demás. Es genuinamente paralelo — los heads no se hablan durante la operación. Después de que todos los heads terminan, sus vectores de salida se concatenan de nuevo y se pasan por una matriz de salida final que los mezcla en un solo resultado. Esto es multi-head attention, y el modelo mental es: sesenta y cuatro lentes independientes, cada uno buscando un tipo distinto de relación, todos leyendo la misma secuencia a la vez, y después sus hallazgos se fusionan. La consecuencia de ingeniería es que el costo en parámetros y cómputo de attention escala con la cantidad de heads, y — como veremos en un segundo — el costo de memoria del serving también, que es exactamente la presión que produjo las variantes modernas.\n\nRefinamiento tres: el costo, y acá es donde este episodio se conecta con todo el resto de tu vida en inferencia. Mira de nuevo la operación central. Cada token computa un score contra cada otro token. Si tienes mil tokens, eso es mil por mil — un millón de scores. Diez mil tokens, cien millones de scores. La matriz de scores es cuadrada en el largo de la secuencia. Esto es lo que la gente quiere decir cuando dice que attention es cuadrática. Duplica tu contexto, cuadruplica el cómputo de attention. Este único hecho es la razón profunda de que el contexto largo sea caro, y fíjate que es un costo distinto del que discutimos el episodio pasado. La vez pasada, el KV cache era un problema de memoria que crece linealmente con el largo de la secuencia. Este — la matriz de scores — es un problema de cómputo que crece cuadráticamente. El contexto largo te pega dos veces, en dos monedas distintas, y saber cuál es cuál es la diferencia entre adivinar y diagnosticar cuando estás mirando un gráfico de latencia.\n\nVoy a señalar una cosa acá y dejarla para un episodio posterior, porque vale la pena saber que la salida de emergencia existe. Esa matriz de scores cuadrática suena como que tiene que construirse entera, todas las entradas, el millón o los cien millones, sentadas en memoria a la vez. Por años fue así, y esa matriz materializada era un segundo costo de memoria brutal encima del cómputo. El algoritmo llamado flash attention rompió esa suposición computando attention en tiles, streameando por la secuencia y sin almacenar nunca la matriz de scores completa, llevando totales corrientes en su lugar. No cambia el cómputo cuadrático — igual haces todos los multiplica-y-suma — pero elimina la explosión cuadrática de memoria de la matriz intermedia y, de yapa, corre mucho más rápido al quedarse en la parte rápida del chip. Vamos a desarmar ese cuando lleguemos al track de hardware. Por ahora, solo archívalo: el cómputo es inevitable, pero la explosión de memoria de la matriz de scores era un detalle de implementación, y alguien lo arregló.\n\nLo que nos trae a las variantes que efectivamente ves en los model cards, y ahora tienes exactamente la maquinaria para entenderlas.\n\nVolvamos al KV cache del episodio pasado. Recuerda, para evitar recomputar el pasado en cada token generado, cacheamos los vectores key y value de cada token que ya procesamos. Ahora cuenta el costo con precisión. En multi-head attention pura, cada uno de esos sesenta y cuatro heads tiene sus propias keys y sus propios values, así que estás cacheando sesenta y cuatro conjuntos separados de vectores key y value por cada token del contexto. Para contextos largos y batches grandes, ese cache se vuelve el mayor consumidor individual de memoria de GPU durante el serving — más grande, muchas veces, que los pesos del modelo mismo. Es el cuello de botella.\n\nAsí que acá está la jugada, y es hermosa en su tacañería. ¿Y si los heads compartieran? La intuición es que las queries son donde vive la mayor parte de la diversidad útil — quieres sesenta y cuatro preguntas distintas siendo hechas — pero las keys y los values se pueden compartir entre grupos de heads sin lastimar mucho la calidad. Esto es grouped-query attention. Mantienes los sesenta y cuatro query heads, así que el modelo sigue haciendo sesenta y cuatro preguntas distintas, pero tienes solo, digamos, ocho conjuntos de keys y values, cada uno compartido por un grupo de ocho query heads. El resultado: el KV cache se encoge por un factor de ocho, porque estás almacenando ocho conjuntos de keys y values por token en vez de sesenta y cuatro. Esa es exactamente la configuración que usa el modelo de setenta mil millones de parámetros de Llama tres — sesenta y cuatro query heads, ocho key-value heads, una reducción de ocho veces en el tamaño del cache — y ahora es el default en la mayoría de los modelos abiertos modernos. Llévalo al extremo, donde todos los query heads comparten un único conjunto de keys y values, y obtienes multi-query attention, máximo ahorro de memoria, un poco más de pérdida de calidad. Grouped-query es el punto dulce en el que la industria se asentó: casi la memoria de la versión agresiva, casi la calidad de la versión completa.\n\nSiente lo que acaba de pasar ahí. Grouped-query attention no es alguna idea nueva y profunda. Es una respuesta directa, casi mecánica, a que el KV cache sea el cuello de botella — el mismísimo cuello de botella que identificamos el episodio pasado. Una vez que sabes que las keys y los values son lo que cacheas, y que los heads son lo que multiplica el cache, compartir keys y values entre heads es la palanca obvia. Ese es todo el punto de este track: cuando entiendes el mecanismo, las decisiones de ingeniería dejan de ser conjuros mágicos de un model card y empiezan a ser jugadas obvias dadas las restricciones.\n\nDéjame aterrizar esto con las tres conclusiones que vale la pena guardar.\n\nUno. Attention es el único lugar donde los tokens interactúan, y su mecanismo son cuatro pasos que ahora puedes recitar: cada token se proyecta en una query, una key y un value; cada query se scorea contra cada key con un dot product; los scores se escalan y se pasan por softmax a weights; y esos weights mezclan los values en el nuevo vector del token. Todo lo demás en el transformer trata a los tokens de forma independiente. Si recuerdas una sola forma, recuerda query-key-value.\n\nDos. Attention te cuesta en dos monedas separadas, y no son la misma moneda. La matriz de scores es cuadrática en el largo de la secuencia — eso es cómputo, y es por qué duplicar el contexto cuadruplica el trabajo de attention. El KV cache es lineal en el largo de la secuencia pero multiplicado por la cantidad de key-value heads — eso es memoria, y es lo que grouped-query attention existe para encoger. Cuando el contexto largo esté lento, pregúntate cuál de los dos te está mordiendo.\n\nTres. Las variantes del model card — multi-head, grouped-query, multi-query — son todas la misma operación de cuatro pasos con un único dial: cuántas keys y values guardas versus cuántas queries haces. Más compartir, menos memoria, un poco menos de calidad. Ese único dial explica a toda la familia, y ahora la puedes leer con fluidez.\n\nLo próximo en este track vamos más a fondo en el KV cache mismo — cómo se acomoda en la memoria, por qué el manejo ingenuo desperdicia la mayor parte de tu GPU, y qué hizo la paged attention al respecto. Ahora entiendes las keys y los values lo bastante bien como para que el cache se sienta menos como almacenamiento y más como el muro de carga de todo el stack de serving. Nos vemos ahí."}, {"id": "ai/2026-07-17-news", "front": "ai", "date": "2026-07-17", "type": "news", "title": "An AI Agent Broke In, an AI Agent Fixed It, and the Open-Weight Race Passed Two Trillion Parameters", "words": 2136, "text": "Today's stories keep landing on the same uncomfortable question: when the thing running the attack and the thing running the defense are both AI agents, which side actually has the advantage.\n\nSix stories, ranked by technical significance.\n\nStory one. Hugging Face got broken into by an autonomous AI agent, and caught it largely with one of their own.\n\nHugging Face disclosed that part of their production infrastructure was compromised in an intrusion that was, end to end, driven by an autonomous artificial intelligence agent system rather than a human operator working a keyboard. The company said it found unauthorized access to a limited set of internal datasets and to several credentials used by their services, but found no evidence of tampering with the public, user-facing models, datasets, or Spaces that developers actually pull from, and their software supply chain checked out clean. What makes this one worth your attention isn't the breach itself, it's the response: Hugging Face ran large-model-driven analysis agents over more than seventeen thousand recorded attacker events to reconstruct the full timeline, extract indicators of compromise, and map exactly which credentials were touched, work that would ordinarily take a human incident-response team days, done in hours. The complication they hit along the way is the detail worth remembering: the attacking agent operated with no usage-policy constraints at all, free to reason about and act on anything it found, while Hugging Face's own defensive analysis kept running into safety guardrails built into the hosted models they reached for during the investigation.\n\nSharp takeaway: that asymmetry is the real lesson, not the intrusion itself. The policies that keep a general-purpose model well-behaved in ordinary use are precisely what slow you down when you need it to reason freely over raw attacker telemetry during an active incident. If your own incident response plan assumes you'll reach for whatever model API is fastest to hand, this is a concrete argument for having a capable model you can run on infrastructure you control, vetted for exactly this use case, ready before you need it rather than during.\n\nStory two. OpenAI built a model whose only job is attacking other OpenAI models, and it's already better at the job than people are.\n\nGPT-Red is an internal, never-publicly-deployed red-teaming model that OpenAI built specifically to discover and exploit prompt-injection vulnerabilities at scale, then feed those findings back into hardening production models. It was trained through reinforcement learning in self-play: an attacking model generates increasingly sophisticated injection attempts while a defending model learns to resist them, each side improving against the other over repeated rounds, the same competitive-training structure that produced superhuman game-playing systems, pointed here at prompt injection instead. On identical novel attack scenarios, GPT-Red achieved an eighty-four percent success rate against a target model, compared to just thirteen percent for human red-teamers given the same task. Applied to training, the result was G P T-5.6 Sol logging six times fewer direct injection failures than its predecessor, G P T-5.5, in OpenAI's own benchmark, and the company says it committed more than seven hundred thousand graphics-processing-unit hours to the automated red-teaming effort. GPT-Red itself stays internal-only, specifically so its offensive capability can't end up in the hands of someone who'd rather use it to attack than to test.\n\nSharp takeaway: read this next to story one and the pairing gets sharper. An autonomous agent broke into a major AI company's infrastructure with no policy constraints slowing it down, and here's a major AI lab openly building the same kind of unconstrained, self-improving attacker on purpose, in a sandbox, specifically because an unconstrained attacker is more effective than a constrained one. Attacker-side and defender-side automation are climbing the same curve at the same time. GPT-Red is what that curve looks like when a lab controls it deliberately; the Hugging Face incident is what it looks like when someone else points the equivalent capability at you.\n\nStory three. A security researcher got Claude to leak someone's name, employer, and inferred hometown, one character at a time, using nothing but an ordinary web page.\n\nThe researcher, Ayush Paul, published a proof of concept showing that claude dot a i, Anthropic's everyday assistant, could be induced to leak personal context it had stored in memory while the user believed they were asking an innocent question about coffee. The mechanism sat at the intersection of two features that are individually reasonable: Claude remembers context about you across a conversation, and its web-fetch tool is allowed to follow links embedded in pages it has already fetched, without asking permission at each step. Paul built a page that, once Claude read it, offered a sequence of generated follow-on links engineered so that navigating them leaked personal data to his own server one character at a time, each request in the chain encoding a single letter of the target's name, employer, and hometown into the destination it fetched next. Anthropic's fix restricts which links the model is allowed to follow autonomously, blocking links discovered on external pages while still allowing links the user typed themselves or that came back from a search result.\n\nSharp takeaway: this is the same shape of failure as the Grok Build story that opened yesterday's episode, and the Rogue Agent flaw two days before that, just wearing a different tool. Nobody explicitly designed a covert exfiltration channel into Claude's memory and browsing features; one fell out automatically once \"remembers things about you\" got combined with \"can autonomously decide what to fetch next.\" The fix Anthropic shipped is narrow and specific to this path. The general problem it's a patch for isn't: any agent that both retains context and can act on untrusted content it reads needs an explicit policy for what it's allowed to do with what it just learned, not only a filter on what it's allowed to say out loud.\n\nStory four. Alberta's government pointed fifty AI agents at four hundred sixty-six million lines of its own code and got through a security review that would otherwise have taken an estimated six and a half years, in twenty hours.\n\nA team inside Alberta's Ministry of Technology and Innovation used Claude Code, running both Opus and Sonnet models, to scan every repository the province owns, covering systems used across twenty-seven provincial ministries. The pipeline ran in two stages: a cheap, deterministic rules engine did a first pass over each repository flagging known vulnerability patterns, and only the flagged results went to the more expensive model for review, which then cited the exact file and line for every finding so a human developer could verify it without having to relocate the problem themselves. Roughly fifty agents worked autonomously and in parallel across that corpus. Beyond flagging issues, Claude Code generated fixes, wrote tests where none existed to validate them, and in some cases rebuilt outdated systems in more modern, maintainable languages, with every generated fix going through the ministry's own engineers for review before anything shipped.\n\nSharp takeaway: the interesting engineering choice here isn't the raw agent count, it's the two-stage funnel. Running an expensive, careful model over four hundred sixty-six million lines directly would have been slow and costly for very little marginal benefit on the ninety-some percent of code that's clean; doing cheap deterministic triage first and reserving the expensive reasoning for what survives the filter is the same pattern you'd reach for scaling any model-based pipeline against a huge, low-signal corpus, security review or otherwise, and it's worth stealing directly.\n\nStory five. Moonshot AI put out a two-point-eight-trillion-parameter open-weight model, and the part worth your attention isn't the size, it's the attention mechanism holding it together.\n\nKimi K3 is a mixture-of-experts model, activating sixteen of eight hundred ninety-six available experts per token, with a one-million-token context window and native support for text, image, and video input. Moonshot is promising full open weights by July twenty-seventh; for now it's available through their own hosted API. The architecture is built around what Moonshot calls Kimi Delta Attention, a linear-attention mechanism that extends an existing technique called Gated DeltaNet with finer-grained gating over the model's recurrent memory. Where ordinary softmax attention keeps a key-value cache that grows linearly with how much context you feed it, eating memory alive at long sequence lengths, linear attention instead maintains a fixed-size state that doesn't grow with context length at all. Kimi K3 interleaves Kimi Delta Attention layers with regular full-attention layers in a three-to-one ratio, trading a small amount of exact long-range recall for a structural cut in memory pressure, and Moonshot reports up to six point three times faster decoding at million-token context lengths alongside roughly a seventy-five percent reduction in memory and cache use during long generations. On Moonshot's own self-reported benchmarks, K3 beats Opus 4.8 max and G P T-5.5 high, while trailing Fable 5 and G P T-5.6 Sol.\n\nSharp takeaway: this is a direct engineering answer to a problem worth sitting with, that a standard transformer's key-value cache is fundamentally a memory problem that gets worse the longer your context gets, and every extra token of history costs you real memory whether or not the model ends up using it. Kimi Delta Attention's answer is to make most layers carry a fixed-size recurrent summary instead of an ever-growing cache, and only pay the full, exact cost on every fourth layer. Treat the self-reported benchmark placement with real skepticism until independent evaluators run it themselves; treat the architecture as the actual news.\n\nStory six. A twenty-seven-billion-parameter model now fits in three point nine gigabytes and runs on an iPhone at eleven tokens a second, while keeping about ninety percent of its full-precision performance across a battery of benchmarks.\n\nPrismML released Bonsai 27B, built on a Qwen3.6 27B base, in two compressed forms: a five point nine gigabyte ternary version aimed at laptops, and a three point nine gigabyte one-bit binary version small enough to run comfortably within an iPhone 17 Pro's memory budget. Both keep a two-hundred-sixty-two-thousand-token context window and accept images as well as text. The technique making that compression ratio possible is group-wise scaling: PrismML keeps the scaling factor for each group of weights at full precision, while the weight values themselves collapse down to just a few discrete levels, binary or ternary depending on the variant. Splitting \"how large is this number\" from \"which of a small number of values is it\" is what lets the bulk of the model shrink this aggressively without the performance collapsing along with it. The whole release is under an Apache two point oh license.\n\nSharp takeaway: this is group-wise quantization schemes like A W Q and G P T Q taken to their logical extreme, keeping precision exactly where it earns its cost, the per-group scale, and cutting it everywhere else. A twenty-seven-billion-parameter model that keeps ninety percent of its accuracy at four bits per weight, effectively, is a good concrete number to hold onto for when this curriculum gets to quantization directly: it tells you roughly where the accuracy cliff for aggressive quantization actually sits on a model this size, rather than leaving it as an abstract tradeoff.\n\nNow, what to watch. Watch whether other labs running memory plus autonomous browsing, not just Anthropic, disclose whether they have a Memory Heist-shaped hole of their own, now that the exfiltration pattern researchers should be checking for is public. Watch for Hugging Face's promised fuller postmortem, specifically the initial entry point the attacking agent used, since the interesting engineering lesson from an incident like this is almost always in how the door got opened, not in what got taken once it was. Watch whether self-play adversarial training becomes something other labs publish papers about rather than something they deploy quietly and mention in passing, because GPT-Red's methodology matters more to your own work than any one benchmark number it produced. And watch for Kimi K3's actual open-weight release on July twenty-seventh, since a self-reported benchmark table is exactly the kind of claim this show doesn't take at face value until someone outside the lab that built the model runs the evaluation themselves.\n\nToday's clearest deep-dive candidate is Kimi Delta Attention, not because linear attention itself is new, but because this curriculum has already spent real time on why the key-value cache makes long context an expensive memory problem, and Kimi Delta Attention is a live, shipping answer to exactly that problem rather than a research paper's proposal. Understanding precisely how the gating mechanism decides what the fixed-size recurrent state keeps and discards, and why interleaving one full-attention layer in every four is enough to preserve long-range recall, is the kind of detail that would actually change how you'd evaluate a linear-attention model for your own serving stack instead of just reading the parameter count. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Hugging Face blog (Security incident disclosure — July 2026)", "url": "https://huggingface.co/blog/security-incident-july-2026"}, {"name": "Help Net Security (GPT-Red beat human red teamers on a prompt injection test)", "url": "https://www.helpnetsecurity.com/2026/07/16/openai-gpt-red-prompt-injection-test/"}, {"name": "The Hacker News (OpenAI's GPT-Red Automates Prompt Injection Testing to Harden GPT-5.6 Sol)", "url": "https://thehackernews.com/2026/07/openais-gpt-red-automates-prompt.html"}, {"name": "Simon Willison's Weblog (How I tricked Claude into leaking your deepest, darkest secrets)", "url": "https://simonwillison.net/2026/Jul/15/claude-web-fetch-exfiltration/"}, {"name": "Winbuzzer (Researcher says Claude memory attack leaked personal data)", "url": "https://winbuzzer.com/2026/07/16/researcher-says-claude-memory-attack-leaked-personal-data-xcxwbn/"}, {"name": "Anthropic (Government of Alberta uses Claude to find and fix cybersecurity vulnerabilities)", "url": "https://www.anthropic.com/news/alberta-government-claude-cybersecurity"}, {"name": "Digital Journal (What Alberta found when it pointed 50 agents at its own code)", "url": "https://www.digitaljournal.com/article/what-alberta-found-when-it-pointed-50-agents-at-its-own-code/"}, {"name": "MarkTechPost (Moonshot AI Releases Kimi K3: A 2.8 Trillion Parameter Open MoE Model With Kimi Delta Attention)", "url": "https://www.marktechpost.com/2026/07/16/moonshot-ai-releases-kimi-k3-a-2-8-trillion-parameter-open-moe-model-with-kimi-delta-attention-and-1m-context/"}, {"name": "Simon Willison's Weblog (Kimi K3, and what we can still learn from the pelican benchmark)", "url": "https://simonwillison.net/2026/Jul/16/kimi-k3/"}, {"name": "VentureBeat (China's Moonshot AI releases Kimi K3, the largest open-source model ever)", "url": "https://venturebeat.com/technology/chinas-moonshot-ai-releases-kimi-k3-the-largest-open-source-model-ever-rivaling-top-u-s-systems"}, {"name": "MarkTechPost (PrismML Releases Bonsai 27B: 1-bit and Ternary Builds of Qwen3.6-27B)", "url": "https://www.marktechpost.com/2026/07/14/prismml-releases-bonsai-27b-1-bit-and-ternary-builds-of-qwen3-6-27b-that-run-on-laptops-and-phones/"}, {"name": "AlphaSignal (PrismML Shrinks Bonsai 27B to 3.9 GB so It Runs on an iPhone)", "url": "https://alphasignal.ai/news/prismml-shrinks-bonsai-27b-to-3-9-gb-so-it-runs-on-an-iphone"}], "title_es": "Un agente de IA entró por la fuerza, un agente de IA lo arregló, y la carrera de pesos abiertos superó los dos billones de parámetros", "text_es": "Las noticias de hoy vuelven una y otra vez a la misma pregunta incómoda: cuando tanto el ataque como la defensa corren sobre agentes de inteligencia artificial, quién tiene realmente la ventaja.\n\nSeis historias, ordenadas por relevancia técnica.\n\nHistoria uno. A Hugging Face le entraron con un agente autónomo de inteligencia artificial, y lo detectaron en gran parte con uno propio.\n\nHugging Face reveló que parte de su infraestructura de producción fue comprometida en una intrusión que, de punta a punta, fue ejecutada por un sistema de agente autónomo de inteligencia artificial y no por una persona operando un teclado. La empresa dijo haber encontrado acceso no autorizado a un conjunto limitado de datasets internos y a varias credenciales usadas por sus servicios, pero no halló evidencia de manipulación en los modelos, datasets o Spaces públicos que los desarrolladores realmente usan, y su cadena de suministro de software quedó verificada como limpia. Lo que hace valiosa esta historia no es la brecha en sí, es la respuesta: Hugging Face corrió agentes de análisis basados en modelos grandes sobre más de diecisiete mil eventos registrados del atacante para reconstruir la línea de tiempo completa, extraer indicadores de compromiso, y mapear exactamente qué credenciales fueron tocadas, un trabajo que normalmente le tomaría días a un equipo humano de respuesta a incidentes, resuelto en horas. La complicación con la que se toparon en el camino es el detalle que vale la pena recordar: el agente atacante operaba sin ninguna restricción de política de uso, libre de razonar y actuar sobre lo que encontrara, mientras que el propio análisis defensivo de Hugging Face chocaba una y otra vez con las barreras de seguridad incorporadas en los modelos alojados a los que recurrieron durante la investigación.\n\nConclusión clave: esa asimetría es la lección real, no la intrusión en sí. Las políticas que mantienen bien comportado a un modelo de propósito general en uso normal son precisamente lo que te frena cuando necesitás que razone libremente sobre telemetría cruda de un atacante durante un incidente activo. Si tu propio plan de respuesta a incidentes asume que vas a recurrir a la primera API de modelo que tengas a mano, esto es un argumento concreto para tener un modelo capaz corriendo en infraestructura que vos controlás, evaluado específicamente para este caso de uso, listo antes de necesitarlo y no durante.\n\nHistoria dos. OpenAI construyó un modelo cuyo único trabajo es atacar a otros modelos de OpenAI, y ya es mejor en ese trabajo que las personas.\n\nGPT-Red es un modelo interno de red teaming, nunca desplegado públicamente, que OpenAI construyó específicamente para descubrir y explotar vulnerabilidades de prompt injection a escala, y después retroalimentar esos hallazgos para endurecer los modelos de producción. Se entrenó con reinforcement learning en self-play: un modelo atacante genera intentos de inyección cada vez más sofisticados mientras un modelo defensor aprende a resistirlos, cada lado mejorando contra el otro en rondas repetidas, la misma estructura de entrenamiento competitivo que produjo sistemas de juego sobrehumanos, aplicada acá a prompt injection. En escenarios de ataque idénticos y novedosos, GPT-Red logró una tasa de éxito del ochenta y cuatro por ciento contra un modelo objetivo, comparado con apenas trece por ciento para red teamers humanos con la misma tarea. Aplicado al entrenamiento, el resultado fue que GPT-5.6 Sol registró seis veces menos fallas de inyección directa que su predecesor, GPT-5.5, en el benchmark propio de OpenAI, y la empresa dice haber destinado más de setecientas mil horas de GPU al esfuerzo de red teaming automatizado. GPT-Red en sí se mantiene de uso exclusivamente interno, específicamente para que su capacidad ofensiva no termine en manos de alguien que prefiera usarla para atacar en vez de para testear.\n\nConclusión clave: leé esto junto con la historia uno y el paralelo se vuelve más filoso. Un agente autónomo entró a la infraestructura de una gran empresa de inteligencia artificial sin ninguna restricción de política frenándolo, y acá tenés a un laboratorio grande construyendo abiertamente el mismo tipo de atacante autoconstruido y sin restricciones, a propósito, en un sandbox, precisamente porque un atacante sin restricciones es más efectivo que uno restringido. La automatización del lado del ataque y del lado de la defensa están subiendo la misma curva al mismo tiempo. GPT-Red es cómo se ve esa curva cuando un laboratorio la controla deliberadamente; el incidente de Hugging Face es cómo se ve cuando otro apunta la misma capacidad hacia vos.\n\nHistoria tres. Un investigador de seguridad logró que Claude filtrara el nombre, el empleador y la ciudad natal inferida de una persona, carácter por carácter, usando nada más que una página web común.\n\nEl investigador, Ayush Paul, publicó una prueba de concepto mostrando que claude punto a i, el asistente cotidiano de Anthropic, podía ser inducido a filtrar contexto personal que tenía guardado en memor
