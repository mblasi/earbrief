a.cpp, MLX, and SGLang formats.\n\nSharp takeaway: the agentic reinforcement learning inside real harnesses is the piece most worth watching. Rather than training on static agentic demonstration data and hoping the model generalizes to real scaffolding environments, Liquid AI is closing the distribution gap by literally running tasks inside the deployment environment during training. Whether that advantage holds for scaffolds the model was not trained inside — the out-of-distribution case — is the key empirical question to evaluate before committing to it in production.\n\nStory six. Cactus Compute released Needle 2 this week: a fourteen-megabyte, forty-five-million-parameter model for device-level tool calling on hardware that costs under two-hundred dollars, targeting IoT devices, wearables, and budget smartphones where GPU and neural processing unit acceleration are not available. The architecture makes two unusual structural choices. First, the Hadamard MLP replaces standard learned up-and-down projection matrices with a fixed Walsh-Hadamard transform plus learned diagonal scaling, which handles channel mixing at near-zero parameter cost. Second, an engram system moves world knowledge into hashed n-gram lookup tables read by gather operations, contributing capacity that costs no multiply-accumulate operations at decode time. A two-hundred-fifty-six-token sliding window bounds KV cache memory regardless of session length, with tool declarations pinned as permanent sinks that the sliding window structurally cannot evict.\n\nQuantization is trained end-to-end: the model was trained against two-bit Cactus Quants from pretraining through post-training, so the deployed two-bit model is the model that was trained, not a post-hoc compressed approximation. On Mobile-Actions and Seal-Tools benchmarks, Needle 2 matches or exceeds FunctionGemma 270M — a model six times larger trained specifically for function calling — at seventy million floating-point operations per token versus five-hundred-forty million for FunctionGemma.\n\nSharp takeaway: the grammar-constrained decoding deserves attention as a pure inference optimization beyond its correctness guarantee. By compiling token constraints from declared schemas before generation begins, the engine can skip logit computation for up to ninety-eight percent of the vocabulary on structural tokens — a pattern directly applicable to any structured-output scenario, regardless of model size, wherever you can express the output schema as a grammar before the generation step.\n\nWhat to watch. One story warrants flagging for deeper study: Claude's multi-agent Riemann result is a strong deep-dive candidate — not because the math matters to daily engineering work, but because the orchestration pattern does. Sixty subagents cross-validating each other's proofs, with independent re-derivation as verification and a formal proof as the publication artifact, is a template for any AI-assisted research or analysis task where you can define a verification oracle. That pattern is going into the curriculum.\n\nWatch whether Meta's open-weight return with Muse Glimmer shifts local agent deployment the way Llama Two shifted local chat — the Apache two-point-zero license removes the adoption friction that slowed things last time. Watch whether Anthropic's watermark detection tooling lands before it is needed as a provenance signal in production pipelines, because the gap between announcing watermarks and enabling detection is where compliance risk lives. Watch whether Liquid AI's harness-trained agentic reinforcement learning generalizes better than the headline benchmarks suggest, or whether the out-of-distribution performance gap looks like every other fine-tuning approach when tested on unseen scaffolds. And watch for more frontier labs pairing AI-assisted research results with formal proofs, because that verification discipline is the thing that turns an interesting capability claim into a reliable signal.", "sources": [{"name": "Meta AI Research", "url": "https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model"}, {"name": "Hugging Face (Muse Glimmer 30B)", "url": "https://huggingface.co/meta-models/Muse-Glimmer-30B"}, {"name": "Anthropic (Claude and the Riemann Hypothesis)", "url": "https://www.anthropic.com/research/riemann-zeta"}, {"name": "Anthropic (How Claude marks AI-generated content)", "url": "https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content"}, {"name": "antirez/h3.c", "url": "https://github.com/antirez/h3.c"}, {"name": "Hacker News (H3-metal thread)", "url": "https://news.ycombinator.com/item?id=49252179"}, {"name": "Liquid AI / Hugging Face (LFM2.5-2.6B)", "url": "https://huggingface.co/LiquidAI/LFM2.5-2.6B"}, {"name": "Cactus Compute (Needle 2)", "url": "https://cactuscompute.com/needle"}, {"name": "Hacker News (Needle 2 thread)", "url": "https://news.ycombinator.com/item?id=49246804"}, {"name": "Simon Willison's Weblog (Muse Glimmer)", "url": "https://simonwillison.net/2026/Aug/10/introducing-muse-glimmer/"}], "title_es": "Meta Abre un Agente Local de Treinta Mil Millones de Parámetros a Todo el Mundo, Claude Supera el Sesenta y Siete Por Ciento en la Hipótesis de Riemann, y Anthropic Empieza a Marcar con Watermark Cada Token que Genera", "text_es": "Hoy Meta volvió a la arena de los open weights con un modelo de treinta mil millones de parámetros diseñado desde el principio para loops de agentes locales, Anthropic reveló que una versión de investigación de Claude empujó un lower bound matemático de sesenta y siete años más allá de su récord anterior mientras fallaba en probar la hipótesis de Riemann, y Anthropic se comprometió a estampar un watermark invisible en cada línea de texto que cualquiera de sus nuevos modelos produzca, a partir de este mes.\n\nSeis historias, rankeadas por significancia técnica.\n\nHistoria uno. Los Superintelligence Labs de Meta shipped Muse Glimmer ayer bajo una licencia Apache dos-punto-cero, y el release es notable por lo que optimiza más que por su raw parameter count. El modelo es de treinta mil millones de parámetros — lo suficientemente chico como para correr en una Mac o una sola consumer GPU — y fue diseñado específicamente para agentic workflows siempre activos en lugar de chat general. La training recipe lo refleja: la base fue destilada de Muse Spark, el teacher model más grande de Meta, usando logit distillation en un data mix similar, luego pasó por una mid-training phase en datos más pesados en agentes y de contexto más largo con reasoning traces explícitos, y finalmente fue fine-tuneada con una combinación de supervised learning, on-policy distillation y reinforcement learning a través de dominios de coding, agentes y reasoning. Los evaluation targets matchean el use case: tau-Bench, MCP-Atlas, DeepSearch QA y SWE-Bench — benchmarks que miden si un modelo puede realmente completar tareas multi-step dentro de scaffolds, no solo puntuar bien en problemas de multiple choice estáticos.\n\nDos decisiones de ingeniería hacen viable el deployment local. Primero, la quantization a aproximadamente cuatro bits de precisión achica el language model a menos de veinte gigabytes, dejando headroom para el key-value cache, un vision encoder dedicado para procesar screenshots y documentos, y un speculative decoding drafter — todo dentro de un envelope de memoria de veinticuatro a treinta y dos gigabytes. Segundo, el drafter en sí está basado en DFlash, una pequeña companion network que propone bloques enteros de tokens para que el modelo principal verifique en paralelo, produciendo un speedup de tres-punto-uno veces en una RTX cinco-cero-nueve-cero y aproximadamente uno-punto-ocho veces en un M5 Max. El modelo también soporta reasoning effort controlable, permitiendo tradear calidad por velocidad en tareas más simples.\n\nSharp takeaway: lo que realmente hay que evaluar acá es el perfil de benchmarks agenticos, no los de chat. Si tu use case involucra tool calling, completación de tareas multi-step o correr un modelo dentro de un framework de scaffolding, la pregunta es si Muse Glimmer en el nivel K-Quant de diecisiete gigabytes aguanta en tu distribución de tareas real — y Meta publicó suficiente detalle metodológico de benchmarks como para que puedas correr tu propia comparación contra Gemma cuatro treinta y un B o Qwen tres-punto-seis veintisiete B en lugar de confiar en los números del headline. La licencia Apache dos-punto-cero también es limpiamente diferente de las viejas licencias Llama: sin caps de uso atados a monthly active user counts, sin attribution clauses que varían según el producto, solo un grant de open source estándar.\n\nHistoria dos. Una versión de investigación no lanzada de Claude empujó un lower bound matemático de larga data sobre la hipótesis de Riemann de cuarenta y uno-punto-seis por ciento a sesenta y siete-punto-dos por ciento — un resultado que Anthropic publicó ayer junto con una proof formal en Lean que pasa la verificación estándar. El contexto: la hipótesis de Riemann, sin resolver desde mil ochocientos cincuenta y nueve, asevera que todos los ceros no triviales de la función zeta de Riemann yacen en una línea vertical específica. Nadie la ha probado ni refutado, pero los matemáticos han ido levantando progresivamente la fracción mínima de ceros provablemente en la línea; el récord anterior era cuarenta y uno-punto-seis por ciento y databa de trabajos de los años ochenta.\n\nEl lado de ingeniería de la historia es tan interesante como la matemática. El resultado vino de un único no matemático en Anthropic que le pidió a Claude que hiciera un intento serio de la hipótesis, aportando solo aliento cuando Claude se estancaba. Claude primero generó e intentó seiscientas cincuenta ideas, todas fallidas, luego fue instado a intentarlo de nuevo. A lo largo de aproximadamente un día y medio, coordinó aproximadamente sesenta subagentes, que entre ellos corrieron dos mil cuatrocientos comandos de shell, escribieron cientos de scripts en Python, descargaron cincuenta y cuatro papers de arXiv para verificar que el resultado no fuera ya conocido, y tuvieron subagentes que re-probaron el hallazgo de forma independiente desde cero. Dos subagentes desarrollaron las ideas matemáticas centrales; trece contribuyeron ideas de apoyo; treinta no produjeron output útil; trece sirvieron como validadores chequeando los argumentos de los otros; y dos escribieron el paper inicial. Claude también inició la formalización en Lean sin que se lo pidieran y recomendó que un teórico de números humano verificara el trabajo antes de publicarlo.\n\nLa técnica matemática involucró combinar resultados recientes de Baluyot, Goldston, Suriajaya y Turnage-Butterbaugh — una línea de trabajo que extendió los métodos de par-correlación de Montgomery para funcionar sin asumir la hipótesis — con un paper de Bombieri del año dos mil. El movimiento específico fue formar una forma cuadrática sobre el espacio de ceros de la función zeta, rastrear subespacios positivos- y negativos-definidos surgidos de ceros en y fuera de la línea respectivamente, y escribir una desigualdad sobre el rango de esa forma cuadrática usando información de primero y segundo momento calculada vía el lado de los números primos del problema.\n\nSharp takeaway: el patrón de orquestación — subagentes de ideación en paralelo, validadores cruzando argumentos de los demás, re-derivación independiente como paso de verificación, y una proof formal como artefacto de publicación — es directamente aplicable a cualquier tarea de investigación asistida por IA donde la verdad sea verificable. Esta es la demostración de más alta fidelidad hasta ahora de lo que un loop multi-agente bien estructurado puede producir cuando la tarea tiene un oracle de verificación claro.\n\nHistoria tres. Anthropic publicó sus compromisos bajo el Article cincuenta del AI Act de la Unión Europea sobre transparencia de contenido generado por IA, y las implicancias técnicas van más allá del compliance de la UE. Cualquier modelo de Claude lanzado a partir del dos de agosto — lo que incluye modelos disponibles ahora mismo — embederá un watermark invisible directamente en texto generado y adjuntará metadata de proveniencia firmada siguiendo el estándar abierto de la Coalition for Content Provenance and Authenticity, conocida como C2PA, a cualquier archivo generado como SVGs, PNGs y JPGs. El watermark viaja con texto copiado y persiste a través de ediciones moderadas. La detección por terceros será soportada, con documentación técnica por venir. Los modelos lanzados antes del dos de agosto están en un período de transición y están siendo actualizados.\n\nPara ingenieros construyendo con Claude, los detalles relevantes son estos: las marcas aplican a través de la API, Claude Code, Claude Cowork y el acceso vía AWS, Google Cloud y Microsoft Foundry. Si procesás archivos a través de Claude y los re-servís, esos archivos llevarán metadata C2PA firmada indicando que fueron procesados por Claude — lo que importa para cualquier sistema o plataforma downstream que checkee proveniencia de contenido. El watermark en texto está a nivel del modelo, no de la API, lo que significa que está siempre presente independientemente de qué superficie uses.\n\nSharp takeaway: una marca detectada prueba que Claude tocó el contenido, no que Claude lo authored — proofreading, traducción y summarización todo triggerean el watermark en el output incluso si el contenido subyacente es completamente de autoría humana. Y una marca ausente no significa que el contenido no sea generado por IA; el parafraseo intenso, pasajes muy cortos y la conversión de formato pueden todos stripearla. Si estás construyendo sistemas que usan la detección de watermark como señal de proveniencia, modelá la detección como un indicador positivo con ruido en lugar de ground truth, y diseñá tu cadena de proveniencia para incluir señales adicionales más allá de la marca en sí.\n\nHistoria cuatro. Salvatore Sanfilippo — quien creó Redis — shipped h3.c esta semana, un inference engine nativo en Metal para correr MiniMax H3 en Macs con Apple Silicon. Esto no es un wrapper sobre un framework existente: es una implementación desde cero de la arquitectura del diffusion transformer H3 en C apuntando directamente a la API Metal GPU de Apple, con kernels escritos a mano para el transformer, el encoder y decoder de audio, y el speculative decoding. El repo acumuló más de ciento veinte commits en aproximadamente una semana de desarrollo público, y los benchmarks actuales muestran speedups significativos sobre el path default de Metal Performance Shaders en hardware M4 Max y M5 Max.\n\nLas decisiones de ingeniería que vale la pena estudiar están en la quantization y el diseño de kernels. El engine usa quantization de ocho-bit integer para las attention output projections con scales de fila y columna cacheadas en threadgroup memory en lugar de re-leerse por fragmento cooperativo, kernels QKV RoPE fusionados con vectorización BF16 de cuatro anchos, y especializaciones de formas de matrices en tiempo de compilación para shapes que aparecen frecuentemente en los bloques de H3. Cada especialización es byte-idéntica al path general y fue medida para producir un speedup reproducible antes de ser incluida — el autor documenta cuándo cada optimización fue revertida y por qué, lo que es una transparencia de ingeniería inusualmente disciplinada.\n\nSharp takeaway: el valor para ingenieros de IA es menos sobre correr MiniMax H3 localmente y más que este repositorio es un ejemplo trabajado inusualmente claro de cómo perfilar y optimizar a mano un inference path en Metal para una arquitectura novel, con flags de comparación A/B explícitas para cada variante de kernel dejadas en el codebase. Si estás escribiendo kernels custom en Metal o CUDA, el historial de commits vale la pena leer como caso de estudio en disciplina de profiling iterativo con gates de medición explícitas.\n\nHistoria cinco. Liquid AI lanzó LFM2.5-2.6B esta semana, un modelo híbrido de dos-punto-seis mil millones de parámetros que clama performance competitiva con modelos cuatro veces más grandes en tareas agenticas. La arquitectura combina veintidós bloques de convolución corta doubly-gated con ocho capas de grouped-query attention — las convoluciones cortas manejan contexto local eficientemente, las capas de attention dispersa proveen retrieval de largo alcance — con un context window de ciento veintiocho mil tokens. El post-training siguió cuatro etapas: dos rondas de supervised fine-tuning, especialización de teacher por dominio, destilación multi-dominio on-policy, y reinforcement learning agentico corrido directamente dentro de harnesses de scaffolding populares, exponiendo el modelo a schemas de herramientas reales, system prompts y patrones de interacción multi-turno durante el training en lugar de solo en evaluación.\n\nLos números de inferencia valen la pena: doscientos veinte tokens por segundo en un Apple M5 Max y ciento trece tokens por segundo en una CPU AMD Ryzen, entrando en menos de dos-punto-cinco gigabytes de memoria. El modelo fue entrenado en treinta y cuatro trillones de tokens y está disponible en formatos para Transformers, vLLM, llama.cpp, MLX y SGLang.\n\nSharp takeaway: el reinforcement learning agentico dentro de harnesses reales es la pieza más importante a observar. En lugar de entrenar en datos de demostración agenticos estáticos y esperar que el modelo generalice a entornos de scaffolding reales, Liquid AI está cerrando la brecha de distribución al literalmente correr tareas dentro del entorno de deployment durante el training. Si esa ventaja se mantiene para scaffolds en los que el modelo no fue entrenado — el caso out-of-distribution — es la pregunta empírica clave a evaluar antes de comprometerse con él en producción.\n\nHistoria seis. Cactus Compute lanzó Needle 2 esta semana: un modelo de catorce megabytes y cuarenta y cinco millones de parámetros para tool calling a nivel de dispositivo en hardware que cuesta menos de doscientos dólares, apuntando a dispositivos IoT, wearables y smartphones de presupuesto donde la aceleración por GPU o unidad de procesamiento neural no está disponible. La arquitectura hace dos elecciones estructurales inusuales. Primero, el Hadamard MLP reemplaza las matrices de proyección up-and-down aprendidas estándar con una Walsh-Hadamard transform fija más scaling diagonal aprendida, que maneja el channel mixing a costo de parámetros casi cero. Segundo, un sistema de engram mueve el conocimiento del mundo a tablas de lookup de n-gramas hasheadas leídas por operaciones de gather, contribuyendo capacidad que no cuesta operaciones multiply-accumulate en decode time.\n\nLa quantization está entrenada end-to-end: el modelo fue entrenado contra Cactus Quants de dos bits desde el pretraining hasta el post-training, así que el modelo de dos bits desplegado es el modelo que fue entrenado, no una aproximación comprimida post-hoc. En benchmarks de Mobile-Actions y Seal-Tools, Needle 2 iguala o supera a FunctionGemma 270M — un modelo seis veces más grande entrenado específicamente para function calling — a setenta millones de operaciones de punto flotante por token versus quinientos cuarenta millones para FunctionGemma.\n\nSharp takeaway: el decoding constrained por gramática merece atención como optimización de inferencia pura más allá de su garantía de corrección. Al compilar las restricciones de tokens desde los schemas declarados antes de que empiece la generación, el engine puede saltear el cómputo de logits para hasta noventa y ocho por ciento del vocabulario en tokens estructurales — un patrón directamente aplicable a cualquier escenario de structured output, independientemente del tamaño del modelo, donde puedas expresar el output schema como una gramática antes del paso de generación.\n\nQué observar. Una historia merece ser señalada para estudio más profundo: el resultado multi-agente de Riemann de Claude es un fuerte candidato a deep-dive — no porque la matemática importe al trabajo de ingeniería diaria, sino porque el patrón de orquestación sí importa. Sesenta subagentes cruzando validaciones de las pruebas de los demás, con re-derivación independiente como verificación y una proof formal como artefacto de publicación, es un template para cualquier tarea de investigación o análisis asistido por IA donde puedas definir un oracle de verificación. Ese patrón entra al currículo.\n\nObservá si el retorno de Meta a los open weights con Muse Glimmer desplaza el deployment de agentes locales de la misma manera que Llama Dos desplazó el chat local — la licencia Apache dos-punto-cero remueve la fricción de adopción que ralentizó las cosas la última vez. Observá si las herramientas de detección de watermark de Anthropic llegan antes de que se necesiten como señal de proveniencia en pipelines de producción, porque la brecha entre anunciar watermarks y habilitar la detección es donde vive el riesgo de compliance. Observá si el reinforcement learning agentico en harnesses de Liquid AI generaliza mejor de lo que sugieren los benchmarks del headline, o si la brecha de performance out-of-distribution se ve como cualquier otro approach de fine-tuning cuando se testea en scaffolds no vistos. Y observá si más labs de frontera acompañan sus resultados de investigación asistida por IA con proofs formales, porque esa disciplina de verificación es la cosa que convierte un claim de capacidad interesante en una señal confiable."}, {"id": "ai/2026-08-11-article-2", "front": "ai", "date": "2026-08-11", "type": "article", "title": "Why Software Factories Fail - And How to Actually Use AI Coding Agents", "words": 2000, "text": "We are all racing to put AI coding into production, and the narrative that dominates the conversation is simple: write more loops, throw more agents at the problem, configure more linters and magic prompts, and soon your software will build itself without anyone reading a single line.\n\nBut something is breaking under this pressure.\n\nCompanies that have no business having production outages are having them — not because of infrastructure failure, but because coding agents vibed a little too hard and nobody was reading the code. Pull-request review quality is down. Incidents are up. Bugs per developer are up. The correlation is strong enough that even if it isn't a smoking gun yet, it feels directionally true to anyone who has actually shipped real code with these tools.\n\nThe people pushing the \"just token harder\" narrative are genuinely smart, and they have real respect for the technology. But the most cynical take is that this is yet another excuse to pump more venture capital into what amounts to a slop cannon — a system that produces volume at the expense of quality, with no feedback loop to correct the long-term decay.\n\n## This is not a skill issue\n\nThe pushback when you raise these concerns is always the same: it's your fault. If token-maxxing isn't working for you, you're holding it wrong. If the code quality is degrading, you just need better harness engineering. If the codebase is falling apart, you haven't prompted it correctly.\n\nBut here is what the author of this piece has learned after going deep on coding agents for a very long time: no amount of harness engineering or loop optimization can solve what is fundamentally a model-training issue.\n\nModels are good at some things — solving one-off problems, vibe-coding a marketing site, even writing brilliant refactors when you tell them exactly what to do. But they are not good at maintaining and improving codebase quality over time. That specific form of maintainability — where changing one part of the system stops breaking three other parts — is something models degrade rather than preserve.\n\n## There are no good benchmarks for codebase quality\n\nThe reason we can't prove this with data is that today's coding benchmarks don't measure maintainability at all. They measure whether a model can write a patch that passes a specific test, and nothing more. There is no penalty for bad design. No penalty for eroding codebase quality over time. No penalty for introducing patterns that will make future changes expensive and fragile.\n\nConsider a typical SWE-bench task: the model gets a bug report and a codebase, writes a patch, and then the benchmark slaps a hidden test on top. If the tests pass, we win. The model could have solved it with a single clean line, or it could have wrapped everything in try-catches, hardcoded values, and lazy type casts that undermine the entire benefit of having a type system. Both get the same reward.\n\n## The lights-off factory doesn't work\n\nThe lights-off software factory — where humans never read code, never review, never intervene — sounds elegant in theory. You invest all your effort into testing, sandboxes, automated review, monitoring, and rollout, and let the agents cook unattended.\n\nBut anyone who has tried this seriously knows how it ends. Sooner or later, you find an issue gnarly enough that no amount of prompting can solve. You have to dig into the codebase you stopped reading three months ago. Your site was down. Your users were pissed. And you spent two weeks in VS Code plumbing out all the patterns by hand because the agent spaghetti was too much to unwind.\n\nThe company that ran this experiment and shipped 75 percent of their code with agents? Their pull-request review quality dropped by 25 percent more comments, 22 percent longer comments, and 31 percent of PRs skipping review entirely. Their incidents went up 242 percent per PR and 57 percent overall. Their bugs per developer went up 54 percent.\n\n## What actually works: four phases of planning\n\nIf you want to use AI coding agents without setting your codebase on fire, you need to front-load alignment. The four phases that work are product review, system architecture, program design, and vertical slices.\n\nStart with a product review doc — a short, semi-structured document that pins down what you are building and why, ideally with rough HTML mockups instead of paragraphs. Then align on system architecture — how services, endpoints, schemas, and stores talk to each other, using visualizations like sequence diagrams to maximize human-agent communication bandwidth.\n\nThen do program design — and this is the criminally underemphasized one. Before anyone writes implementation, go one level down from architecture into the shape of code: the types, method signatures, program layout, and call stacks. Light visualizations in pseudocode — call-stack trees, file-tree diffs, type signatures — are decisions you would otherwise be making implicitly during the most expensive possible moment: code review.\n\nFinally, build in vertical slices or tracer bullets — working, testable increments that touch the full stack, not horizontal layers where you can't touch the solution until everything is done.\n\n## You probably feel like you have too many pull requests\n\nYou don't have too many PRs. You have too many bad PRs.\n\nA great PR is a joy to review. Clean code, clear decisions, nothing to figure out. A PR that needs even 20 percent rework is an intellectual and emotional burden on both the submitter and the reviewer. Most AI oneshot PRs trend closer to 50 percent rework, because the model vibed the architecture without the human steering that would have caught the problems early.\n\nThe fix is not to automate review into oblivion. The fix is to keep humans in the loop for the high-leverage phases where an agent misunderstanding your intent is expensive, and let the agents cook only on the slices where you can resteer early and cheaply.\n\n## Four closing pieces of advice\n\nIf you want to move 2 to 3 times faster without setting your codebase on fire, start here: learn the constraints well through hands-on work with models. Optimize your systems within the arena of those constraints. Seek leverage where the model's strengths align with your workflow. And read the dang code — when maintainability has no fast oracle for reinforcement learning, the human judgment loop stays irreplaceable.\n\nThe hype will tell you the lights-off factory is coming. The discipline says: for now, the judge is you.", "sources": [{"name": "Why Software Factories Fail — humanlayer/advanced-context-engineering-for-coding-agents.", "url": "https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/wsff.md"}], "title_es": "Por qué Fallan las Fábricas de Software — y cómo usar realmente agentes de código de IA", "text_es": "Todos corremos a poner la codificación con IA en producción, y la narrativa que domina la conversación es simple: escribí más loops, lanzá más agentes al problema, configurá más linters y prompts mágicos, y pronto tu software se construirá solo sin que nadie lea una sola línea.\n\nPero algo se rompe bajo esta presión.\n\nEmpresas que no deberían tener outages de producción los están teniendo — no por fallas de infraestructura, sino porque agentes de codificación vibearon un poco demasiado y nadie leía el código. La calidad de revisión de pull requests está cayendo. Los incidentes suben. Los bugs por desarrollador suben. La correlación es lo suficientemente fuerte que incluso si todavía no es una prueba definitiva, se siente direccionalmente cierta para cualquiera que haya enviado código real con estas herramientas.\n\nLa gente que impulsa la narrativa de \"token harder\" es genuinamente inteligente, y tiene mucho respeto por la tecnología. Pero la toma más cínica es que esto es otra excusa para bombear más capital de riesgo en lo que equivale a un cañón de slop — un sistema que produce volumen a costa de calidad, sin un loop de retroalimentación para corregir el decayimiento a largo plazo.\n\n## Esto no es un problema de habilidad\n\nLa reacción cuando planteás estas preocupaciones siempre es la misma: es tu culpa. Si el token-maxxing no te funciona, estás sosteniéndolo mal. Si la calidad del código se degrada, necesitás un mejor ingeniería de harness. Si la base de código se desarma, no lo has prompteado correctamente.\n\nPero lo que el autor de este texto ha aprendido al hundirse profundamente en agentes de codificación por mucho tiempo: ninguna cantidad de ingeniería de harness o optimización de loops puede resolver lo que es fundamentalmente un problema de entrenamiento del modelo.\n\nLos modelos son buenos para algunas cosas — resolver problemas aislados, vibe-codear un sitio de marketing, incluso escribir refactorizaciones brillantes cuando le decís exactamente qué hacer. Pero no son buenos manteniendo e improviando la calidad de la base de código a lo largo del tiempo. Esa forma específica de mantenibilidad — donde cambiar una parte del sistema deja de romper tres partes más — es algo que los modelos degradan en lugar de preservar.\n\n## No existen buenos benchmarks para la calidad de la base de código\n\nLa razón por la que no podemos demostrar esto con datos es que los benchmarks actuales de programación no miden la mantenibilidad en absoluto. Miden si un modelo puede escribir un parche que pase un test específico, y nada más. No hay penalidad por mal diseño. No hay penalidad por erosionar la calidad de la base de código. No hay penalidad por introducir patrones que harán futuros cambios caros y frágiles.\n\nConsiderá un típico task de SWE-bench: el modelo recibe un reporte de bug y una base de código, escribe un parche, y luego el benchmark le pone un test oculto encima. Si los tests pasan, ganamos. El modelo podría haber resuelto el problema con una sola línea limpia, o podría haber envuelto todo en try-catches, valores hardcodeados y casts de tipo perezosos que socavan todo el beneficio de tener un sistema de tipos. Ambos obtienen la misma recompensa.\n\n## La fábrica a ciegas no funciona\n\nLa fábrica de software a ciegas — donde los humanos nunca leen código, nunca revisan, nunca intervienen — suena elegante en teoría. Invertís todo el esfuerzo en testing, sandboxes, revisión automática, monitoreo, y despliegue, y dejás que los agentes cocinen sin supervisión.\n\nPero cualquiera que lo ha intentado seriamente sabe cómo termina. Más temprano o más tarde, encontrás un problema lo suficientemente complicado como para que ninguna cantidad de prompting lo resuelva. Tenés que meterte en la base de código que dejaste de leer hace tres meses. Tu sitio estaba caído. Tus usuarios estaban molestos. Y pasaste dos semanas en VS Code reconstructurando todos los patrones a mano porque la pasta de agentes era demasiado para desenredar.\n\nLa empresa que corrió este experimento y envió el 75 por ciento de su código con agentes? La calidad de revisión de pull requests cayó 25 por ciento más comentarios, 22 por ciento comentarios más largos, y 31 por ciento de PRs que saltearon la revisión por completo. Sus incidentes subieron 242 por ciento por PR y 57 por ciento en general. Sus bugs por desarrollador subieron 54 por ciento.\n\n## Lo que realmente funciona: cuatro fases de planificación\n\nSi querés usar agentes de codificación de IA sin incendiar vuestra base de código, tenés que frontalizar la alineación. Las cuatro fases que funcionan son: review de producto, arquitectura de sistema, diseño de programa, y vertical slices.\n\nEmpezá con un documento de product review — un texto breve y semiestructurado que define qué estás construyendo y por qué, idealmente con mockups HTML rough en vez de párrafos. Después alineate en arquitectura de sistema — cómo servicios, endpoints, esquemas y stores se comunican, usando visualizaciones como diagramas de secuencia para maximizar el ancho de banda de comunicación humano-agente.\n\nDespués haz diseño de programa — y esta es la crímenente subestimada. Antes de que nadie escriba implementación, bajá un nivel de la arquitectura a la forma del código: tipos, firmas de métodos, layout del programa, y call stacks. Visualizaciones ligeras en pseudocódigo — árboles de call-stack, diffs de file-tree, firmas de tipos — son decisiones que de otro modo estarías tomando implícitamente en el momento más costoso posible: la revisión de código.\n\nFinalmente, construí en vertical slices o tracer bullets — incrementos que tocan toda la pila y son testeables, no capas horizontales donde no podés tocar la solución hasta que todo esté hecho.\n\n## Probablemente sientas que tenés demasiados pull requests\n\nNo tenés demasiados PRs. Tenés demasiados malos PRs.\n\nUn gran PR es una alegría de revisar. Código limpio, decisiones claras, nada para descubrir. Un PR que necesita aunque sea 20 por ciento de rework es una carga intelectual y emocional para el que lo envía y para el que lo revisa. La mayoría de los PRs de oneshot de IA tienden a 50 por ciento de rework, porque el modelo vibearon la arquitectura sin el steering humano que habría atrapado los problemas temprano.\n\nLa solución no es automatizar la revisión hasta la locura. La solución es mantener a los humanos en el loop para las fases de alto leverage donde un malentendido del agente es costoso, y dejar que los agentes cocinen solo en los slices donde podés resteer temprano y barato.\n\n## Cuatro consejos finales\n\nSi querés moverte 2 a 3 veces más rápido sin incendiar tu base de código, empezá acá: aprendé los límites bien a través de trabajo hands-on con modelos. Optimizá tus sistemas dentro del ámbito de esos límites. Buscá leverage donde las fortalezas del modelo se alinean con tu workflow. Y leé la maldita base de código — cuando la mantenibilidad no tiene un oracle rápido para el aprendizaje por refuerzo, el loop humano de juicio sigue siendo irremplazable.\n\nEl hype dice que la fábrica a ciegas está viniendo. La disciplina dice: por ahora, el juez sos vos."}, {"id": "ai/2026-08-11-article-1", "front": "ai", "date": "2026-08-11", "type": "article", "title": "SwarmForge — Coordinating AI Agents with Disciplined Tmux Orchestration", "words": 2100, "text": "You've probably felt it: you point a powerful agent at a complex task, and within minutes it has painted itself into a corner, made a decision you didn't intend, or simply lost track of what it was supposed to be doing. The promise of multi-agent systems has always been that collaboration would solve this — let one agent handle specification while another handles cleanup while a third does the architecture — but in practice it usually degrades into a chaotic free-for-all where everyone talks over everyone else and nothing gets finished.\n\nRobert Martin, better known as Uncle Bob, has been quietly working on a different approach. His project SwarmForge, which just passed 2,100 stars on GitHub and 258 commits, doesn't try to build an intelligent orchestrator that decides what each agent should do next. Instead, it takes the opposite route: it creates a disciplined structure where agents hand off work to each other in a predictable sequence, with clear boundaries of responsibility, enforced by tmux sessions, git worktrees, and a shared constitution.\n\nThe system runs entirely locally. It needs zsh, git, tmux, Babashka, and at least one agent backend like Codex, Claude, or Copilot. You choose a workflow branch — two-pack, four-pack, or six-pack — that defines which roles participate and in what order they pass tasks. Then you run the single command `./swarm`, and a tmux session spawns with one window per role, each agent working in its own git worktree so they never step on each other's changes.\n\nThe two-pack is the quick backend loop. A coder agent implements what you want using TDD and unit tests, then hands off to a cleaner agent that does cleanup, CRAP and DRY review, architectural review, and hardening. The normal flow is simply coder to cleaner back to coder until both agree the work is done. It's designed for tasks where you want fast iteration without the overhead of specification and acceptance testing.\n\nThe four-pack adds a specifier role that turns your intent into precise Gherkin acceptance specifications and asks for approval before anyone writes a line of code. Then the coder implements those specifications with TDD and generated acceptance tests, followed by a refactorer that handles behavior-preserving cleanup and coverage improvement, and finally an architect who owns the high-level structure and dependency direction. The flow cycles through specifier, coder, refactorer, architect, and back, each agent working in its own worktree with the previous agent's completed changes merged in via git.\n\nThe six-pack is the full treatment for major projects. It splits every quality-concern role into its own agent: the specifier writes Gherkin specs and end-to-end QA procedures, the coder implements them with TDD, the cleaner does local cleanup and mutation-site scans, the architect reviews module structure and boundaries, the hardender handles mutation and language hardening, and a separate QA agent converts the specifier's procedures into executable scripts and runs final verification. Six agents, each doing one job well, passing work down a pipeline.\n\nWhat makes this work where other multi-agent setups fail is the message-passing layer between the roles. Rather than having agents communicate directly with each other through prompts, SwarmForge uses a handoff protocol. Each agent writes its work into its git worktree and produces a structured handoff message that the next agent picks up. The handoff includes the current state, what was completed, what remains, and any concerns or decisions that need to carry forward. The next agent starts fresh in its own clean worktree, reads the handoff, and proceeds.\n\nThe tmux sessions and worktrees are not incidental — they are the core mechanism for isolation. Each agent runs in its own tmux window attached to its own session, in its own git worktree, so there is no shared editing state, no accidentally clobbered files, and no ambiguity about who owns which part of the codebase at any given moment. When an agent finishes its turn, it commits to its worktree and writes a handoff message. The next agent's window lights up, pulls the changes, and starts its review.\n\nThe constitution articles embedded in the system provide the shared rules that all agents follow — coding standards, review criteria, communication protocols — and these articles update as the project evolves. Each workflow branch ships with its own local constitution on top of the shared articles from the main branch, so teams can customize behavior without rewriting the core system.\n\nThe README acknowledges upfront that this is a system for disciplined engineering, not for casual hacking. It requires you to set up agent backends, configure terminal adapters for your specific terminal emulator, and understand git worktrees. The barrier to entry is real. But that is precisely the point: the discipline is the feature, not a bug.\n\nWhat's most interesting about SwarmForge is what it doesn't build. There is no central AI director deciding who should do what next. There is no reinforcement learning loop optimizing handoff efficiency. There is no dynamic task graph that rebalances workloads. Instead, it leans on the things that have worked reliably in software engineering for decades: explicit process, immutable handoffs, isolated environments, and clear role boundaries. The agents are smart, but the process is dumb in the best way.\n\nThis approach matters right now because as agent tooling gets more capable, the temptation is to throw more agents at harder problems and hope they figure it out. SwarmForge argues for the opposite: give each agent a narrow, well-defined job, structure the handoffs so nothing is lost in translation, and let git — not an LLM — be the arbiter of what happened when. It is a system designed not around what AI can do, but around what reliable engineering has always demanded.", "sources": [{"name": "SwarmForge — A simple tool for coordinating several AI agents.", "url": "https://github.com/unclebob/swarm-forge"}], "title_es": "SwarmForge — Coordinación de Agentes de IA con Orquestación en Tmux", "text_es": "Ya lo habés sentido: le señalás una tarea compleja a un agente potente, y en minutos se pinta en una esquina, toma una decisión que no intentaste, o simplemente pierde la pista de qué era lo que tenía que hacer. La promesa de los sistemas multi-agente ha sido siempre que la colaboración resolvería esto — un agente maneje la especificación, otro la limpieza, un tercero la arquitectura — pero en la práctica se degrada en un caos donde todos hablan encima y no se termina nada.\n\nRobert Martin, mejor conocido como Uncle Bob, ha estado trabajando en silencio en un enfoque diferente. Su proyecto SwarmForge, que acaba de superar las 2.100 estrellas en GitHub y 258 commits, no intenta construir un orquestador inteligente que decida qué debe hacer cada agente. Al contrario: crea una estructura disciplinada donde los agentes pasan el trabajo entre sí en una secuencia predecible, con límites claros de responsabilidad, forzados por sesiones de tmux, worktrees de git y una constitución compartida.\n\nEl sistema corre enteramente en local. Necesitás zsh, git, tmux, Babashka, y al menos un backend de agente configurado como Codex, Claude, o Copilot. Elegís una rama de flujo de trabajo — two-pack, four-pack, o six-pack — que define qué roles participan y en qué orden. Después ejecutás el comando único `./swarm`, y una sesión de tmux se abre con una ventana por rol, cada agente trabajando en su propio worktree de git para que nunca pisen los cambios del otro.\n\nEl two-pack es el loop rápido de backend. Un agente coder implementa lo que querés usando TDD y tests unitarios, y luego pasa el trabajo a un agente cleaner que hace limpieza, revisión de CRAP y DRY, revisión arquitectónica, y endurecimiento. El flujo normal es coder a cleaner y vuelta a coder hasta que ambos estén de acuerdo. Está pensado para tareas donde querés iterar rápido sin la sobrecarga de especificación y tests de aceptación.\n\nEl four-pack agrega un rol specifier que convierte tu intención en especificaciones Gherkin precisas y pide aprobación antes de que alguien escriba una sola línea. Luego el coder implementa esas especificaciones con TDD y tests de aceptación generados, seguido por un refactorer que hace limpieza conservativa y mejora de cobertura, y finalmente un architect que posee la estructura de módulos y la dirección de dependencias. El flujo pasa por specifier, coder, refactorer, architect, y vuelve, cada agente trabajando en su propio worktree con los cambios del agente anterior fusionados vía git.\n\nEl six-pack es la versión completa para proyectos importantes. Separa cada preocupación de calidad en su propio agente: el specifier escribe specs Gherkin y procedimientos de QA de extremo a extremo, el coder los implementa con TDD, el cleaner hace limpieza local y escaneos de mutación, el architect revisa estructura de módulos y fronteras, el hardender maneja endurecimiento y mutación de lenguaje, y un agente QA separado convierte los procedimientos del specifier en scripts ejecutables y corre verificación final. Seis agentes, cada uno haciendo un trabajo bien definido, pasando el trabajo por un pipeline.\n\nLo que hace funcionar a SwarmForge donde otros sistemas multi-agente fallan es la capa de pasaje de mensajes entre los roles. En lugar de tener agentes comunicándose directamente entre sí a través de prompts, SwarmForge usa un protocolo de handoff. Cada agente escribe su trabajo en su worktree y produce un mensaje estructurado que el siguiente agente toma. El handoff incluye el estado actual, qué se completó, qué queda pendiente, y qué preocupaciones o decisiones deben llevarse adelante. El siguiente agente arranca fresco en su worktree limpio, lee el handoff, y procede.\n\nLas sesiones de tmux y los worktrees no son incidentales — son el mecanismo central de aislamiento. Cada agente corre en su propia ventana de tmux unida a su propia sesión, en su propio worktree de git, así que no hay estado de edición compartido, no hay archivos destruidos, y no hay ambigüedad sobre quién posee qué parte del código en cada momento. Cuando un agente termina su turno, comitea a su worktree y escribe un mensaje de handoff. La ventana del siguiente agente se ilumina, hace pull de los cambios, y arranca su revisión.\n\nLa constitución embebida en el sistema provee las reglas compartidas que todos los agentes siguen — estándares de código, criterios de revisión, protocolos de comunicación — y estos artículos se actualizan a medida que evoluciona el proyecto. Cada rama de flujo de trabajo incluye su propia constitución local sobre la base de los artículos compartidos de la rama main, así que los equipos pueden personalizar sin reescribir el sistema central.\n\nEl README reconoce desde el principio que SwarmForge es un sistema para ingeniería disciplinada, no para hacer hacking casual. Requiere configurar backends de agentes, adaptadores de terminal para tu emulador específico, y entender worktrees de git. La barrera de entrada es real. Pero precisamente eso es el punto: la disciplina es la característica, no un bug.\n\nLo más interesante de SwarmForge es lo que no construye. No hay un orquestador central de IA que decida quién debe hacer qué. No hay un loop de aprendizaje por refuerzo optimizando la eficiencia de los handoffs. No hay un grafo de tareas dinámico que redistribuya cargas. En cambio, se apoya en lo que ha funcionado de manera confiable en ingeniería de software por décadas: proceso explícito, handoffs inmutables, entornos aislados, y límites de rol claros. Los agentes son inteligentes, pero el proceso es simple en el mejor sentido.\n\nEste enfoque importa ahora porque mientras las herramientas de agente se vuelven más capaces, la tentación es lanzar más agentes a problemas más difíciles y esperar que lo resuelvan. SwarmForge propone lo opuesto: dale a cada agente un trabajo estrecho y bien definido, estructurá los handoffs para que nada se pierda en la traducción, y dejá que git — no un LLM — sea el árbitro de qué pasó cuándo. Es un sistema diseñado no alrededor de qué puede hacer la IA, sino alrededor de lo que la ingeniería confiable siempre ha exigido."}, {"id": "ai/2026-07-31-article-2", "front": "ai", "date": "2026-07-31", "type": "article", "title": "The Code Is Disposable. The Codebase Is Not.", "words": 1521, "text": "Itamar Friedman just published a sharp intervention in the debate over whether engineers should read the code their agents generate, and his answer is both sides are right, because they're answering different questions.\n\nThe piece dropped on X two days ago, and it matters because Friedman runs Qodo, formerly CodiumAI, one of the companies building the review agents everyone is betting on to make dark factories safe. When the founder of a code review tool says human review still has to stay in the loop, that's not a business pitch. That's field data.\n\nHere's the setup. Uncle Bob Martin says he doesn't read the code his agents write anymore. He surrounds them with a gauntlet: unit tests, acceptance tests, QA procedures, coverage metrics, mutation testing, and periodic manual validation. He reviews the specifications and the evidence, not every generated line. Dex Horthy, on the other hand, published two articles arguing the opposite: turn the lights back on. Read the dang code. His team tried the lights-off factory, and after a few months they were spending weeks reverse-engineering a codebase they'd stopped reading, until rewriting large parts of it was easier than continuing to repair it.\n\nFriedman says the tension comes from treating code and the codebase as the same thing. They're not. An individual piece of generated code is increasingly disposable. You can regenerate it, replace it, or rewrite it cheaply. The codebase is not disposable. The codebase is the accumulated architecture of the company, the tribal knowledge, the pull request history. It holds years of decisions, constraints, exceptions, interfaces, conventions, and hard-earned lessons. A locally disposable implementation can still make a globally permanent mess.\n\nUncle Bob is optimizing for confidence in an output. Dex is optimizing for the continued integrity of a system. Both matter, and the mistake is picking one side.\n\nThe deeper problem Friedman identifies is that tests are great at telling you whether an endpoint returns the expected response, whether an existing behavior broke, whether latency and security still hold. They're much weaker at answering questions like: does this responsibility belong in this layer? Will this abstraction survive the next five requirements? Did the change quietly increase coupling? Will the next engineer understand why this design exists? Are we preserving the architecture, or just preserving today's behavior?\n\nA locally correct change can still make the whole system worse. Tests give feedback in seconds. Bad architecture sends the bill in months or years. That's not a small gap in the harness. It's a fundamental difficulty: building a fast, reliable oracle for maintainability. More review agents can raise the floor, catching bugs, security issues, style violations, duplicated code, known anti-patterns, and deviations from documented standards. But they don't necessarily raise or eliminate the ceiling. As Friedman puts it, if the model could always recognize the most maintainable implementation, it probably would have generated that implementation in the first place. We don't yet have a fast, reliable verifier for the evolving quality of a complex codebase.\n\nFriedman's resolution is what he calls progressive autonomy. For familiar, low-risk changes with clear requirements, strong tests, documented standards, a limited blast radius, and good observability, agents should move almost autonomously. For novel, architectural, security-sensitive, or high-impact changes, humans should stay deeply involved. But their attention should move toward the decisions where judgment has the highest leverage: intent, architecture, program design, evidence, and exceptions. Review shouldn't be applied uniformly to every generated line. It should be proportional to the uncertainty and the strength of the evidence. Weak evidence should demand deeper inspection. Strong evidence should earn more autonomy.\n\nThe mechanism for making that work is moving human judgment earlier, before thousands of generated lines make changing direction expensive. Friedman breaks serious work into four stages: product requirements, system architecture, program design, and vertical slices. First, align on the problem and the outcome you want for the user. Then align on how services, endpoints, schemas, queues, and data stores interact. Then go one level deeper into the shape of the program itself: the types, method signatures, call stacks, file layout, and who owns which responsibility. Only then does implementation begin.\n\nAnd even implementation shouldn't land as one enormous generated change. Vertical slices matter because agents tend to produce horizontal plans. They build the whole database layer, then the service layer, then the API, then the frontend. You end up with thousands of lines before anyone can interact with the feature as a complete system. A vertical slice gives you evidence sooner. It lets you re-steer the agent after one hundred or two hundred lines instead of discovering the wrong design after two thousand.\n\nFriedman frames this with a thought experiment. The old interview question gives us two disks: one with the code, one with the tests. The classic answer was always the tests, because code is just one implementation of the system, but the tests preserve what the system is supposed to do. The AI era reveals a third disk. This one holds the intent of the system: its architecture, its standards, its constraints, its important design decisions, and the accumulated judgment of the engineers who built it. Tests tell us what the system does. The third disk tells us what kind of system we're trying to preserve. It includes product requirements, service boundaries, API contracts, architectural principles, security policies, ownership, coding standards, known exceptions, and the reasoning behind the decisions that mattered. Without this context, agents can keep producing code that works while slowly destroying the properties that made the system maintainable.\n\nThe durable asset isn't just the tests. It's the full system of intent, constraints, context, evidence, and governance around the code. And over time, every repeated human judgment should become a candidate for codification. When reviewers keep rejecting the same pattern, that pattern should become a rule. When a failure reaches production, the lesson should become a test, a policy, or a new verification workflow. When an architectural decision gets made, agents should receive it as persistent context instead of rediscovering it on every task. Human review isn't the opposite of automation. It's how we teach the governance system what still needs to be automated.\n\nThe goal Friedman is reaching for is nonlinear human leverage, borrowing Gergely Orosz's framing from a conversation with Dex. The objective isn't maximum autonomy. It's systems where reliability, deployment volume, and operational scale can grow much faster than the number of people needed to manage them. As agents generate more code, human attention shouldn't scale linearly with every line produced. But human judgment shouldn't disappear either. It should concentrate where it has the highest leverage. The success metric isn't how many pull requests got generated without a human. It's how much reliable engineering output the organization can produce for every unit of scarce human judgment.\n\nThe piece closes with the synthesis: Uncle Bob is describing the destination, where code becomes disposable and constraints and verification become the source of trust. Dex is describing the bridge we still have to cross, where today's models and harnesses can't reliably protect long-term maintainability without human judgment. The mistake is picking one side. We should build toward Uncle Bob's world while operating with Dex's honesty about where we actually are today. The code may be disposable. The health of the codebase is not.", "sources": [{"name": "The Code Is Disposable. The Codebase Is Not.", "url": "https://x.com/itamar_mar/status/2082453557890945281"}], "title_es": "El Código es Descartable. La Codebase No.", "text_es": "Itamar Friedman acaba de publicar una intervención aguda en el debate sobre si los ingenieros deberían leer el código que sus agentes generan, y su respuesta es que ambos lados tienen razón, porque están respondiendo preguntas diferentes.\n\nLa pieza cayó en X hace dos días, y es importante porque Friedman dirige Qodo, antes CodiumAI, una de las compañías construyendo los review agents en los que todos apuestan para hacer seguras las dark factories. Cuando el fundador de una herramienta de code review dice que la revisión humana todavía tiene que quedarse en el loop, eso no es un pitch de negocio. Son datos de campo.\n\nAcá va el setup. Uncle Bob Martin dice que ya no lee el código que sus agentes escriben. Los rodea con un gauntlet: unit tests, acceptance tests, procedimientos de QA, métricas de coverage, mutation testing, y validación manual periódica. Revisa las especificaciones y la evidencia, no cada línea generada. Dex Horthy, por otro lado, publicó dos artículos argumentando lo opuesto: encendé las luces de vuelta. Leé el maldito código. Su equipo probó la fábrica con luces apagadas, y después de unos meses estaban pasando semanas haciendo reverse-engineering de una codebase que habían dejado de leer, hasta que reescribir grandes partes de ella fue más fácil que seguir reparándola.\n\nFriedman dice que la tensión viene de tratar al código y a la codebase como la misma cosa. No lo son. Una pieza individual de código generado es cada vez más descartable. Podés regenerarla, reemplazarla, o reescribirla barato. La codebase no es descartable. La codebase es la arquitectura acumulada de la compañía, el conocimiento tribal, el historial de pull requests. Guarda años de decisiones, restricciones, excepciones, interfaces, convenciones, y lecciones ganadas con esfuerzo. Una implementación localmente descartable todavía puede hacer un desastre globalmente permanente.\n\nUncle Bob está optimizando para confianza en un output. Dex está optimizando para la integridad continua de un sistema. Ambas cosas importan, y el error es elegir un solo lado.\n\nEl problema más profundo que Friedman identifica es que los tests son geniales para decirte si un endpoint retorna la respuesta esperada, si un comportamiento existente se rompió, si la latencia y seguridad todavía se mantienen. Son mucho más débiles para responder preguntas como: ¿esta responsabilidad pertenece a esta capa? ¿Esta abstracción va a sobrevivir los próximos cinco requerimientos? ¿El cambio aumentó silenciosamente el coupling? ¿El próximo ingeniero va a entender por qué existe este diseño? ¿Estamos preservando la arquitectura, o solo preservando el comportamiento de hoy?\n\nUn cambio localmente correcto todavía puede hacer el sistema entero peor. Los tests dan feedback en segundos. La mala arquitectura manda la cuenta en meses o años. Eso no es una brecha chica en el harness. Es una dificultad fundamental: construir un oráculo rápido y confiable para la mantenibilidad. Más review agents pueden levantar el piso, atrapando bugs, problemas de seguridad, violaciones de estilo, código duplicado, anti-patterns conocidos, y desviaciones de estándares documentados. Pero no necesariamente levantan o eliminan el techo. Como lo pone Friedman, si el modelo pudiera siempre reconocer la implementación más mantenible, probablemente habría generado esa implementación en primer lugar. Todavía no tenemos un verificador rápido y confiable para la calidad evolutiva de una codebase compleja.\n\nLa resolución de Friedman es lo que él llama autonomía progresiva. Para cambios familiares, de bajo riesgo, con requerimientos claros, tests fuertes, estándares documentados, un blast radius limitado, y buena observabilidad, los agentes deberían moverse casi autónomamente. Para cambios novedosos, arquitectónicos, sensibles a seguridad, o de alto impacto, los humanos deberían mantenerse profundamente involucrados. Pero su atención debería moverse hacia las decisiones donde el juicio tiene el mayor leverage: intent, arquitectura, diseño de programa, evidencia, y excepciones. La revisión no debería aplicarse uniformemente a cada línea generada. Debería ser proporcional a la incertidumbre y a la fortaleza de la evidencia. Evidencia débil debería demandar inspección más profunda. Evidencia fuerte debería ganar más autonomía.\n\nEl mecanismo para hacer que esto funcione es mover el juicio humano más temprano, antes de que miles de líneas generadas hagan costoso cambiar de dirección. Friedman divide el trabajo serio en cuatro etapas: requerimientos de producto, arquitectura del sistema, diseño de programa, y slices verticales. Primero, alinearse en el problema y el resultado que querés para el usuario. Después alinearse en cómo los servicios, endpoints, schemas, colas, y data stores interactúan. Después ir un nivel más profundo en la forma del programa mismo: los tipos, method signatures, call stacks, layout de archivos, y quién es dueño de qué responsabilidad. Solo entonces empieza la implementación.\n\nE incluso la implementación no debería aterrizar como un cambio generado enorme. Los slices verticales importan porque los agentes tienden a producir planes horizontales. Construyen toda la capa de base de datos, después la capa de servicio, después la API, después el frontend. Terminás con miles de líneas antes de que alguien pueda interactuar con la feature como un sistema completo. Un slice vertical te da evidencia antes. Te permite re-direccionar al agente después de cien o doscientas líneas en lugar de descubrir el diseño equivocado después de dos mil.\n\nFriedman enmarca esto con un experimento mental. La vieja pregunta de entrevista nos da dos discos: uno con el código, uno con los tests. La respuesta clásica siempre fueron los tests, porque el código es solo una implementación del sistema, pero los tests preservan lo que se supone que el sistema hace. La era de AI revela un tercer disco. Este guarda el intent del sistema: su arquitectura, sus estándares, sus restricciones, sus decisiones de diseño importantes, y el juicio acumulado de los ingenieros que lo construyeron. Los tests nos dicen qué hace el sistema. El tercer disco nos dice qué tipo de sistema estamos tratando de preservar. Incluye requerimientos de producto, límites de servicio, contratos de API, principios arquitectónicos, políticas de seguridad, ownership, estándares de código, excepciones conocidas, y el razonamiento detrás de las decisiones que importaron. Sin este contexto, los agentes pueden seguir produciendo código que funciona mientras lentamente destruyen las propiedades que hacían el sistema mantenible.\n\nEl asset durable no son solo los tests. Es el sistema completo de intent, restricciones, contexto, evidencia, y governance alrededor del código. Y con el tiempo, cada juicio humano repetido debería convertirse en candidato para codificación. Cuando los reviewers siguen rechazando el mismo pattern, ese pattern debería convertirse en regla. Cuando una falla llega a producción, la lección debería convertirse en un test, una política, o un nuevo workflow de verificación. Cuando se toma una decisión arquitectónica, los agentes deberían recibirla como contexto persistente en lugar de redescubrirla en cada tarea. La revisión humana no es lo opuesto a la automatización. Es cómo le enseñamos al sistema de governance qué todavía necesita ser automatizado.\n\nEl objetivo al que Friedman apunta es leverage humano no lineal, tomando prestado el framing de Gergely Orosz de una conversación con Dex. El objetivo no es autonomía máxima. Son sistemas donde la confiabilidad, el volumen de deployment, y la escala operacional pueden crecer mucho más rápido que el número de personas necesarias para gestionarlos. A medida que los agentes generan más código, la atención humana no debería escalar linealmente con cada línea producida. Pero el juicio humano tampoco debería desaparecer. Debería concentrarse donde tiene el mayor leverage. La métrica de éxito no es cuántos pull requests se generaron sin un humano. Es cuánto output de ingeniería confiable puede producir la organización por cada unidad de juicio humano escaso.\n\nLa pieza cierra con la síntesis: Uncle Bob está describiendo el destino, donde el código se vuelve descartable y las restricciones y verificación se convierten en la fuente de confianza. Dex está describiendo el puente que todavía tenemos que cruzar, donde los modelos y harnesses de hoy no pueden proteger confiablemente la mantenibilidad a largo plazo sin juicio humano. El error es elegir un lado. Deberíamos construir hacia el mundo de Uncle Bob mientras operamos con la honestidad de Dex sobre dónde realmente estamos hoy. El código puede ser descartable. La salud de la codebase no lo es."}, {"id": "ai/2026-07-31-article-1", "front": "ai", "date": "2026-07-31", "type": "article", "title": "Software Factories, Light and Dark", "words": 1487, "text": "Addy Osmani just published a landmark essay on something the industry has been quietly discovering the hard way: the difference between a software factory that keeps the lights on and one that runs in the dark.\n\nThe piece appeared on his blog last week, and it's essential reading if you're building with agents or thinking about it. Osmani spent over fourteen years at Google leading developer experience across Chrome and more recently AI, so when he writes about the limits of automated coding, he's drawing on hard-won production scars. What makes this piece matter is that it names the trap everyone is walking into and draws the map for getting out.\n\nHere's the through-line. A software factory is many harnessed loops running in parallel, fed by a queue of work and drained through a review gate into production. The loop is the atom: one agent doing a single job on repeat until some condition is met. The harness is the walls around that loop: the sandbox it runs in, the tools it can reach, the memory that survives between runs, and the gates that decide what done means. The factory is loops at scale, and the paradigm shift is moving from writing code to building and running the factory that writes it.\n\nThe central insight is that there are two kinds of factories, and the difference comes down to where you put the lights. A dark factory runs with the lights physically off because the only things on the floor are machines, and machines don't need light to see. In software, that means code ships that no human has read, verified only by other machines. A lit factory is the same pipeline with the lights left on where judgment lives. The agents still do most of the building, but a human reads what comes out before it ships, and the lights stay on wherever a wrong call is expensive.\n\nOsmani borrows the image from manufacturing. FANUC in Japan has been running lights-out factories since two thousand one; Xiaomi opened a heavily automated dark factory in twenty twenty-four. What these have in common is a product assembled and shipped without a single human having read any of it. In software, the floor is the diff. The diff is the one thing you used to read, and in a dark factory, you don't anymore.\n\nThis is a surprisingly easy thing to do, at least at first. It's easy because that missing review step gets in the way of everything. Its absence makes your perception of your team's vertical throughput seem suddenly and radically higher. It feels as if you've broken the sound barrier. But for all its apparent ease, it's harder than it seems to survive those dark workflows, with all their buried costs. The cost that breaks you is comprehension debt: the widening gap between how much code exists and how much any human still understands. A dark factory doesn't pay it down; it takes it on as fast as it can, with the tests green the whole way.\n\nOsmani reports from Dex Horthy's experience running a fully automated code factory for about four months, during which no human looked at the code that was written. The underlying tradeoff is between maximizing token utilization, the number we currently treat as progress, and minimizing the amount of the system any human participant still understands at any moment. Where the dark factory truly shines is in its ability to burn through pristine code while the tests stay green. The ultimate reckoning, when it comes, will not be a dramatic moment. It will be quiet and late. By the time you notice, you're already drowning in unread code.\n\nThe fundamental constraint in a software factory isn't how much code we can churn out; it's how quickly we can verify it. Osmani calls this back pressure: the rule that you can only hand a loop as much autonomy as you can cheaply and reliably verify, and not one inch more. Verification, not generation, is the real constraint. Unbounded generation capacity is in perpetual tension with the finite, non-scaling resource of human attention. The bottleneck was never generation. It was always the review gate. Volume alone isn't the problem; what we're really suffering from is a surplus of bad pull requests. When you've got high volume without trustworthy gates, manufactured defects are unavoidable.\n\nThe lit version doesn't tack review onto the end but moves the point of human judgment upstream, to the product, the design, and the architecture before an agent starts a loop. That upfront hour leads to fewer implementation hours. It turns a long, frustrating code review into a quick read of a two hundred line plan. You get to review a decision before it's built, so later you aren't chasing through two thousand lines of generated code to find out what the decision even was. Some decisions are expensive and long-lived enough that you'd want a person in on them early, before the cost compounds.\n\nThe safety net is made up of perfectly ordinary architectural practices we've always known about and mostly ignored: good types and method signatures so that mistakes are caught by the compiler instead of in production; test seams where we can pin behavior and make change observable; laying out the code so the next reader, human or model, knows where to find the thing they care about; keeping call stacks short and legible; keeping component boundaries well defined so a change doesn't have a huge blast radius; and dependency injection so we can swap out one piece for another. None of it is new. We've always said we care about good architecture. But now that we're using automated coding agents, that architecture is finally doing a second job as a cheap and hard-to-fake safety net against the mistakes the agent will make.\n\nA loop can earn itself fully automated status only if the check is cheap, runs at high frequency, and relies on something that can't be easily faked out. Green-or-red oracles, type gates, property tests, and a review agent coupled with a real rubric all fit. Short loops are easier to verify than long ones. Horthy's rule of thumb: an agent holds up for three to ten steps, then starts losing the thread past twenty. When a loop is short, verifying it is cheap. Sprawling loops hide mistakes in the corners, which is another way of saying they never earned lights-out status.\n\nKeeping the lights on is the opposite case. A loop needs to be reviewed if a wrong answer is expensive and only a person can catch it. Subtle production bugs that can't be caught by tests, large blast radii, and a decision that's going to shape the work of a year or more all qualify. The danger is forgetting to flip each switch and just setting all of them to the same mode. All dark, and you're stuck tearing everything down four months later. All lit, and no one can get reviews done in time and you're stuck in a gigantic bottleneck. The hard, skilled job is deciding where to put each switch.\n\nNotice that the person never left the factory. They moved. Engineers need to increasingly own the outer loop. The agents can investigate a bug, write up the diagnosis, implement a fix, run the tests, and write up a report. That's the execution of the inner loop, and they can do it as efficiently as anyone. But that was never the job. The bits you own are what Osmani calls the outer loop: decide whether it's the right way to address the problem, verify that the diagnosis and implementation are sound, approve the change, and carry the consequences of being wrong. The boundary between the two loops is evidence: the diffs, the tests, the logs, and a brief explanation that connects them.\n\nThe piece closes with a reminder that robots are fine operating in the dark, but humans need to see what they're doing. If everything on the factory floor is dark, and you can't see anything, and you can't even find the light switch, that's where the danger is. The takeaway is simple: build loops, harness them, run them at scale. But keep the lights on wherever judgment lives, and never forget that your hardest job now is knowing which checks to build and how much autonomy to delegate.", "sources": [{"name": "Software Factories, Light and Dark", "url": "https://addyosmani.com/blog/software-factories/"}], "title_es": "Fábricas de Software, Claras y Oscuras", "text_es": "Addy Osmani acaba de publicar un ensayo clave sobre algo que la industria viene descubriendo a los golpes: la diferencia entre una fábrica de software que mantiene las luces encendidas y una que corre a oscuras.\n\nEl artículo apareció en su blog la semana pasada, y es lectura esencial si estás construyendo con agentes o pensando en hacerlo. Osmani pasó más de catorce años en Google liderando developer experience en Chrome y más recientemente en AI, así que cuando escribe sobre los límites del código automatizado, está extrayendo lecciones de cicatrices de producción ganadas con esfuerzo. Lo que hace importante a esta pieza es que nombra la trampa en la que todos están cayendo y traza el mapa para salir.\n\nAcá va la línea argumental. Una fábrica de software son muchos loops harnessed corriendo en paralelo, alimentados por una cola de trabajo y drenados a través de un review gate hacia producción. El loop es el átomo: un agente haciendo un único trabajo en repetición hasta que se cumple alguna condición. El harness son las paredes alrededor de ese loop: el sandbox en el que corre, las herramientas que puede alcanzar, la memoria que sobrevive entre corridas, y los gates que deciden qué significa done. La fábrica son loops a escala, y el cambio de paradigma es pasar de escribir código a construir y correr la fábrica que lo escribe.\n\nEl insight central es que hay dos tipos de fábricas, y la diferencia se reduce a dónde ponés las luces. Una dark factory corre con las luces físicamente apagadas porque lo único que hay en el piso son máquinas, y las máquinas no necesitan luz para ver. En software, eso significa código que shipea sin que ningún humano lo haya leído, verificado solo por otras máquinas. Una lit factory es el mismo pipeline con las luces encendidas donde vive el juicio. Los agentes siguen haciendo la mayor parte de la construcción, pero un humano lee lo que sale antes de que shipee, y las luces quedan encendidas donde sea que una decisión equivocada sea costosa.\n\nOsmani toma prestada la imagen de manufactura. FANUC en Japón viene corriendo fábricas lights-out desde dos mil uno; Xiaomi abrió una dark factory fuertemente automatizada en dos mil veinticuatro. Lo que tienen en común es un producto ensamblado y shippeado sin que un solo humano haya leído nada de él. En software, el piso es el diff. El diff es lo único que solías leer, y en una dark factory, ya no lo hacés más.\n\nEsto es algo sorprendentemente fácil de hacer, al menos al principio. Es fácil porque ese paso de review faltante se interpone en el camino de todo. Su ausencia hace que tu percepción del throughput vertical de tu equipo parezca repentina y radicalmente más alta. Se siente como si hubieras roto la barrera del sonido. Pero por toda su aparente facilidad, es más difícil de lo que parece sobrevivir esos workflows oscuros, con todos sus costos enterrados. El costo que te rompe es la deuda de comprensión: la brecha creciente entre cuánto código existe y cuánto cualquier humano todavía entiende. Una dark factory no la paga; la toma tan rápido como puede, con los tests en verde todo el camino.\n\nOsmani reporta de la experiencia de Dex Horthy corriendo una code factory completamente automatizada durante unos cuatro meses, durante los cuales ningún humano miró el código que se estaba escribiendo. El tradeoff subyacente es entre maximizar la utilización de tokens, el número que actualmente tratamos como progreso, y minimizar la cantidad del sistema que cualquier participante humano todavía entiende en cualquier momento. Donde la dark factory realmente brilla es en su habilidad para quemar código prístino mientras los tests quedan verdes. El ajuste de cuentas final, cuando llega, no será un momento dramático. Será tranquilo y tardío. Para cuando lo notás, ya estás ahogándote en código no leído.\n\nLa restricción fundamental en una fábrica de software no es cuánto código podemos producir; es qué tan rápido podemos verificarlo. Osmani llama a esto back pressure: la regla de que solo podés darle a un loop tanta autonomía como puedas verificar barato y confiablemente, y ni un centímetro más. La verificación, no la generación, es la restricción real. La capacidad de generación sin límites está en tensión perpetua con el recurso finito y no escalable de la atención humana. El cuello de botella nunca fue la generación. Siempre fue el review gate. El volumen por sí solo no es el problema; de lo que realmente sufrimos es de un exceso de pull requests malos. Cuando tenés alto volumen sin gates confiables, los defectos manufacturados son inevitables.\n\nLa versión lit no agrega review al final sino que mueve el punto de juicio humano upstream, al producto, el diseño y la arquitectura antes de que un agente arranque un loop. Esa hora upfront lleva a menos horas de implementación. Convierte un code review largo y frustrante en una lectura rápida de un plan de doscientas líneas. Llegás a reviewar una decisión antes de que esté construida, así que después no estás persiguiendo a través de dos mil líneas de código generado para averiguar cuál fue siquiera la decisión. Algunas decisiones son lo suficientemente costosas y de larga vida como para que quieras a una persona en ellas temprano, antes de que el costo se componga.\n\nLa red de seguridad está hecha de prácticas arquitectónicas perfectamente ordinarias que siempre supimos y mayormente ignoramos: buenos tipos y method signatures para que los errores sean atrapados por el compilador en lugar de en producción; test seams donde podemos anclar comportamiento y hacer el cambio observable; disponer el código para que el próximo lector, humano o modelo, sepa dónde encontrar lo que le importa; mantener los call stacks cortos y legibles; mantener los component boundaries bien definidos para que un cambio no tenga un blast radius enorme; y dependency injection para que podamos intercambiar una pieza por otra. Nada de esto es nuevo. Siempre dijimos que nos importa la buena arquitectura. Pero ahora que estamos usando agentes de código automatizado, esa arquitectura finalmente está haciendo un segundo trabajo como una
