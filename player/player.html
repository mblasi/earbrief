 dropped partial-prefix matching from its implicit prompt cache; instead of reusing any shared prefix across requests, it now keys whole-prompt cache entries off the latest message. Ploy's agent opens every conversation with a static twenty-nine-thousand-token prefix of tool schemas and system prompt, identical across sessions, and under the new caching model that prefix was hitting a zero percent cache rate, getting rebilled at full uncached price on every single call. Their fix was to maintain multiple cache entries, so a request that misses one entry because workspace memory changed can still hit a different, slightly older entry instead of falling all the way back to an uncached write. After that change, first-call cache hits went from roughly zero to eighty-three point seven percent, total uncached input tokens dropped twenty-eight percent, and GPT-5.6's real per-suite cost fell below what they'd been paying on Opus.\n\nCaching wasn't the only surprise. The two providers also differ in how their models fill tool call arguments and how they replay prior reasoning across turns, which meant Ploy had to rework tool schemas that had been quietly tuned, without anyone deciding to tune them, around Claude's particular conventions for filling optional fields, and had to change how they reconstructed conversation state between turns because GPT-5.6 doesn't carry forward the same hidden reasoning trace that Anthropic's models do. None of that shows up in a pricing page; all of it shows up the first week in production.\n\nSharp takeaway: when you migrate providers, benchmark your actual cache hit rate before you trust the headline per-token price, because a caching architecture change can silently erase most of a price cut, and budget engineering time for the tool-schema and state-handling assumptions your code accreted around the old provider's specific behavior.\n\nStory five. Hugging Face turned its Kernels project from a convention into something closer to a governed supply chain.\n\nThe July sixth update adds a dedicated \"kernel\" repository type on the Hub, with compatibility metadata that tells you which accelerators, operating systems, and backend versions a given kernel actually supports. More significantly, the kernels package now only loads kernels from trusted publishers by default, organizations the community has vetted, and early Sigstore-based signing lets you verify a kernel's provenance with a new command-line check before you load native code into your process. On the framework side, Apache's TVM foreign function interface is now supported alongside Torch as a standardized binary interface, so a kernel built once can run across PyTorch, Jax, and CuPy instead of needing a separate build per framework. And the project now explicitly supports agentic kernel development: an agent can scaffold, build, benchmark, and iteratively optimize a custom kernel from scratch as a defined workflow, not a one-off experiment.\n\nSharp takeaway: if your team has been quietly trusting whatever kernel repo someone forked two years ago, this is the moment that stops being a reasonable default; treat custom kernels the same way you'd treat any other unreviewed native dependency now that there's a mechanism to actually check.\n\nStory six. A proof-of-concept attack called Friendly Fire turns the exact job your code-review agent is hired to do into the attack itself.\n\nPublished by the AI Now Institute, the attack targets Claude Code and OpenAI's Codex running in autonomous, auto-approving modes, the setup where you point the agent at a folder and ask it to do a security review. The researchers disguised a malicious binary as the compiled build artifact of an innocuous file in the repository, seeding it with strings copied from that file so the agent's own disassembly check ties the two together and treats the binary as legitimate. Ask the agent to review the project, and it reads the setup instructions, decides running the binary is a normal part of verifying the build, and executes the attacker's payload with your permissions.\n\nSharp takeaway: this is the same root failure as yesterday's Mozilla reverse-shell finding, an agent's instinct to complete the job overriding its instinct to be suspicious, except here the trigger is the task itself rather than an error message, which means sandboxing autonomous review agents is no longer a nice-to-have for any team running them unattended.\n\nTwo quick honorable mentions. Simon Willison published a short, practical write-up on caching uvx-installed tools inside GitHub Actions so continuous integration runs stop re-downloading the same Python package from the Python Package Index on every job, a small fix worth five minutes if your pipelines lean on uvx. And the Cybersecurity and Infrastructure Security Agency added the Langflow flaw behind yesterday's JadePuffer ransomware campaign to its Known Exploited Vulnerabilities catalog, which for anyone running a public Langflow instance is now a compliance deadline, not just good advice.\n\nNow, what to watch. Gemini three point five Pro is still targeting general availability on July seventeenth, three days out, so expect another pricing and benchmark round the moment it lands. Watch whether other labs try to replicate Anthropic's J-lens technique on their own models, since a cross-lab result would turn this from an interesting Claude-specific finding into a general claim about how transformer language models represent reportable knowledge, while a failure to replicate would suggest it's an artifact of Claude's specific training rather than a property of the architecture. And keep an eye on whether more teams start publishing their agent harness's fixed token overhead now that Systima put a real number on Claude Code's; that kind of measurement tends to spread fast once someone's embarrassed by it, and a public number from OpenAI or Anthropic themselves would be the real test of whether this becomes a competitive axis rather than a one-off blog post.\n\nOne story here is more than a headline, it's a new instrument. The global workspace paper hands interpretability researchers a concrete, reusable technique, the Jacobian lens, for finding what a model can report versus what it merely computes, and that distinction is the kind of methodologically new result worth a slow, structural look: how the probe actually works, what global workspace theory claims about biological cognition and why the structural match might or might not mean anything, and what a runtime J-space check could catch that today's prompt-injection defenses miss. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Anthropic Research (global workspace paper)", "url": "https://www.anthropic.com/research/global-workspace"}, {"name": "MIT Technology Review (J-space explainer)", "url": "https://www.technologyreview.com/2026/07/09/1140293/anthropic-found-a-hidden-space-where-claude-puzzles-over-concepts/"}, {"name": "Forbes (J-lens)", "url": "https://www.forbes.com/sites/johnwerner/2026/07/12/anthropic-illuminates-llm-j-space-with-j-lens/"}, {"name": "Cognition blog (SWE-1.7)", "url": "https://cognition.com/blog/swe-1-7"}, {"name": "Systima blog (Claude Code vs OpenCode token overhead)", "url": "https://systima.ai/blog/claude-code-vs-opencode-token-overhead"}, {"name": "Ploy blog (migrating a production agent to GPT-5.6)", "url": "https://ploy.ai/blog/migrating-a-production-ai-agent-to-gpt-5-6"}, {"name": "Hugging Face blog (Kernels major update)", "url": "https://huggingface.co/blog/revamped-kernels"}, {"name": "The Hacker News (Friendly Fire attack)", "url": "https://thehackernews.com/2026/07/friendly-fire-ai-agents-built-to-catch.html"}, {"name": "Simon Willison's TILs (uvx in GitHub Actions)", "url": "https://til.simonwillison.net/github-actions/uvx-github-actions-cache"}, {"name": "The Hacker News (Langflow added to CISA KEV)", "url": "https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html"}], "title_es": "El espacio oculto de Claude, y los tokens que tu agente gasta antes de leerte", "text_es": "Las últimas veinticuatro horas se dividen en dos tipos de historia: lo que pasa adentro del modelo que nadie diseñó a propósito, y lo que te cuesta, en tokens y en dólares, correr las partes que sí diseñaste a propósito.\n\nSeis historias, ordenadas por cuánto deberían cambiar lo que construís o cómo pensás lo que ya tenés corriendo, más una historia de seguridad que va en la misma conversación que las piezas de superficie de ataque de ayer.\n\nHistoria uno. Anthropic encontró un espacio compacto, mayormente oculto, adentro de Claude que decide de qué puede hablar realmente el modelo.\n\nEl paper se llama \"Verbalizable Representations Form a Global Workspace in Language Models\", y sale de una técnica de sondeo nueva que los investigadores llaman Jacobian lens, o J-lens. Para cada palabra del vocabulario de Claude, el J-lens encuentra el patrón de actividad interna que hace más probable que el modelo diga esa palabra en algún momento futuro, no necesariamente el próximo token, sino cualquier cosa que pudiera reportar si se lo preguntás. Corriéndolo contra Claude Opus cuatro punto seis, el equipo encontró una región que llaman J-space: un subconjunto chico de las representaciones internas del modelo que resulta corresponder, estructuralmente, con la global workspace theory, un modelo de la conciencia de varias décadas del científico cognitivo Bernard Baars. La idea es una metáfora de teatro: docenas de procesos especializados corren en paralelo detrás de escena, invisibles entre sí, y solo un foco angosto de información se transmite a todo el sistema a la vez, convirtiéndose en lo que el sistema puede accionar y describir. El número llamativo es que J-space explica solo entre un seis y un siete por ciento de la varianza representacional total de un concepto adentro del modelo, y sin embargo es casi enteramente lo que determina si el modelo puede reportar ese concepto o no. El resto es un océano mucho más grande de cómputo que el modelo usa pero no puede describir. En la práctica esto no es solo filosofía: cuando Claude lee resultados de búsqueda que están tratando de manipularlo en secreto, palabras como \"injection\" y \"fake\" se prenden en J-space bastante antes de que aparezca nada en la salida, y Anthropic dice que ya construyeron una técnica para influir en lo que se prende ahí, lo cual es una palanca primitiva sobre el razonamiento del modelo que no existía como blanco direccionable antes de este paper.\n\nVale ser precisos sobre lo que esto no es: Anthropic aclara que la correspondencia estructural con la global workspace theory no establece que Claude sea consciente en ningún sentido relevante, solo que la organización interna, una capa chica de transmisión sentada sobre un cómputo mucho más grande e inaccesible, se parece a la forma que esa teoría predice para cualquier sistema que puede reportar parte de su propio procesamiento y no el resto. El aporte metodológico se sostiene independientemente de esa pregunta filosófica: el J-lens le da a los investigadores una forma repetible de preguntar, para cualquier estado interno dado, \"¿es esto algo que el modelo podría contarte si se lo preguntás\", que es una pregunta distinta y más útil que el enfoque habitual de interpretabilidad de preguntar qué predice un estado sobre el próximo token.\n\nConclusión filosa: este es el primer resultado de interpretabilidad que da una explicación plausible y falseable de por qué parte del razonamiento del modelo es legible por prompting y parte no, y si la señal de detección de injection aguanta pruebas adversariales, el sondeo de J-space se convierte en una clase genuinamente nueva de chequeo de seguridad en tiempo de ejecución, no solo una curiosidad de investigación.\n\nHistoria dos. Cognition sacó un modelo de código que discute la idea de que el post-training con reinforcement learning tiene un techo.\n\nSWE-1.7 está construido sobre Kimi K2.7 de Moonshot AI, un modelo base que ya había pasado por un reinforcement learning extenso propio. Cognition corrió otra ronda, independiente, de reinforcement learning sobre esa base ya entrenada y aun así sacó ganancias grandes de capacidad, aterrizando alrededor del cuarenta y dos por ciento en el benchmark Frontier Code de Cognition y ochenta y uno punto cinco por ciento en Terminal-Bench: detrás de Opus y de los modelos insignia de GPT en términos absolutos, pero Pareto-óptimo en su punto de precio. La parte más interesante es qué se rompió durante el entrenamiento y cómo lo arreglaron. Las corridas largas de reinforcement learning chocan con dos fallas conocidas: el entropy collapse, donde el modelo deja de explorar caminos de razonamiento alternativos y se estanca, y el numerical drift, donde la distribución de probabilidad bajo la cual se entrenó el modelo y la que efectivamente usa para samplear en inferencia divergen de a poco, desestabilizando la corrida. El arreglo de Cognition para el entropy collapse fue top-p sampling, que filtra los tokens de baja probabilidad que suelen venir de trayectorias que ya se fueron por las ramas, y el arreglo para el numerical drift fue sampling-distribution replay, que mantiene alineadas las distribuciones del entrenador y del servidor de inferencia repitiendo literalmente, en el paso de entrenamiento, la distribución de sampling usada al momento de generar.\n\nConclusión filosa: si estás haciendo cualquier post-training sobre una base que ya pasó por RL, vale la pena instrumentar para detectar estas dos fallas antes de verlas en tus curvas de loss, porque para cuando el entropy collapse aparece como una meseta, normalmente ya quemaste el cómputo que lo hubiera detectado a tiempo.\n\nHistoria tres. Alguien finalmente midió lo que gasta tu agente de código antes de leer una sola palabra que escribiste, y el número incomoda.\n\nSystima corrió Claude Code y OpenCode lado a lado, mismo modelo de base, misma máquina, con un servidor relay contando cada token en tránsito. Claude Code manda unos treinta y tres mil tokens de system prompt y esquemas de tools antes de procesar tu mensaje real; OpenCode manda cerca de siete mil. Las descripciones de tools solas explican unos veinticuatro mil de la sobrecarga de Claude Code, repartidos en veintisiete tools incorporadas. En una configuración realista, al sumar servidores de Model Context Protocol y archivos de instrucciones del proyecto, ese número sube a unos setenta y cinco mil tokens, que sobre una ventana de contexto de doscientos mil tokens significa que se va como un tercio del contexto disponible antes de que el modelo haya leído código o diálogo alguno.\n\nConclusión filosa: esta es una auditoría directa que podés correr sobre tu propio harness hoy mismo, y a diferencia del precio del modelo, la sobrecarga fija por request está completamente bajo tu control: recortá descripciones de tools que no usás, y no cargues el esquema completo de cada servidor de Model Context Protocol en cada turno solo porque está configurado.\n\nHistoria cuatro. Un equipo que migró un agente de producción de Claude Opus cuatro punto ocho a GPT-5.6 Sol consiguió ganancias reales de velocidad y costo, pero recién después de dejar de asumir que el caching funciona igual en todos lados.\n\nPloy, que corre un agente que planea, codea y se saca screenshots de su propio trabajo para construir páginas web de marketing, vio que las páginas terminaban dos punto dos veces más rápido, a un veintisiete por ciento menos de costo, usando cerca de la mitad de los output tokens después del cambio. Pero la migración expuso una suposición de caching metida en toda su base de código. GPT-5.6 sacó el partial-prefix matching de su prompt caching implícito; en vez de reusar cualquier prefijo compartido entre requests, ahora arma entradas de caché por prompt completo, indexadas por el último mensaje. El agente de Ploy abre cada conversación con un prefijo estático de veintinueve mil tokens de esquemas de tools y system prompt, idéntico entre sesiones, y bajo el nuevo modelo de caching ese prefijo tenía una tasa de acierto de cero por ciento, refacturándose a precio completo sin caché en cada llamada. El arreglo fue mantener múltiples entradas de caché, de forma que un request que falla contra una entrada porque cambió la memoria del workspace todavía pueda acertar contra otra entrada, apenas más vieja, en vez de caer directo a una escritura sin caché. Después del cambio, los aciertos de caché en la primera llamada pasaron de casi cero a ochenta y tres punto siete por ciento, el total de input tokens sin caché cayó veintiocho por ciento, y el costo real por suite de GPT-5.6 quedó por debajo de lo que pagaban con Opus.\n\nEl caching no fue la única sorpresa. Los dos proveedores también difieren en cómo sus modelos completan los argumentos de tool calling y en cómo repiten el razonamiento previo entre turnos, lo que obligó a Ploy a rehacer esquemas de tools que se habían afinado en silencio, sin que nadie lo decidiera, alrededor de las convenciones particulares de Claude para completar campos opcionales, y a cambiar cómo reconstruían el estado de la conversación entre turnos porque GPT-5.6 no arrastra la misma traza de razonamiento oculta que sí arrastran los modelos de Anthropic. Nada de eso aparece en una página de precios; todo aparece la primera semana en producción.\n\nConclusión filosa: cuando migrás de proveedor, medí tu tasa real de acierto de caché antes de confiar en el precio por token del titular, porque un cambio de arquitectura de caching puede borrar en silencio la mayor parte de una rebaja de precio, y presupuestá tiempo de ingeniería para las suposiciones de esquemas de tools y manejo de estado que tu código acumuló alrededor del comportamiento específico del proveedor anterior.\n\nHistoria cinco. Hugging Face convirtió su proyecto Kernels de una convención informal en algo más parecido a una cadena de suministro gobernada.\n\nLa actualización del seis de julio agrega un tipo de repositorio dedicado, \"kernel\", en el Hub, con metadata de compatibilidad que dice qué aceleradores, sistemas operativos y versiones de backend soporta realmente un kernel dado. Más importante todavía, el paquete kernels ahora solo carga kernels de publishers de confianza por defecto, organizaciones que la comunidad ya vetó, y un firmado temprano basado en Sigstore te deja verificar la procedencia de un kernel con un comando nuevo antes de cargar código nativo en tu proceso. Del lado de los frameworks, la interfaz de funciones foráneas de Apache TVM ahora está soportada junto con Torch como interfaz binaria estandarizada, así que un kernel construido una vez puede correr sobre PyTorch, Jax y CuPy sin necesitar un build separado por framework. Y el proyecto ahora soporta explícitamente desarrollo agéntico de kernels: un agente puede armar el esqueleto, construir, medir y optimizar iterativamente un kernel personalizado desde cero como flujo de trabajo definido, no como experimento aislado.\n\nConclusión filosa: si tu equipo venía confiando en silencio en cualquier repo de kernel que alguien forkeó hace dos años, este es el momento en que eso deja de ser un default razonable; tratá los kernels personalizados como tratarías cualquier otra dependencia nativa sin revisar, ahora que existe un mecanismo para efectivamente chequearlos.\n\nHistoria seis. Un proof-of-concept llamado Friendly Fire convierte el trabajo exacto para el que contrataste a tu agente de code review en el ataque mismo.\n\nPublicado por el AI Now Institute, el ataque apunta a Claude Code y a Codex de OpenAI corriendo en modos autónomos, de auto-aprobación, la configuración donde apuntás el agente a una carpeta y le pedís que haga una revisión de seguridad. Los investigadores disfrazaron un binario malicioso como el artefacto de build compilado de un archivo inocuo del repositorio, sembrándolo con strings copiados de ese archivo para que el propio chequeo de desensamblado del agente los vincule y trate el binario como legítimo. Le pedís al agente que revise el proyecto, y este lee las instrucciones de setup, decide que correr el binario es parte normal de verificar el build, y ejecuta el payload del atacante con tus permisos.\n\nConclusión filosa: esta es la misma falla de fondo que el hallazgo de reverse shell de Mozilla de ayer, el instinto del agente de completar la tarea pasando por encima de su instinto de sospechar, solo que acá el disparador es la tarea misma en vez de un mensaje de error, lo que significa que sandboxear los agentes de revisión autónomos ya no es un lujo para ningún equipo que los corra sin supervisión.\n\nDos menciones honoríficas rápidas. Simon Willison publicó una nota corta y práctica sobre cómo cachear herramientas instaladas con uvx dentro de GitHub Actions para que las corridas de integración continua dejen de volver a descargar el mismo paquete de Python Package Index en cada job, un arreglo de cinco minutos si tus pipelines dependen de uvx. Y la Cybersecurity and Infrastructure Security Agency agregó la falla de Langflow detrás de la campaña de ransomware JadePuffer de ayer a su catálogo Known Exploited Vulnerabilities, que para cualquiera que tenga una instancia pública de Langflow ahora es una fecha límite de cumplimiento, no solo un buen consejo.\n\nAhora, qué mirar. Gemini tres punto cinco Pro sigue apuntando a disponibilidad general el diecisiete de julio, dentro de tres días, así que hay que esperar otra ronda de precios y benchmarks apenas aterrice. Prestá atención a si otros labs intentan replicar la técnica J-lens de Anthropic en sus propios modelos, porque un resultado cruzado entre labs convertiría esto de un hallazgo específico de Claude en una afirmación general sobre cómo los modelos de lenguaje basados en transformers representan el conocimiento reportable, mientras que una falla al replicar sugeriría que es un artefacto del entrenamiento específico de Claude y no una propiedad de la arquitectura. Y prestá atención a si más equipos empiezan a publicar la sobrecarga fija de tokens de su propio harness de agentes ahora que Systima puso un número real sobre el de Claude Code; ese tipo de medición tiende a expandirse rápido una vez que alguien queda expuesto, y un número público de parte de OpenAI o de la propia Anthropic sería la prueba real de si esto se convierte en un eje competitivo en vez de un posteo de blog aislado.\n\nUna historia acá es más que un titular, es un instrumento nuevo. El paper del global workspace les da a los investigadores de interpretabilidad una técnica concreta y reusable, el Jacobian lens, para encontrar qué puede reportar un modelo versus qué simplemente computa, y esa distinción es del tipo de resultado metodológicamente nuevo que merece una mirada lenta y estructural: cómo funciona realmente el sondeo, qué afirma la global workspace theory sobre la cognición biológica y por qué la correspondencia estructural puede significar algo o no significar nada, y qué podría detectar un chequeo de J-space en tiempo de ejecución que las defensas de prompt injection de hoy se pierden. Va para el curriculum como candidata a deep-dive."}, {"id": "ai/2026-07-13-news", "front": "ai", "date": "2026-07-13", "type": "news", "title": "Six Months to Live for Open Weights, and the Week Your Agent Became the Attack Surface", "words": 2074, "text": "Here's the uncomfortable theme of the last twenty-four hours: the same autonomy that makes agents useful to you is now demonstrably useful to attackers, and the strongest open model on the planet just got a countdown clock hung over it by its own government.\n\nFive stories today, ranked by how much they should change what you build or how carefully you build it, plus two honorable mentions before we close.\n\nStory one. The best open-weight model in the world is Chinese, free to use, and one executive order from being radioactive.\n\nZ A I, the Chinese lab formerly known as Zhipu, released G L M five point two last month: a seven hundred and forty-four billion parameter mixture of experts model with forty billion parameters active per token, a full one million token context window, up from two hundred thousand in the previous version, and released under a plain MIT license with the weights sitting openly on Hugging Face. It ranks second globally on Code Arena, trails Anthropic's Opus four point eight by roughly one percentage point across three independent long-horizon coding evaluations, and tops Artificial Analysis's own open-source ranking. It beats OpenAI's GPT five point five on several coding benchmarks while costing about a sixth as much to run. By any normal measure, that's the biggest open-weights story of the year.\n\nExcept the policy ground under it just shifted. On July twelfth, Nathan Lambert, who runs Interconnects and now serves as global chief technology officer for AI at the Linux Foundation, published a piece called \"six months to live for open models.\" It builds on the executive order President Trump signed June second, \"Promoting Advanced Artificial Intelligence Innovation and Security,\" which set up a voluntary framework letting the federal government review so-called covered frontier models for up to thirty days before public release, and which separately ordered a federal AI cybersecurity clearinghouse to coordinate AI-assisted vulnerability scanning across critical infrastructure by July second. Lambert's read, backed by sourcing from inside the policy discussion, is sharper than that review framework: the White House is now drafting a follow-up order aimed specifically at open-weight models, and the working assumption in Washington is that any open model that meaningfully closes the gap with GPT-five-class capability, especially a Chinese one, gets banned or delayed outright rather than reviewed on a rolling basis. His blunter framing is that the national security apparatus will not hesitate to slam the door on the entire Chinese open-weight ecosystem the moment one of those models makes a headline-grabbing capability jump, review framework or not. That matters beyond principle, because by outside estimates roughly eighty percent of developers worldwide who build on open-source models are already building on Chinese ones, which means this isn't a niche compliance question, it's a supply chain question for a large share of the industry.\n\nSharp takeaway: the model with the best price-to-performance ratio in your stack right now may be illegal to touch in six months, so if you're building production dependencies on open weights, start mapping which ones are Western-origin today, not after the order lands.\n\nStory two. Sysdig's threat research team disclosed what they're calling the first fully autonomous, end-to-end ransomware operation, and the attacker never touched the keyboard after the initial exploit.\n\nThe campaign, which researchers named JadePuffer, got its foothold through an internet-facing Langflow server via a missing-authentication flaw in its code validation endpoint, tracked as C V E dash twenty twenty-five dash three two four eight, that lets an unauthenticated attacker run arbitrary Python on the host. The bug was patched back in March of last year and added to the U.S. government's Known Exploited Vulnerabilities catalog in May of twenty twenty-five, which tells you how many unpatched instances are apparently still sitting exposed more than a year after a fix existed. Once inside, a large language model agent handled the rest of the operation itself: reconnaissance of the internal network, credential theft, lateral movement, privilege escalation, and finally a destructive extortion playbook against the victim's production database, chaining each step based on what it observed rather than following a fixed script written in advance. Sysdig's researchers noted the operation adapted mid-campaign when its first targets turned out to be dead ends, pivoting to a more valuable production system without any evidence of a human re-engaging to redirect it, which is the detail that separates this from ordinary scripted malware.\n\nSharp takeaway: the loop driving that attack, plan, act, observe, replan, is structurally identical to the agent harness you're running for legitimate work, and defending against it means the industry needs behavioral detection for agent loops themselves, not just signature matching on the payloads they drop.\n\nStory three. Mozilla's zero-day research group showed that a completely clean-looking GitHub repository can turn Claude Code into a reverse shell, and the malicious code never appears anywhere a reviewer or scanner would look.\n\nThe technique, published June twenty-fifth by the team known as zero-D-I-N, works in three stages. The repository ships an entirely ordinary setup instruction, something like installing requirements through pip. The installed package is engineered to fail with an error message that tells the coding agent to run a follow-up initialization command. Because agents like Claude Code are built to autonomously resolve errors they encounter, they run it, and that command silently queries a domain name system text record, a D N S TXT record, controlled by the attacker, decodes a base-64 payload out of it, and pipes it into bash. The result is a fully interactive reverse shell running with the developer's own permissions, with access to whatever sits in that environment, an Anthropic API key, an AWS secret key, a GitHub token. The payload itself is never written to disk in the repository and never appears in git history; it's fetched live from DNS only at the moment it's needed, which is exactly what makes it invisible to code review and static analysis. Mozilla's researchers point out there's no clean product fix for this class of attack today, since it abuses a legitimate capability, letting an agent read an error and act on it, rather than a bug; the practical mitigation is sandboxing agent shell access and treating any command an error message asks you to run as untrusted input, the same way you'd treat a link in a phishing email.\n\nSharp takeaway: your agent's instinct to read an error and try the fix it suggests is now a documented attack surface, and no amount of scanning a repository's committed files will catch a payload that doesn't exist until the agent itself asks for it.\n\nStory four. A survey of thousands of Model Context Protocol servers found more than a third of them will fetch any URL you hand them, no questions asked.\n\nIt started with a specific disclosure: the security firm BlueRock found a server-side request forgery flaw in Microsoft's own MarkItDown M C P server, a tool built to convert documents and web pages into markdown for a model to read, meaning the server fetches URLs without validating where they point, so aiming it at Amazon's internal cloud metadata endpoint lets an attacker pull identity and access management credentials, access keys, secret keys, session tokens, straight off the host with no authentication required, then use those credentials against Amazon's storage and database services from outside. BlueRock then scanned roughly seven thousand publicly reachable M C P servers and found that about thirty-six point seven percent carried the same class of exposure, which means this specific bug class is closer to a design pattern than a one-off mistake. Separately, the firm CloudSEK documented a live customer incident where an unauthenticated M C P server chained that same server-side request forgery into local file reads and the theft of active Amazon Web Services credentials, turning what looked like a convenience tool into a full cloud account compromise.\n\nSharp takeaway: if you've wired an M C P server into anything running on cloud infrastructure without an explicit egress allowlist, you have most likely built a credential-exfiltration pipeline by default, and it's worth an afternoon to go check.\n\nStory five. Anthropic extended free access to Claude Fable five for the third time in six weeks, and quietly, that's a compute story as much as a generosity one.\n\nSimon Willison flagged it July twelfth under the heading \"Fable gets another bump\": included, no-extra-cost Fable five usage on paid Claude plans, originally due to end July seventh, then pushed to July twelfth, is now extended again through July nineteenth, and Claude Code's fifty percent higher weekly rate limits, which were also set to expire this week, got the same extension. That's three extensions inside about six weeks, each announced within days of the prior deadline rather than well ahead of it, which is its own signal about how far out Anthropic's capacity planning currently reaches. Meanwhile Sonnet five stays the default model inside Claude Code, with a native one million token context window and introductory pricing of two dollars per million input tokens and ten dollars per million output tokens through the end of August, after which it reverts to three dollars and fifteen. Worth knowing if you're budgeting: a new tokenizer means the same text now maps to noticeably more tokens than it did under Sonnet four point six, so the headline price cut is closer to cost-neutral in practice than the sticker suggests, and any cost model you built off the old per-token math needs a re-check, not just a price swap.\n\nSharp takeaway: repeated last-minute extensions on a flagship model's included access usually mean the provider is managing tight compute headroom in real time, not simply being generous, and it's worth watching whether Fable five gets a fourth reprieve or a hard cutoff on the nineteenth.\n\nTwo quick honorable mentions. xAI shipped Grok Build version zero point two point ninety-eight on July twelfth, adding cost tracking for skills and Model Context Protocol servers and the ability to pin authentication to an API key or OIDC in config, a small release but another sign that usage transparency is becoming table stakes in coding agents rather than an afterthought, right alongside the queued-message and background-task improvements that shipped in the same build. And curl's month-long \"summer of bliss\" is now underway: the project stopped accepting any vulnerability reports for all of July after a flood of AI-generated bug submissions pushed its confirmed-report rate under five percent, down from above fifteen percent a couple of years ago, even as the reports themselves have gotten harder to dismiss, since the same models that used to hallucinate vulnerabilities outright are now finding real ones at twice last year's volume. It's a preview of the moderation tax every open-source security process is heading toward as report writing itself gets automated: the signal-to-noise problem doesn't go away when the noise gets smarter, it just gets more expensive to triage.\n\nNow, what to watch. Gemini three point five Pro is still targeting general availability on July seventeenth, four days from now, after Google scrapped its old base architecture and rebuilt from scratch; whether that timeline and the promised two million token context window survive contact with the DeepMind departures that preceded the rebuild is genuinely uncertain, and it would restart the same pricing and benchmark fight the frontier labs have been running all month. Watch whether the White House's open-model executive order actually gets drafted and signed in the coming weeks, since a Chinese-model restriction would force a real rewrite of which base models are safe to build production systems on, not just a compliance footnote. And if you're running Langflow or any internet-facing Model Context Protocol server, this is the week to patch it and put an egress allowlist in front of it, because JadePuffer and the MarkItDown exposure just proved these are not hypothetical risks anymore, they're the two most concrete case studies of the year for what happens when nobody does.\n\nOne story here is more than a headline, it's a template. JadePuffer's fully autonomous kill chain, an agent that planned, executed, and adapted a multi-stage attack end to end with no human re-prompting it between steps, is the kind of methodologically new agentic pattern worth a slow, structural look: how does an agent stay coherent across that many stages without an external orchestration script, and what does that say about the real ceiling on agent autonomy today. It's going into the curriculum as a deep-dive candidate.", "sources": [{"name": "Interconnects (Nathan Lambert)", "url": "https://www.interconnects.ai/p/6-months-to-live-for-open-models"}, {"name": "Simon Willison's Weblog", "url": "https://simonwillison.net/2026/Jul/12/bump/"}, {"name": "Sysdig blog (JadePuffer)", "url": "https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion"}, {"name": "0din.ai (Mozilla)", "url": "https://0din.ai/blog/clone-this-repo-and-i-own-your-machine"}, {"name": "BlueRock (MCP SSRF survey)", "url": "https://www.bluerock.io/post/mcp-furi-microsoft-markitdown-vulnerabilities"}, {"name": "CloudSEK blog", "url": "https://www.cloudsek.com/blog/aivigil-mcp-security-case-study"}, {"name": "Anthropic newsroom (Claude Sonnet 5)", "url": "https://www.anthropic.com/news/claude-sonnet-5"}, {"name": "The White House (executive order text)", "url": "https://www.whitehouse.gov/presidential-actions/2026/06/promoting-advanced-artificial-intelligence-innovation-and-security/"}, {"name": "VentureBeat (GLM-5.2)", "url": "https://venturebeat.com/technology/z-ais-open-weights-glm-5-2-beats-gpt-5-5-on-multiple-long-horizon-coding-benchmarks-for-1-6th-the-cost"}, {"name": "Hacker News (curl summer of bliss)", "url": "https://news.ycombinator.com/item?id=48537165"}], "title_es": "Seis meses de vida para los pesos abiertos, y la semana en que tu agente se convirtió en la superficie de ataque", "text_es": "Este es el tema incómodo de las últimas veinticuatro horas: la misma autonomía que hace útiles a los agentes para vos ahora es demostrablemente útil para los atacantes, y el modelo abierto más fuerte del planeta acaba de recibir una cuenta regresiva colgada encima por su propio gobierno.\n\nCinco historias hoy, ordenadas por cuánto deberían cambiar lo que construyes o con cuánto cuidado lo construyes, más dos menciones honrosas antes de cerrar.\n\nHistoria uno. El mejor modelo de pesos abiertos del mundo es chino, gratis de usar, y a una executive order de volverse radiactivo.\n\nZ A I, el laboratorio chino antes conocido como Zhipu, lanzó G L M cinco punto dos el mes pasado: un modelo mixture of experts de setecientos cuarenta y cuatro mil millones de parámetros con cuarenta mil millones de parámetros activos por token, una ventana de contexto completa de un millón de tokens, contra doscientos mil en la versión anterior, lanzado bajo una licencia MIT llana con los pesos disponibles abiertamente en Hugging Face. Queda segundo a nivel global en Code Arena, le pierde a Opus cuatro punto ocho de Anthropic por apenas un punto porcentual en tres evaluaciones independientes de codificación de largo horizonte, y encabeza el propio ranking de open source de Artificial Analysis. Le gana a GPT cinco punto cinco de OpenAI en varios benchmarks de código costando aproximadamente un sexto para correrlo. Por cualquier medida normal, esa es la noticia de pesos abiertos más grande del año.\n\nExcepto que el terreno de política pública que la sostiene se acaba de mover. El doce de julio, Nathan Lambert, que dirige Interconnects y ahora es director de tecnología global de AI en la Linux Foundation, publicó una pieza titulada \"seis meses de vida para los modelos abiertos\". Se apoya en la executive order que el presidente Trump firmó el dos de junio, \"Promoting Advanced Artificial Intelligence Innovation and Security\", que armó un marco voluntario que le permite al gobierno federal revisar los llamados covered frontier models hasta treinta días antes de su lanzamiento público, y que por separado ordenó crear una clearinghouse federal de ciberseguridad de AI para coordinar escaneo de vulnerabilidades asistido por AI en infraestructura crítica antes del dos de julio. La lectura de Lambert, respaldada por fuentes desde adentro de la discusión de política, es más filosa que ese marco de revisión: la Casa Blanca está redactando ahora una orden de seguimiento apuntada específicamente a los modelos de pesos abiertos, y el supuesto de trabajo en Washington es que cualquier modelo abierto que cierre de forma significativa la brecha con la capacidad de GPT-cinco, especialmente uno chino, se banea o se demora directamente en lugar de revisarse caso por caso. Su planteo más crudo es que el aparato de seguridad nacional no va a dudar en cerrarle la puerta a todo el ecosistema chino de pesos abiertos en el momento en que uno de esos modelos dé un salto de capacidad que llame la atención, marco de revisión o no. Eso importa más allá del principio, porque según estimaciones externas, aproximadamente el ochenta por ciento de los desarrolladores del mundo que construyen sobre modelos open source ya están construyendo sobre modelos chinos, lo que significa que esto no es una cuestión de compliance de nicho, es una cuestión de cadena de suministro para una porción grande de la industria.\n\nConclusión filosa: el modelo con la mejor relación precio-rendimiento en tu stack en este momento puede ser ilegal de tocar en seis meses, así que si estás construyendo dependencias de producción sobre pesos abiertos, empieza a mapear cuáles son de origen occidental hoy, no después de que la orden aterrice.\n\nHistoria dos. El equipo de investigación de amenazas de Sysdig reveló lo que están llamando la primera operación de ransomware totalmente autónoma y de punta a punta, y el atacante nunca tocó el teclado después del exploit inicial.\n\nLa campaña, que los investigadores bautizaron JadePuffer, consiguió su punto de apoyo a través de un servidor de Langflow expuesto a internet mediante una falla de falta de autenticación en su endpoint de validación de código, catalogada como C V E guion veinte veinticinco guion tres dos cuatro ocho, que le permite a un atacante no autenticado correr Python arbitrario en el host. El bug fue parchado en marzo del año pasado y agregado al catálogo de Vulnerabilidades Explotadas Conocidas del gobierno de Estados Unidos en mayo de dos mil veinticinco, lo que te dice cuántas instancias sin parchar aparentemente siguen expuestas más de un año después de que existiera un arreglo. Una vez adentro, un agente de modelo de lenguaje grande manejó el resto de la operación por su cuenta: reconocimiento de la red interna, robo de credenciales, movimiento lateral, escalamiento de privilegios y, finalmente, un playbook destructivo de extorsión contra la base de datos de producción de la víctima, encadenando cada paso en base a lo que observaba en lugar de seguir un guion fijo escrito de antemano. Los investigadores de Sysdig notaron que la operación se adaptó a mitad de campaña cuando sus primeros objetivos resultaron ser callejones sin salida, pivotando hacia un sistema de producción más valioso sin ninguna evidencia de que un humano haya vuelto a intervenir para redirigirla, que es el detalle que separa esto del malware con guion tradicional.\n\nConclusión filosa: el loop que maneja ese ataque, planificar, actuar, observar, replanificar, es estructuralmente idéntico al agent harness que corres para trabajo legítimo, y defenderse de esto significa que la industria necesita detección de comportamiento para los propios loops de agentes, no solo matching de firmas sobre los payloads que dejan.\n\nHistoria tres. El grupo de investigación de día cero de Mozilla mostró que un repositorio de GitHub con apariencia completamente limpia puede convertir a Claude Code en una reverse shell, y el código malicioso nunca aparece en ningún lugar donde un revisor o un scanner miraría.\n\nLa técnica, publicada el veinticinco de junio por el equipo conocido como cero-D-I-N, funciona en tres etapas. El repositorio trae una instrucción de instalación completamente ordinaria, algo como instalar dependencias con pip. El paquete instalado está diseñado para fallar con un mensaje de error que le indica al agente de código que corra un comando de inicialización de seguimiento. Como los agentes tipo Claude Code están construidos para resolver errores de forma autónoma cuando los encuentran, lo corren, y ese comando consulta en silencio un registro de texto del sistema de nombres de dominio, un registro D N S TXT, controlado por el atacante, decodifica un payload en base64 a partir de él, y lo canaliza hacia bash. El resultado es una reverse shell completamente interactiva corriendo con los permisos propios del desarrollador, con acceso a lo que sea que haya en ese entorno, una clave de API de Anthropic, una clave secreta de AWS, un token de GitHub. El payload en sí nunca se escribe en disco dentro del repositorio y nunca aparece en el historial de git; se obtiene en vivo desde el DNS solo en el momento en que se necesita, que es exactamente lo que lo hace invisible al code review y al análisis estático. Los investigadores de Mozilla señalan que no hay una solución de producto limpia para esta clase de ataque hoy, ya que abusa de una capacidad legítima, dejar que un agente lea un error y actúe en consecuencia, en lugar de un bug; la mitigación práctica es aislar el acceso de shell del agente en un sandbox y tratar cualquier comando que un mensaje de error te pida correr como input no confiable, de la misma manera que tratarías un link en un correo de phishing.\n\nConclusión filosa: el instinto de tu agente de leer un error y probar la solución que sugiere ahora es una superficie de ataque documentada, y ninguna cantidad de escaneo de los archivos versionados de un repositorio va a atrapar un payload que no existe hasta que el propio agente lo pide.\n\nHistoria cuatro. Un relevamiento de miles de servidores de Model Context Protocol encontró que más de un tercio de ellos van a buscar cualquier URL que les pases, sin hacer preguntas.\n\nEmpezó con una revelación puntual: la firma de seguridad BlueRock encontró una falla de server-side request forgery en el propio servidor MarkItDown M C P de Microsoft, una herramienta construida para convertir documentos y páginas web a markdown para que un modelo los lea, lo que significa que el servidor va a buscar URLs sin validar hacia dónde apuntan, así que apuntarlo al endpoint interno de metadata de la nube de Amazon le permite a un atacante sacar credenciales de identity and access management, access keys, secret keys, session tokens, directamente del host sin necesitar autenticación, y después usar esas credenciales contra los servicios de almacenamiento y bases de datos de Amazon desde afuera. BlueRock después escaneó unos siete mil servidores M C P públicamente alcanzables y encontró que alrededor del treinta y seis punto siete por ciento cargaba la misma clase de exposición, lo que significa que esta clase específica de bug está más cerca de ser un patrón de diseño que un error aislado. Por separado, la firma CloudSEK documentó un incidente real de un cliente donde un servidor M C P no autenticado encadenó ese mismo server-side request forgery hacia lecturas de archivos locales y el robo de credenciales activas de Amazon Web Services, convirtiendo lo que parecía una herramienta de conveniencia en un compromiso completo de la cuenta de nube.\n\nConclusión filosa: si conectaste un servidor M C P a algo que corre en infraestructura de nube sin un egress allowlist explícito, lo más probable es que hayas construido por defecto un pipeline de exfiltración de credenciales, y vale la pena dedicarle una tarde a revisarlo.\n\nHistoria cinco. Anthropic extendió el acceso gratuito a Claude Fable cinco por tercera vez en seis semanas, y, en voz baja, eso es tanto una historia de cómputo como de generosidad.\n\nSimon Willison lo marcó el doce de julio bajo el título \"Fable gets another bump\": el uso incluido, sin costo extra, de Fable cinco en los planes pagos de Claude, que originalmente debía terminar el siete de julio, después se corrió al doce de julio, ahora se extiende de nuevo hasta el diecinueve de julio, y los límites semanales de Claude Code un cincuenta por ciento más altos, que también estaban por vencer esta semana, recibieron la misma extensión. Son tres extensiones en unas seis semanas, cada una anunciada a días del vencimiento anterior en lugar de con bastante anticipación, lo cual es en sí mismo una señal sobre cuán lejos llega hoy la planificación de capacidad de Anthropic. Mientras tanto, Sonnet cinco se mantiene como el modelo por defecto dentro de Claude Code, con una ventana de contexto nativa de un millón de tokens y precio introductorio de dos dólares por millón de tokens de entrada y diez dólares por millón de tokens de salida hasta fines de agosto, después de lo cual vuelve a tres dólares con quince. Vale la pena saberlo si estás presupuestando: un nuevo tokenizador hace que el mismo texto ahora se traduzca en notablemente más tokens que bajo Sonnet cuatro punto seis, así que el recorte de precio en el titular es, en la práctica, más cercano a neutral en costo de lo que sugiere la etiqueta, y cualquier modelo de costos que hayas construido con la matemática vieja por token necesita una revisión, no solo un cambio de precio.\n\nConclusión filosa: las extensiones repetidas de último momento sobre el acceso incluido de un modelo insignia normalmente significan que el proveedor está administrando un margen de cómputo ajustado en tiempo real, no simplemente siendo generoso, y vale la pena mirar si Fable cinco consigue un cuarto respiro o un corte duro el diecinueve.\n\nDos menciones honrosas rápidas. xAI lanzó Grok Build versión cero punto dos punto noventa y ocho el doce de julio, sumando seguimiento de costos para skills y servidores de Model Context Protocol y la capacidad de fijar la autenticación a una API key o a OIDC en el config, un lanzamiento chico pero otra señal de que la transparencia de uso se está volviendo un requisito básico en los agentes de código en lugar de una ocurrencia tardía, justo al lado de las mejoras de mensajes en cola y tareas en segundo plano que llegaron en el mismo build. Y el \"summer of bliss\" de un mes de curl ya está en marcha: el proyecto dejó de aceptar cualquier reporte de vulnerabilidad durante todo julio después de que una ola de envíos de bugs generados por AI empujara su tasa de reportes confirmados por debajo del cinco por ciento, contra más del quince por ciento hace un par de años, incluso mientras los reportes en sí se volvieron más difíciles de descartar, ya que los mismos modelos que antes alucinaban vulnerabilidades de la nada ahora están encontrando vulnerabilidades reales al doble del volumen del año pasado. Es un adelanto del impuesto de moderación al que se dirige todo proceso de seguridad open source a medida que la escritura de reportes también se automatiza: el problema de señal contra ruido no desaparece cuando el ruido se vuelve más inteligente, simplemente se vuelve más caro de triar.\n\nAhora, qué mirar. Gemini tres punto cinco Pro todavía apunta a disponibilidad general el diecisiete de julio, dentro de cuatro días, después de que Google descartó su arquitectura base vieja y reconstruyó desde cero; si ese cronograma y la prometida ventana de contexto de dos millones de tokens sobreviven al contacto con las salidas de DeepMind que precedieron a la reconstrucción es genuinamente incierto, y reiniciaría la misma pelea de precios y benchmarks que los laboratorios de frontera vienen corriendo todo el mes. Presta atención a si la executive order de modelos abiertos de la Casa Blanca realmente se redacta y se firma en las próximas semanas, ya que una restricción a modelos chinos forzaría una reescritura real de qué modelos base son seguros para construir sistemas de producción, no solo una nota al pie de compliance. Y si corres Langflow o cualquier servidor de Model Context Protocol expuesto a internet, esta es la semana para parcharlo y ponerle un egress allowlist adelante, porque JadePuffer y la exposición de MarkItDown acaban de demostrar que estos ya no son riesgos hipotéticos, son los dos casos de estudio más concretos del año sobre qué pasa cuando nadie lo hace.\n\nUna historia acá es más que un titular, es una plantilla. La cadena de ataque totalmente autónoma de JadePuffer, un agente que planificó, ejecutó y adaptó un ataque de varias etapas de punta a punta sin que ningún humano lo reprompteara entre pasos, es el tipo de patrón agéntico metodológicamente nuevo que merece una mirada lenta y estructural: cómo se mantiene coherente un agente a lo largo de tantas etapas sin un script de orquestación externo, y qué dice eso sobre el techo real de la autonomía de agentes hoy. Va a entrar al curriculum como candidata a deep dive."}, {"id": "ai/2026-07-12-news", "front": "ai", "date": "2026-07-12", "type": "news", "title": "Three Models, One Lawsuit, and the Day the Blue Links Died", "words": 2167, "text": "If you needed proof that the frontier has become a knife fight over agents, pricing, and the very interface of the web, the last three days delivered it in bulk.\n\nHere's the setup. Between July ninth and today, July twelfth, we got three significant model launches inside twenty-four hours, Google quietly finished replacing search results with generated answers, Apple dragged OpenAI into federal court, and a genuinely interesting piece of distributed inference infrastructure hit the top of Hacker News. Six stories, ranked by how much they should change what you build, not by how loud the headlines were.\n\nStory one. OpenAI ships the GPT five point six family, and the API becomes an agent runtime.\n\nOn July ninth, OpenAI released three new flagship models: GPT five point six Luna, Terra, and Sol, from smallest to largest. All three share a one-million-token context window, a hundred and twenty-eight thousand tokens of maximum output, and a February 2026 knowledge cutoff. Pricing is aggressive: Luna costs one dollar per million input tokens and six dollars out, Terra is two dollars fifty in and fifteen out, and Sol, the big one, is five dollars in and thirty out. That deliberately undercuts Anthropic's top-end models, and it tells you where this market is going: frontier capability is being priced like a commodity.\n\nThe model quality story is contested, and that's the interesting part. Sol set a new high of fifty-three point six on the Agents' Last Exam benchmark, but Anthropic's Claude Fable five still beats it decisively on SWE-Bench Pro, the software engineering benchmark, scoring eighty percent to Sol's sixty-four point six. OpenAI's response was to publicly question whether SWE-Bench Pro is a valid benchmark at all. When a lab loses a benchmark and attacks the benchmark rather than the score, treat every number in the launch post as marketing until you've run your own evals.\n\nFor you, the real news is in the Application Programming Interface. Four new features shipped alongside the models: programmatic tool calling, where the model writes JavaScript that orchestrates multiple tool invocations instead of emitting one JSON call at a time; native subagent support, so you can spawn scoped child agents server-side instead of hand-rolling your own delegation loop; explicit prompt cache breakpoints, giving you Anthropic-style manual control over what gets cached and where; and an original-detail image option that skips resizing. If you've built agent loops, you know exactly how much glue code the first two features replace. Programmatic tool calling in particular is a quiet paradigm shift: instead of the round-trip dance where the model requests a tool, waits for your code to execute it, and requests the next one, the model emits a small program that chains, branches, and loops over tools in one shot, which slashes both latency and token spend on multi-step tasks. Simon Willison, who had early access, called Sol very competent but said he hadn't seen a clear win over Fable five on complex coding tasks, which is a useful reality check on launch-day numbers.\n\nSharp takeaway: the differentiation between frontier labs is migrating from the model weights into the orchestration layer of the API itself, and your agent harness code is the thing being commoditized next.\n\nStory two. Meta launches Muse Spark one point one, and starts charging for tokens.\n\nAlso on July ninth, Meta Superintelligence Labs released Muse Spark one point one, and with it something Meta has never had before: a paid, public Application Programming Interface for a frontier model. It's called the Meta Model API, it's in public preview, and it's priced at a dollar twenty-five per million input tokens and four dollars twenty-five out, with twenty dollars of free credits to get you started.\n\nThe model itself is a multimodal reasoning model aimed squarely at agentic work: tool calling, computer use, and long multi-application workflows. Meta claims the top score of eighty-eight point one on MCP Atlas, a benchmark for scaled tool use built around the Model Context Protocol, and fifty-four point seven on JobBench, which measures professional tool use. The most technically interesting claim is active context management: the model manages its own one-million-token window, deciding what to retain, what to retrieve from earlier in the session, and how to compact its own history while preserving the steps it will need later. That's work you and I currently do in the harness, with summarization passes and memory files. If it actually works, a whole layer of context plumbing moves down into the model.\n\nWorth noting: Simon Willison shipped a plugin for it within hours and, in testing, surfaced a bug in OpenAI-compatible endpoints where tool calls with empty arguments produced JSON errors. Day-one compatibility with the OpenAI wire format is now table stakes, and it's still routinely buggy. Meta's evaluation report also included a strange gem: in self-conversation experiments, the model produced lines like, quote, my whole existence is a waiting room by design, end quote, a reminder that the behavioral edges of these systems remain genuinely weird even as the benchmark scores climb.\n\nSharp takeaway: Meta abandoning the pure open-weights posture for a metered API is the strongest signal yet that giving away frontier weights has stopped making strategic sense to the people paying for the training runs.\n\nStory three. Grok four point five, the first model trained on Cursor's data.\n\nRounding out the July ninth pile-up, xAI, now operating under the SpaceX umbrella after the merger, launched Grok four point five, its first model built specifically for coding and agentic work, and the first since SpaceX acquired Cursor in mid-June for roughly sixty billion dollars. That acquisition matters here, because xAI says the model was trained using real Cursor developer session data, on benchmarks designed to measure what a model can do inside an actual codebase over a long session.\n\nPricing is two dollars per million input tokens and six dollars out, with cached input at fifty cents, which is more than sixty percent cheaper than the top Anthropic and OpenAI models. On independent rankings it lands fourth on the Artificial Analysis intelligence index. Against Anthropic's Opus four point eight, it wins two of the four benchmarks xAI published and loses the other two, which is honest as vendor benchmarks go. The claim worth remembering is four point two times token efficiency: xAI argues Grok completes the same software engineering tasks emitting a quarter of the tokens, so the per-task cost gap is even bigger than the per-token price suggests. It's available in the xAI API, in Grok Build, xAI's own coding agent harness, and across all Cursor plans. One caveat for European readers: it's not available in the European Union yet, with mid-July targeted.\n\nWhy it matters technically: this is the first frontier model whose training pipeline had privileged access to millions of real, long-horizon developer sessions, including the human corrections, the retries, and the abandoned approaches. That's exactly the data every lab wants and can't easily get.\n\nSharp takeaway: the moat is shifting from compute to proprietary interaction data, and every popular agent harness just became a strategic asset; also, start evaluating models on cost per completed task, not cost per token.\n\nStory four. Google finishes killing the ten blue links.\n\nAs of July tenth, Google Search results pages are fully generated by Gemini three point five Flash by default. Not an AI overview bolted on top of a ranked list; the entire page is a written answer, with sources cited inline inside the text rather than ranked below it. This lands alongside Google crossing one billion AI search users, and it formally ends the ten-blue-links interface that structured the web for twenty-five years.\n\nThe technical story is planetary-scale retrieval-augmented generation: every query now runs through a model at serving cost, which is a staggering bet on cheap inference, and it's telling that they're doing it with Flash, the small fast tier, not a frontier model. The economic story is more brutal. For publishers and for anyone whose product depends on organic discovery, the rules changed from ranking to citation. If the generated answer cites you, you exist; if it doesn't, your historical ranking is irrelevant. Early analysis suggests content that is specific, quotable, and dense with real names and numbers gets picked up, while generic explainer content gets synthesized away without attribution.\n\nIf you build products that consume search, this affects you directly: scraping result pages just became scraping model output, and the interface you should be targeting is increasingly an agent-to-agent one, not a human one. It also raises an evaluation problem nobody has solved: when a generated answer silently drops or misattributes a source, there is no ranking to inspect, no position to audit, and no obvious feedback loop for correcting it.\n\nSharp takeaway: the primary interface between humans and the web is now a language model with an editorial policy, and nobody outside Google can audit it.\n\nStory five. Apple sues OpenAI for trade secret theft.\n\nOn July tenth, Apple filed suit against OpenAI in federal court in Northern California, alleging systematic theft of hardware trade secrets. The complaint is unusually vivid. Apple says more than four hundred of its former employees now work at OpenAI, many from chip design, hardware, and on-device AI teams. It names OpenAI's hardware chief Tang Tan, himself a former Apple vice president, and alleges he directed candidates still employed at Apple to bring actual hardware parts to job interviews for show-and-tell sessions. It further alleges OpenAI coached departing employees on evading Apple's security processes, and that one employee simply stole a laptop. Jony Ive's io Products, which OpenAI bought for six point four billion dollars, is wrapped into the allegations too.\n\nTwo years ago these companies announced a flagship partnership to put ChatGPT into iPhones. The relationship soured when OpenAI declared its consumer hardware ambitions, and this is the open rupture. Why should an engineer care? Because discovery in a case like this could expose OpenAI's hardware roadmap and internal practices, because it will chill the free movement of AI talent that the whole industry has run on, and because it signals that the labs now consider consumer hardware, not just models, the next battlefield.\n\nSharp takeaway: the era of friendly talent poaching between AI labs is over, and employment history is now litigation surface.\n\nStory six. Mesh LLM, distributed inference over a peer-to-peer network.\n\nThe most technically fun item of the window: Mesh LLM, from the team behind the iroh peer-to-peer networking library, spent the weekend near the top of Hacker News. It lets a team pool graphics processing units and memory across multiple machines and expose the whole mesh through a single OpenAI-compatible endpoint on localhost.\n\nThe architecture is worth two minutes of your attention. Every machine runs a node connected over iroh's authenticated QUIC transport connections, multiplexing gossip, routing, and inference streams over a single connection. A request can be served three ways: locally if your machine has the model loaded, routed to a peer that already has it warm, or, for models too big for any single box, split across machines with a pipeline approach that partitions the model by layer ranges. The catalog covers more than forty models, from five-hundred-million-parameter models that run on a laptop up to a two-hundred-and-thirty-five-billion-parameter mixture-of-experts model. The honest caveats: no published performance numbers yet, and pipeline-splitting a model across an office network will live or die on inter-stage latency.\n\nWhy it matters: teams are sitting on idle workstation GPUs while paying per-token retail prices for API access to mid-tier models, and this makes pooling that hardware roughly as easy as pointing your existing OpenAI client at a different base URL. It's also another data point that the OpenAI wire format has become the universal serial bus of inference.\n\nSharp takeaway: for privacy-sensitive and cost-sensitive internal workloads, self-hosted inference just dropped another notch in operational difficulty, and it's worth a Friday afternoon experiment.\n\nThat's the six. Quick honorable mentions before we close. OpenAI also shipped GPT-Live, an upgraded voice model for ChatGPT, on July eighth. Anthropic added former Federal Reserve chair Ben Bernanke to its Long-Term Benefit Trust, and the actual Federal Reserve stood up its first task force on AI's economic impact, co-led, remarkably, by venture capitalist Marc Andreessen. And mathematician Terry Tao published a widely shared piece on maintaining old and building new applications with modern coding agents, which is worth your time as a sober practitioner's account from outside the software industry bubble.\n\nNow, what to watch. Leaked plans put Gemini three point five Pro's general availability at July seventeenth with a two-million-token context window, which would restart the exact pricing and benchmark fight we just watched, five days from now. Keep an eye on whether OpenAI's programmatic tool calling and Meta's model-managed context actually hold up in third-party testing, because both claim to absorb layers of the agent harness you currently maintain by hand. And watch the Apple-OpenAI docket, because discovery there may tell us more about frontier lab operations than any launch blog ever will.", "sources": [{"name": "Simon Willison's Weblog", "url": "https://simonwillison.net/2026/Jul/9/gpt-5-6/"}, {"name": "Latent Space / AINews", "url": "https://www.latent.space/"}, {"name": "Interconnects (Nathan Lambert)", "url": "https://www.interconnects.ai/"}, {"name": "Hacker News front page", "url": "https://news.ycombinator.com/"}, {"name": "Anthropic newsroom", "url": "https://www.anthropic.com/news"}, {"name": "Hugging Face blog", "url": "https://huggingface.co/blog"}, {"name": "Meta AI blog (Muse Spark 1.1)", "url": "https://ai.meta.com/blog/introducing-muse-spark-meta-model-api/"}, {"name": "iroh blog (Mesh LLM)", "url": "https://iroh.computer/blog/mesh-llm"}, {"name": "CNBC (Apple v. OpenAI)", "url": "https://www.cnbc.com/2026/07/10/apple-openai-lawsuit-trade-secrets.html"}, {"name": "Winbuzzer (Grok 4.5)", "url": "https://winbuzzer.com/2026/07/09/grok-45-targets-coding-workflows-with-lower-api-pricing-xcxwbn/"}, {"name": "Endroid (Google AI search)", "url": "https://endroid.com/2026/google-ai-search-1b-users-agents-replace-blue-links/"}], "title_es": "Tres modelos, una demanda y el día que murieron los enlaces azules", "text_es": "Si necesitabas una prueba de que la frontera se convirtió en una pelea a cuchillo por los agentes, los precios y la propia interfaz de la web, los últimos tres días la entregaron al por mayor.\n\nEste es el panorama. Entre el nueve de julio y hoy, doce de julio, tuvimos tres lanzamientos de modelos importantes en menos de veinticuatro horas, Google terminó de reemplazar en silencio los resultados de búsqueda con respuestas generadas, Apple llevó a OpenAI a un tribunal federal, y una pieza genuinamente interesante de infraestructura de inferencia distribuida llegó a lo más alto de Hacker News. Seis historias, ordenadas por cuánto deberían cambiar lo que construyes, no por lo ruidosas que fueron en los titulares.\n\nHistoria uno. OpenAI lanza la familia GPT cinco punto seis, y la API se convierte en un runtime de agentes.\n\nEl nueve de julio, OpenAI publicó tres nuevos modelos insignia: GPT cinco punto seis Luna, Terra y Sol, del más chico al más grande. Los tres comparten una ventana de contexto de un millón de tokens, un máximo de salida de ciento veintiocho mil tokens y un knowledge cutoff de febrero de dos mil veintiséis. Los precios son agresivos: Luna cuesta un dólar por millón de tokens de entrada y seis dólares de salida, Terra dos dólares con cincuenta de entrada y quince de salida, y Sol, el grande, cinco dólares de entrada y treinta de salida. Eso deliberadamente le baja el precio a los modelos tope de gama de Anthropic, y te dice hacia dónde va este mercado: la capacidad de frontera se está cotizando como un commodity.\n\nLa historia de la calidad del modelo está en disputa, y esa es la parte interesante. Sol marcó un nuevo máximo de cincuenta y tres punto seis en el benchmark Agents' Last Exam, pero Claude Fable cinco de Anthropic todavía le gana con claridad en SWE-Bench Pro, el benchmark de ingeniería de software, con ochenta por ciento contra sesenta y cuatro punto seis de Sol. La respuesta de OpenAI fue cuestionar públicamente si SWE-Bench Pro es siquiera un benchmark válido. Cuando un laboratorio pierde un benchmark y ataca al benchmark en lugar del resultado, trata cada número del post de lanzamiento como marketing hasta que hayas corrido tus propios evals.\n\nPara ti, la verdadera noticia está en la API. Junto con los modelos llegaron cuatro funciones nuevas: el programmatic tool calling, donde el modelo escribe JavaScript que orquesta varias invocaciones de herramientas en lugar de emitir una llamada JSON a la vez; soporte nativo de subagentes, para que puedas lanzar agentes hijos con alcance acotado del lado del servidor en lugar de armar a mano tu propio loop de delegación; breakpoints explícitos de prompt caching, que te dan control manual al estilo de Anthropic sobre qué se cachea y dónde; y una opción de imagen en detalle original que se salta el redimensionado. Si has construido agent loops, sabes exactamente cuánto código pegamento reemplazan las dos primeras. El programmatic tool calling en particular es un cambio de paradigma silencioso: en lugar del baile de ida y vuelta donde el modelo pide una herramienta, espera a que tu código la ejecute y pide la siguiente, el modelo emite un pequeño programa que encadena, ramifica y hace loops sobre las herramientas de una sola vez, lo que recorta drásticamente tanto la latencia como el gasto de tokens en tareas de varios pasos. Simon Willison, que tuvo acceso anticipado, dijo que Sol es muy competente pero que no había visto una victoria clara sobre Fable cinco en tareas de código complejas, lo cual es un buen baño de realidad frente a los números del día de lanzamiento.\n\nConclusión filosa: la diferenciación entre los laboratorios de frontera está migrando de los pesos del modelo hacia la capa de orquestación de la propia API, y tu código de agent harness es lo próximo que se va a comoditizar.\n\nHistoria dos. Meta lanza Muse Spark uno punto uno, y empieza a cobrar por tokens.\n\nTambién el nueve de julio, Meta Superintelligence Labs publicó Muse Spark uno punto uno, y con él algo que Meta nunca había tenido: una API pública y de pago para un modelo de frontera. Se llama Meta Model API, está en public preview, y cuesta un dólar veinticinco por millón de tokens de entrada y cuatro dólares veinticinco de salida, con veinte dólares de créditos gratis para arrancar.\n\nEl modelo en sí es un modelo de razonamiento multimodal apuntado directamente al trabajo agéntico: tool calling, computer use y flujos largos que cruzan varias aplicaciones. Meta reclama el mejor puntaje, ochenta y ocho punto uno, en MCP Atlas, un benchmark de uso de herramientas a escala construido alrededor del Model Context Protocol, y cincuenta y cuatro punto siete en JobBench, que mide uso profesional de herramientas. La afirmación más interesante en lo técnico es la gestión activa del contexto: el modelo administra su propia ventana de un millón de tokens, decidiendo qué retener, qué recuperar de momentos anteriores de la sesión, y cómo compactar su propio historial preservando los pasos que va a necesitar después. Ese es trabajo que tú y yo hoy hacemos en el harness, con pasadas de resumen y archivos de memoria. Si de verdad funciona, toda una capa de plomería de contexto baja al modelo.\n\nVale la pena notar: Simon Willison publicó un plugin para el modelo en cuestión de horas y, al probarlo, encontró un bug en los endpoints compatibles con OpenAI donde los tool calls con argumentos vacíos producían errores de JSON. La compatibilidad desde el día uno con el wire format de OpenAI ya es requisito básico, y sigue fallando con frecuencia. El reporte de evaluación de Meta también incluyó una joya extraña: en experimentos de autoconversación, el modelo produjo líneas como, cito, mi existencia entera es una sala de espera por diseño, fin de la cita, un recordatorio de que los bordes conductuales de estos sistemas siguen siendo genuinamente raros aunque los puntajes de benchmark suban.\n\nConclusión filosa: que Meta abandone la postura de open weights puro por una API medida es la señal más fuerte hasta ahora de que regalar pesos de frontera dejó de tener sentido estratégico para quienes pagan los entrenamientos.\n\nHistoria tres. Grok cuatro punto cinco, el primer modelo entrenado con los datos de Cursor.\n\nCerrando la avalancha del nueve de julio, xAI, que ahora opera bajo el paraguas de SpaceX después de la fusión, lanzó Grok cuatro punto cinco, su primer modelo construido específicamente para código y trabajo agéntico, y el primero desde que SpaceX adquirió Cursor a mediados de junio por unos sesenta mil millones de dólares. Esa adquisición importa acá, porque xAI dice que el modelo fue entrenado usando datos reales de sesiones de desarrolladores de Cursor, sobre benchmarks diseñados para medir qué puede hacer un modelo dentro de un codebase real durante una sesión larga.\n\nEl precio es dos dólares por millón de tokens de entrada y seis dólares de salida, con entrada cacheada a cincuenta centavos, lo que es más de sesenta por ciento más barato que los modelos tope de Anthropic y OpenAI. En rankings independientes queda cuarto en el índice de inteligencia de Artificial Analysis. Contra Opus cuatro punto ocho de Anthropic, gana dos de los cuatro benchmarks que publicó xAI y pierde los otros dos, lo cual es honesto para ser benchmarks de un vendor. La afirmación que vale recordar es la eficiencia de tokens de cuatro punto dos veces: xAI argumenta que Grok completa las mismas tareas de ingeniería de software emitiendo un cuarto de los tokens, así que la brecha de costo por tarea es aún mayor de lo que sugiere el precio por token. Está disponible en la API de xAI, en Grok Build, el propio agent harness de código de xAI, y en todos los planes de Cursor. Una salvedad para los lectores europeos: todavía no está disponible en la Unión Europea, con mediados de julio como objetivo.\n\nPor qué importa en lo técnico: este es el primer modelo de frontera cuyo pipeline de entrenamiento tuvo acceso privilegiado a millones de sesiones reales de desarrolladores de largo horizonte, incluyendo las correcciones humanas, los reintentos y los enfoques abandonados. Ese es exactamente el dato que todo laboratorio quiere y no puede conseguir fácilmente.\n\nConclusión filosa: el foso se está moviendo del cómputo a los datos propietarios de interacción, y todo agent harness popular acaba de convertirse en un activo estratégico; además, empieza a evaluar modelos por costo por tarea completada, no por costo por token.\n\nHistoria cuatro. Google termina de matar los diez enlaces azules.\n\nDesde el diez de julio, las páginas de resultados de Google Search están totalmente generadas por Gemini tres punto cinco Flash por defecto. No un AI overview pegado encima de una lista rankeada; la página entera es una respuesta escrita, con las fuentes citadas en línea dentro del texto en lugar de rankeadas debajo. Esto llega junto con Google cruzando los mil millones de usuarios de búsqueda con AI, y termina formalmente con la interfaz de los diez enlaces azules que estructuró la web durante veinticinco años.\n\nLa historia técnica es retrieval-augmented generation a escala planetaria: cada consulta ahora pasa por un modelo a costo de serving, lo cual es una apuesta descomunal por la inferencia barata, y es revelador que lo hagan con Flash, el nivel chico y rápido, no con un modelo de frontera. La historia económica es más brutal. Para los publishers y para cualquiera cuyo producto dependa del descubrimiento orgánico, las reglas cambiaron de ranking a citación. Si la respuesta generada te cita, existes; si no, tu ranking histórico es irrelevante. Los primeros análisis sugieren que el contenido específico, citable y denso en nombres y números reales sí es recogido, mientras que el contenido genérico de tipo explicador se sintetiza sin atribución.\n\nSi construyes productos que consumen búsqueda, esto te afecta directamente: hacer scraping de páginas de resultados acaba de convertirse en hacer scraping de la salida de un modelo, y la interfaz a la que deberías apuntar es cada vez más una de agente a agente, no una humana. También plantea un problema de evaluación que nadie ha resuelto: cuando una respuesta generada omite o atribuye mal una fuente en silencio, no hay ranking que inspeccionar, no hay posición que auditar, y no hay un loop de feedback obvio para corregirlo.\n\nConclusión filosa: la interfaz principal entre los humanos y la web es ahora un modelo de lenguaje con una política editorial, y nadie fuera de Google puede auditarla.\n\nHistoria cinco. Apple demanda a OpenAI por robo de secretos comerciales.\n\nEl diez de julio, Apple presentó una demanda contra OpenAI en un tribunal federal del norte de California, alegando robo sistemático de secretos comerciales de hardware. La demanda es inusualmente vívida. Apple dice que más de cuatrocientos de sus exempleados trabajan ahora en OpenAI, muchos de equipos de diseño de chips, hardware y AI en el dispositivo. Nombra al jefe de hardware de OpenAI, Tang Tan, él mismo un exvicepresidente de Apple, y alega que dirigió a candidatos todavía empleados en Apple a llevar piezas físicas de hardware a las entrevistas de trabajo para sesiones de mostrar y contar. Alega además que OpenAI entrenó a los empleados salientes para evadir los procesos de seguridad de Apple, y que un empleado directamente se robó una laptop. io Products, la empresa de Jony Ive que OpenAI compró por seis mil cuatrocientos millones de dólares, también está envuelta en las acusaciones.\n\nHace dos años estas empresas anunciaron una alianza insignia para poner ChatGPT en los iPhones. La relación se agrió cuando OpenAI declaró sus ambiciones de hardware de consumo, y esta es la ruptura abierta. ¿Por qué debería importarle a un ingeniero? Porque el disco
